<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Drawing — migue100.com</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
    <meta name="author" content="Miguel Otero">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --neon-blue:   #00d4ff; --smoke-gray: #bebec8;
            --neon-dim:    #0099cc;
            --steel-dark:  #08090d;
            --steel-panel: #1a1e28;
            --chrome:      #8ab4cc;
            --text-main:   #cce8f4;
            --text-dim:    #5a7a90;
            --sw-bg:       #020408;
            --sw-text:     #a8c8e0;
            --sw-g:        #4fc3f7;
            --sw-m:        #ffb74d;
            --sw-n:        #455a64;
            --sw-comment:  #2e4a58;
            --sw-cycle:    #ce93d8;
            --sw-val:      #80cbc4;
            --sw-tf:       #81c784;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            background-color: var(--steel-dark);
            background-image:
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,180,255,0.015) 2px, rgba(0,180,255,0.015) 4px),
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,180,255,0.02) 40px, rgba(0,180,255,0.02) 41px),
                linear-gradient(160deg, #08090d 0%, #101520 30%, #0d1a2a 55%, #101520 80%, #08090d 100%);
            min-height: 100vh;
            color: var(--text-main);
            padding: 80px 20px 80px;
            overflow-x: hidden;
        }

        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
            pointer-events: none; z-index: 999;
        }

        /* ── Nav ── */
        .site-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 900;
            padding: 0 2rem; height: 56px;
            background: rgba(8,9,13,0.9); backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(190, 190, 200, 0.18);
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.15rem; font-weight: 400; letter-spacing: 0.15em;
            color: #fff; text-decoration: none; background: none; border: none;
            cursor: pointer;
            text-shadow: 0 0 4px #fff, 0 0 12px var(--neon-blue), 0 0 28px rgba(0,180,255,0.35);
            transition: text-shadow 0.3s ease;
        }
        .nav-logo:hover {
            text-shadow: 0 0 6px #fff, 0 0 18px var(--neon-blue), 0 0 40px rgba(0,180,255,0.5);
        }
        .nav-back {
            font-family: 'Share Tech Mono', monospace; font-size: 0.7rem;
            letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--neon-blue); text-decoration: none;
            padding: 0.4rem 0.9rem;
            background: rgba(0,212,255,0.04);
            border: 1px solid rgba(190, 190, 200, 0.22); border-radius: 3px;
            transition: all 0.25s ease;
        }
        .nav-back:hover {
            background: rgba(0,212,255,0.1);
            border-color: var(--smoke-gray); color: #fff;
            box-shadow: 0 0 10px rgba(0,212,255,0.2);
        }

        .lang-switch { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .lang-trigger {
            display: flex; align-items: center; gap: 0.32rem;
            background: rgba(0,212,255,0.04); border: 1px solid rgba(190, 190, 200, 0.22); border-radius: 3px;
            padding: 0.22rem 0.5rem; font-family: 'Share Tech Mono', monospace; font-size: 0.68rem;
            letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); line-height: 1;
            cursor: pointer; transition: all 0.25s ease;
        }
        .lang-trigger-flag { font-size: 0.95rem; line-height: 1; }
        .lang-trigger-caret { font-size: 0.6rem; transition: transform 0.25s ease; }
        .lang-trigger:hover, .lang-switch.open .lang-trigger {
            border-color: var(--smoke-gray); background: rgba(0,212,255,0.1);
            box-shadow: 0 0 10px rgba(0,212,255,0.2); color: #fff;
        }
        .lang-switch.open .lang-trigger-caret { transform: rotate(180deg); }
        .lang-menu {
            position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(-6px);
            display: flex; flex-direction: column; gap: 0.28rem;
            background: rgba(8,9,13,0.97); border: 1px solid rgba(190, 190, 200, 0.22); border-radius: 4px;
            padding: 0.35rem; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 950;
        }
        .lang-switch.open .lang-menu { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .lang-menu .lang-btn {
            display: flex; align-items: center; gap: 0.45rem; width: 100%; white-space: nowrap;
            background: rgba(0,212,255,0.04); border: 1px solid rgba(190, 190, 200, 0.18); border-radius: 3px;
            padding: 0.3rem 0.6rem; font-family: 'Share Tech Mono', monospace; font-size: 0.72rem;
            letter-spacing: 0.05em; color: var(--text-dim); cursor: pointer; transition: all 0.2s ease;
        }
        .lang-menu .lang-btn:hover { border-color: var(--smoke-gray); background: rgba(0,212,255,0.1); color: #fff; }
        #google_translate_element, .goog-te-banner-frame, .skiptranslate { display: none !important; }
        body { top: 0px !important; }
        html.translated-ltr body, html.translated-rtl body { top: 0 !important; }
        @media (max-width: 560px) { .lang-trigger-label { display: none; } }
        @media (max-width: 768px) {
            .site-nav { padding: 0 1rem; height: 50px; }
            .nav-logo { font-size: 0.9rem; }
            .nav-back { font-size: 0.6rem; padding: 0.35rem 0.6rem; }
        }
        @media (max-width: 480px) {
            .site-nav { padding: 0 0.6rem; }
            .nav-logo { font-size: 0.78rem; letter-spacing: 0.1em; }
            .nav-back { font-size: 0.55rem; padding: 0.28rem 0.45rem; letter-spacing: 0.12em; }
        }

        /* ── Page Header ── */
        .page-header { max-width: 1200px; margin: 0 auto 32px; }
        .page-tag {
            font-family: 'Share Tech Mono', monospace; font-size: 0.6em;
            letter-spacing: 0.22em; color: var(--neon-dim); margin-bottom: 6px;
        }
        .page-tag::before { content: '['; }
        .page-tag::after  { content: ']'; }
        .page-title {
            font-family: 'Share Tech Mono', monospace; font-size: 1.6em;
            letter-spacing: 0.1em; color: var(--text-main); text-transform: uppercase;
        }
        .page-title span { color: var(--neon-blue); }
        .page-divider {
            margin-top: 12px; height: 1px;
            background: linear-gradient(90deg, rgba(0,212,255,0.5), transparent);
        }

        /* ── Section Label ── */
        .section-label {
            max-width: 1200px; margin: 48px auto 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.58em; letter-spacing: 0.28em;
            color: var(--neon-dim); text-transform: uppercase;
            display: flex; align-items: center; gap: 12px;
        }
        .section-label::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(0,212,255,0.2), transparent);
        }

        /* ── Drawing Panel ── */
        .drawing-panel {
            max-width: 1200px; margin: 0 auto;
            background: linear-gradient(160deg, rgba(26,30,40,0.95) 0%, rgba(18,22,32,0.98) 50%, rgba(22,26,38,0.95) 100%);
            border: 1px solid rgba(190, 190, 200, 0.18); border-radius: 4px; overflow: hidden;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .drawing-panel::before {
            content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.5), transparent);
        }
        .drawing-panel::after {
            content: ''; position: absolute; top: 6px; right: 6px;
            width: 8px; height: 8px;
            border-top: 2px solid rgba(190, 190, 200, 0.4); border-right: 2px solid rgba(190, 190, 200, 0.4);
            pointer-events: none;
        }
        .drawing-panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; border-bottom: 1px solid rgba(190, 190, 200, 0.1);
        }
        .drawing-panel-title {
            font-family: 'Share Tech Mono', monospace; font-size: 0.62em;
            letter-spacing: 0.16em; color: var(--text-dim); text-transform: uppercase;
        }
        .drawing-panel-id {
            font-family: 'Share Tech Mono', monospace; font-size: 0.56em;
            letter-spacing: 0.1em; color: rgba(0,212,255,0.4);
        }
        .drawing-area {
            min-height: 560px; display: flex; align-items: center;
            justify-content: center; padding: 0; position: relative; overflow: hidden;
        }
        .drawing-area img {
            width: 100%; height: auto; display: block;
            filter: invert(1) sepia(1) hue-rotate(175deg) saturate(6) brightness(1.1);
        }
        .drawing-placeholder {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 16px; opacity: 0.4;
        }
        .drawing-placeholder svg { width: 120px; height: 120px; }
        .drawing-placeholder-text {
            font-family: 'Share Tech Mono', monospace; font-size: 0.6em;
            letter-spacing: 0.2em; color: var(--text-dim); text-transform: uppercase;
        }
        .drawing-panel-footer {
            padding: 10px 16px; border-top: 1px solid rgba(190, 190, 200, 0.1);
            display: flex; gap: 32px; align-items: center; flex-wrap: wrap;
        }
        .drawing-meta { display: flex; flex-direction: column; gap: 2px; }
        .drawing-meta-label {
            font-family: 'Share Tech Mono', monospace; font-size: 0.46em;
            letter-spacing: 0.18em; color: rgba(0,212,255,0.35); text-transform: uppercase;
        }
        .drawing-meta-value {
            font-family: 'Rajdhani', sans-serif; font-size: 0.78em;
            font-weight: 600; color: var(--text-main); letter-spacing: 0.04em;
        }

        /* ── CAM Video Panel ── */
        .video-panel {
            max-width: 1200px; margin: 0 auto;
            background: linear-gradient(160deg, rgba(22,26,36,0.97) 0%, rgba(14,18,28,1) 100%);
            border: 1px solid rgba(190, 190, 200, 0.18); border-radius: 4px; overflow: hidden;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
            position: relative; z-index: 1000;
        }
        .video-panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; border-bottom: 1px solid rgba(190, 190, 200, 0.1);
            background: rgba(0,0,0,0.3);
        }
        .video-panel-label {
            font-family: 'Share Tech Mono', monospace; font-size: 0.58em;
            letter-spacing: 0.2em; color: var(--neon-dim); text-transform: uppercase;
        }
        .video-panel-badge {
            font-family: 'Share Tech Mono', monospace; font-size: 0.5em;
            letter-spacing: 0.12em; color: rgba(0,212,255,0.4); text-transform: uppercase;
        }
        .video-wrap {
            background: #000;
            position: relative;
            user-select: none;
            aspect-ratio: 16 / 9;
            width: 100%;
        }
        .video-wrap video {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: block; outline: none;
            object-fit: contain;
        }
        /* center overlay (play/pause) */
        .vp-overlay {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.22s ease;
            pointer-events: none;
            z-index: 10;
        }
        .vp-overlay.faded { opacity: 0; }
        .vp-play-btn {
            width: 70px; height: 70px; border-radius: 50%;
            background: rgba(0,0,0,0.52);
            border: 2px solid rgba(190, 190, 200, 0.75);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 22px rgba(0,212,255,0.3);
            transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s;
            pointer-events: all; cursor: pointer;
        }
        .vp-play-btn:hover {
            transform: scale(1.09);
            border-color: #00d4ff;
            box-shadow: 0 0 36px rgba(0,212,255,0.5);
        }
        .vp-icon-play {
            width: 0; height: 0;
            border: solid transparent;
            border-width: 11px 0 11px 20px;
            border-left-color: #00d4ff;
            margin-left: 5px;
        }
        .vp-icon-pause {
            display: flex; gap: 5px;
        }
        .vp-icon-pause b {
            display: block; width: 4px; height: 20px;
            background: #00d4ff; border-radius: 2px; font-weight: normal;
        }
        /* bottom bar */
        .vp-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 10px 16px 12px;
            background: linear-gradient(to top, rgba(0,0,0,0.82) 0%, transparent 100%);
            display: flex; flex-direction: column; gap: 7px;
            z-index: 11;
            transition: opacity 0.22s ease;
        }
        .vp-bar.faded { opacity: 0; pointer-events: none; }
        /* progress */
        .vp-progress {
            width: 100%; height: 4px;
            background: rgba(255,255,255,0.14);
            border-radius: 2px; cursor: pointer; position: relative;
        }
        .vp-progress:hover { height: 6px; }
        .vp-fill {
            height: 100%; width: 0%;
            background: #00d4ff; border-radius: 2px;
            box-shadow: 0 0 6px rgba(0,212,255,0.55);
            pointer-events: none;
        }
        .vp-knob {
            position: absolute; top: 50%;
            width: 12px; height: 12px; border-radius: 50%;
            background: #fff; margin-left: -6px;
            transform: translateY(-50%);
            opacity: 0; transition: opacity 0.14s;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(0,212,255,0.8);
        }
        .vp-progress:hover .vp-knob { opacity: 1; }
        /* row */
        .vp-row {
            display: flex; align-items: center; gap: 10px;
        }
        .vp-btn {
            background: none; border: none; cursor: pointer; padding: 0;
            display: flex; align-items: center; color: rgba(255,255,255,0.75);
            transition: color 0.14s; position: static;
        }
        .vp-btn:hover { color: #fff; }
        .vp-btn svg { width: 18px; height: 18px; display: block; fill: currentColor; }
        .vp-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.5em; letter-spacing: 0.08em;
            color: rgba(255,255,255,0.55); white-space: nowrap;
        }
        .vp-spacer { flex: 1; }
        .vp-vol {
            -webkit-appearance: none; appearance: none;
            width: 68px; height: 3px;
            background: rgba(255,255,255,0.2); border-radius: 2px;
            outline: none; cursor: pointer;
        }
        .vp-vol::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 11px; height: 11px; border-radius: 50%;
            background: #00d4ff;
            box-shadow: 0 0 5px rgba(0,212,255,0.7);
        }

        /* ── Turning Video Gallery (horizontal scroll) ── */
        .turning-gallery-scroll {
            display: flex; gap: 0; padding: 0;
            overflow-x: auto; scroll-snap-type: x mandatory;
            scrollbar-width: thin; scrollbar-color: rgba(0,212,255,0.3) transparent;
        }
        .turning-gallery-scroll::-webkit-scrollbar { height: 4px; }
        .turning-gallery-scroll::-webkit-scrollbar-thumb { background: rgba(0,212,255,0.3); border-radius: 2px; }
        .turning-video-item {
            flex: 0 0 100%; width: 100%;
            scroll-snap-align: start; display: flex; flex-direction: column;
            background: #000;
        }
        .turning-video-label {
            padding: 7px 12px;
            background: rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(190, 190, 200, 0.1);
            font-family: 'Share Tech Mono', monospace; font-size: 0.5em;
            letter-spacing: 0.14em; color: rgba(0,212,255,0.55); text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
        }
        .turning-video-num {
            font-size: 1.5em; font-weight: 700; color: #00d4ff;
            text-shadow: 0 0 10px rgba(0,212,255,0.55);
        }
        .turning-video-wrap {
            position: relative; background: #000;
            user-select: none; aspect-ratio: 16/9; width: 100%;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06),
                        0 4px 32px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.04);
        }
        .turning-video-item video {
            position: absolute; inset: 0;
            width: 100%; height: 100%; display: block; outline: none;
            object-fit: contain;
        }
        /* ── Video index indicator ── */
        .tg-index {
            display: flex; align-items: center; gap: 8px;
            font-family: 'Share Tech Mono', monospace; font-size: 0.48em;
            letter-spacing: 0.12em; color: rgba(255,255,255,0.2); text-transform: uppercase;
        }
        .tg-index-label { color: rgba(0,212,255,0.35); }
        .tg-idx-num {
            cursor: pointer; padding: 1px 3px;
            transition: color 0.2s, text-shadow 0.2s;
        }
        .tg-idx-num.active {
            color: #ff1744;
            text-shadow: 0 0 8px rgba(255,23,68,0.9), 0 0 22px rgba(255,23,68,0.5);
        }

        /* ── G-CODE Grid ── */
        .gcode-grid {
            max-width: 1200px; margin: 0 auto;
        }
        @media (max-width: 768px) {
            .drawing-area { min-height: unset; }
            .drawing-area img { width: 100%; height: auto; }
        }

        /* ── Siemens Window Chrome ── */
        .siemens-win {
            border-radius: 3px; overflow: hidden;
            box-shadow: 0 6px 28px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
            display: flex; flex-direction: column;
            background: #12141c;
            border: 2px solid #252830;
        }

        /* Title bar — dark Siemens header */
        .sw-titlebar {
            background: #0c0e16;
            border-bottom: 1px solid #1e2130;
            padding: 6px 10px;
            display: flex; align-items: flex-start;
            flex-shrink: 0;
        }
        .sw-titlebar-left {
            display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
        }
        .sw-logo {
            font-family: 'Rajdhani', sans-serif; font-weight: 700;
            font-size: 1.08em; letter-spacing: 0.06em; color: #3a9ad9;
            text-transform: uppercase;
        }

        /* Screen area */
        .sw-screen {
            background: var(--sw-bg);
            position: relative;
        }
        /* CRT vignette */
        .sw-screen::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.45) 100%);
        }
        .sw-code-wrap {
            /* Height hugs the actual line count; caps at ~300 lines, then scrolls internally */
            max-height: 8000px; overflow-y: auto;
            padding: 8px 0;
            scrollbar-width: thin;
            scrollbar-color: #1a2030 transparent;
            /* Read-only display: no text selection / copy for site visitors */
            user-select: none; -webkit-user-select: none;
            -moz-user-select: none; -ms-user-select: none;
        }
        .sw-code-wrap::-webkit-scrollbar { width: 4px; }
        .sw-code-wrap::-webkit-scrollbar-thumb { background: #1e2a3a; border-radius: 2px; }
        /* 3-column code table: N° / G-CODE / COMMENT */
        .sw-code-table {
            width: 100%; border-collapse: collapse;
            font-family: 'Share Tech Mono', monospace;
        }
        .sw-code-table thead th {
            position: sticky; top: 0; z-index: 1;
            background: #0a0c14; border-bottom: 1px solid #1a2030;
            text-align: left; padding: 8px 13px;
            font-size: 0.65em; letter-spacing: 0.12em;
            color: #3a5268; text-transform: uppercase;
        }
        .sw-code-table thead th.sw-ct-comment { text-align: right; }
        .sw-code-table tbody tr:hover { background: rgba(0,160,220,0.05); }
        .sw-code-table td {
            padding: 2px 10px; vertical-align: baseline;
            font-size: 0.864em; line-height: 1.55;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .sw-ct-n {
            width: 44px; min-width: 44px; text-align: right;
            color: #1e3040; user-select: none; white-space: nowrap;
        }
        /* Line-flag button — click to mark a line as critical; stays highlighted until toggled again */
        .sw-ct-flag {
            background: none; border: none; width: 100%;
            font: inherit; color: inherit; text-align: right;
            padding: 2px 4px; margin: -2px -4px;
            cursor: pointer; border-radius: 3px;
            transition: color 0.15s, text-shadow 0.15s, background 0.15s;
        }
        .sw-ct-flag:hover { color: #7ab4c8; background: rgba(0,180,255,0.08); }
        .sw-ct-row.sw-ct-flagged { background: rgba(255,23,68,0.08); }
        .sw-ct-row.sw-ct-flagged .sw-ct-flag {
            color: #ff1744;
            text-shadow: 0 0 6px rgba(255,23,68,0.85), 0 0 16px rgba(255,23,68,0.4);
        }
        .sw-ct-row.sw-ct-flagged .sw-ct-code { color: #ffb3ab; }
        .sw-ct-row.sw-ct-flagged .sw-ct-ctext,
        .sw-ct-row.sw-ct-flagged.sw-ct-detail .sw-ct-detail-box { color: #d98a86; }
        tr.sw-ct-detail.sw-ct-flagged .sw-ct-detail-box {
            border-left-color: #ff1744;
            background: rgba(255,23,68,0.08);
        }
        .sw-ct-code { color: var(--sw-text); white-space: pre; }
        .sw-ct-comment {
            color: var(--sw-comment);
            font-family: 'Rajdhani', sans-serif; font-size: 0.92em;
            text-align: right;
        }
        /* Mobile-only comment toggle button */
        .sw-ct-cbtn {

    <script>
    /* ── Custom Video Player ── */
    (function() {
        const vid      = document.getElementById('cam-video');
        const wrap     = document.getElementById('vp-wrap');
        const overlay  = document.getElementById('vp-overlay');
        const playBtn  = document.getElementById('vp-play-btn');
        const icon     = document.getElementById('vp-icon');
        const bar      = document.getElementById('vp-bar');
        const progress = document.getElementById('vp-progress');
        const fill     = document.getElementById('vp-fill');
        const knob     = document.getElementById('vp-knob');
        const ppBtn    = document.getElementById('vp-pp');
        const ppIcon   = document.getElementById('vp-pp-icon');
        const timeEl   = document.getElementById('vp-time');
        const muteBtn  = document.getElementById('vp-mute');
        const muteIcon = document.getElementById('vp-mute-icon');
        const volSlider= document.getElementById('vp-vol');
        const fsBtn    = document.getElementById('vp-fs');

        let hideTimer = null;
        let scrubbing = false;

        function fmt(s) {
            s = Math.floor(s || 0);
            const m = Math.floor(s / 60), ss = s % 60;
            return m + ':' + String(ss).padStart(2, '0');
        }
        function setPlaying(playing) {
            /* center icon */
            icon.className = playing ? 'vp-icon-pause' : 'vp-icon-play';
            if (playing) {
                icon.innerHTML = '<b></b><b></b>';
            } else {
                icon.innerHTML = '';
            }
            /* bottom bar icon */
            ppIcon.setAttribute('d', playing
                ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z'
                : 'M8 5v14l11-7z');
        }
        function showControls() {
            overlay.classList.remove('faded');
            bar.classList.remove('faded');
            clearTimeout(hideTimer);
            if (!vid.paused) {
                hideTimer = setTimeout(() => {
                    overlay.classList.add('faded');
                    bar.classList.add('faded');
                }, 2800);
            }
        }
        function updateProgress() {
            if (!vid.duration || scrubbing) return;
            const pct = (vid.currentTime / vid.duration) * 100;
            fill.style.width = pct + '%';
            knob.style.left  = pct + '%';
            timeEl.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
        }
        function seekTo(e) {
            const rect = progress.getBoundingClientRect();
            const pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            vid.currentTime = pct * vid.duration;
            fill.style.width = (pct * 100) + '%';
            knob.style.left  = (pct * 100) + '%';
        }

        /* play / pause */
        function togglePlay() {
            if (vid.paused) { vid.play(); } else { vid.pause(); }
        }
        playBtn.addEventListener('click', togglePlay);
        ppBtn.addEventListener('click',  togglePlay);
        wrap.addEventListener('click', e => {
            if (e.target === vid) togglePlay();
        });

        vid.addEventListener('play',  () => { setPlaying(true);  showControls(); });
        vid.addEventListener('pause', () => { setPlaying(false); showControls(); });
        vid.addEventListener('timeupdate', updateProgress);
        vid.addEventListener('loadedmetadata', updateProgress);
        vid.addEventListener('ended', () => { setPlaying(false); showControls(); });

        /* scrub */
        progress.addEventListener('mousedown', e => {
            scrubbing = true; seekTo(e);
        });
        window.addEventListener('mousemove', e => { if (scrubbing) seekTo(e); });
        window.addEventListener('mouseup',   () => { scrubbing = false; });

        /* show controls on mouse move */
        wrap.addEventListener('mousemove', showControls);
        wrap.addEventListener('mouseenter', showControls);
        wrap.addEventListener('mouseleave', () => {
            if (!vid.paused) {
                overlay.classList.add('faded');
                bar.classList.add('faded');
            }
        });

        /* mute */
        muteBtn.addEventListener('click', () => {
            vid.muted = !vid.muted;
            muteIcon.setAttribute('d', vid.muted
                ? 'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0 0 17.73 18L19 19.27 20.27 18 5.27 3 4.27 3zM12 4L9.91 6.09 12 8.18V4z'
                : 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z');
        });

        /* volume */
        volSlider.addEventListener('input', () => {
            vid.volume = parseFloat(volSlider.value);
            vid.muted  = vid.volume === 0;
        });

        /* fullscreen */
        fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                wrap.requestFullscreen && wrap.requestFullscreen();
            } else {
                document.exitFullscreen && document.exitFullscreen();
            }
        });

        /* init */
        setPlaying(false);
        showControls();
    })();
    </script>

            id: 'DWG-A5-001', project: 'A5-PROJECT CAM',
            image: 'https://jzvezovdglfzjyslahoz.supabase.co/storage/v1/object/public/images/DRAWINGS/D5.png', prog: 'A5_PROFILE.MPF', tool: '1', speed: '3000',
            gcode: `%

N20  T1 D1 M6

N80  G1 X60.0 F1500

;--- MOUNTING HOLES  4 x Ø6 ---

        }
    };

    /* ── Shared G-code program (drilling / tapping / chamfering cycle) ──
       Temporary: same program shown on every drawing until each model
       gets its own line-by-line commented program. */
    const SHARED_PROGRAM = [
        { n: 'N10',  code: 'G90 G17',              comment: 'Program start — absolute programming, XY plane' },
        { n: 'N20',  code: 'T1 M6',                 comment: 'Tool call: center drill Ø2.5 mm — tool change' },
        { n: 'N30',  code: 'S1200 M13',             comment: 'Spindle 1200 rpm, CW rotation with coolant ON' },
        { n: 'N40',  code: 'G0 X50 Y10',            comment: 'Rapid positioning to point P4' },
        { n: 'N50',  code: 'Z2',                    comment: 'Rapid approach to workpiece at safety height' },
        { n: 'N60',  code: 'G81 Z-6 F80',           comment: 'Drilling canned cycle — depth -6 mm, feed 80 mm/min' },
        { n: 'N70',  code: 'Y30',                   comment: 'Rapid move to point P3 — hole executed automatically' },
        { n: 'N80',  code: 'X10',                   comment: 'Rapid move to point P2 — hole executed automatically' },
        { n: 'N90',  code: 'Y10',                   comment: 'Rapid move to point P1 — hole executed automatically' },
        { n: 'N100', code: 'G80 X-50 T2 M6',        comment: 'Cancel canned cycle, tool change: twist drill Ø6.5 mm' },
        { n: 'N120', code: 'G0 X10 Y10 S950 M13',   comment: 'Position at P1, spindle 950 rpm CW with coolant ON' },
        { n: 'N130', code: 'Z2',                    comment: 'Rapid approach to workpiece at safety height' },
        { n: 'N140', code: 'G81 Z-20 F60',          comment: 'Drilling canned cycle — depth -20 mm, feed 60 mm/min' },
        { n: 'N150', code: 'Y30',                   comment: 'Rapid move to point P2 — hole executed automatically' },
        { n: 'N160', code: 'X50',                   comment: 'Rapid move to point P3 — hole executed automatically' },
        { n: 'N170', code: 'Y10',                   comment: 'Rapid move to point P4 — hole executed automatically' },
        { n: 'N180', code: 'G80 X100 T3 M6',        comment: 'Cancel canned cycle, tool change: M8 tap' },
        { n: 'N190', code: 'G0 X50 Y30 S200 M13',   comment: 'Position at P3, spindle 200 rpm CW with coolant ON' },
        { n: 'N200', code: 'Z2',                    comment: 'Rapid approach to workpiece at safety height' },
        { n: 'N210', code: 'G84 Z-20 F250',         comment: 'Tapping canned cycle — depth -20 mm, feed 250 mm/min' },
        { n: 'N220', code: 'X10 Y10',                comment: 'Rapid move to point P1 — thread executed automatically' },
        { n: 'N230', code: 'G80 X-50 T4 M6',        comment: 'Cancel canned cycle, tool change: 90° countersink' },
        { n: 'N240', code: 'G0 X10 Y10 S400 M13',   comment: 'Position at P1, spindle 400 rpm CW with coolant ON' },
        { n: 'N250', code: 'Z2',                    comment: 'Rapid approach to workpiece at safety height' },
        { n: 'N260', code: 'G81 Z-2.5 F80',         comment: 'Chamfering canned cycle — depth -2.5 mm, feed 80 mm/min' },
        { n: 'N270', code: 'X50 Y30',                comment: 'Rapid move to point P3 — chamfer executed automatically' },
        { n: 'N280', code: 'G0 X100 Y50 Z30 M30',   comment: 'Move out of work area for part change — spindle stop, program end' }
    ];

    /* ── Init ── */
    const num = parseInt(window.location.hash.replace('#', '')) || 1;
    const m   = MODELS[num] || MODELS[1];

    document.title = m.project + ' Drawing — migue100.com';
    document.getElementById('page-tag').textContent     = m.tag;
    document.getElementById('sw-logo-title').textContent = 'G-CODE: ' + m.tag;
    document.getElementById('panel-title').textContent  = m.title;
    document.getElementById('panel-id').textContent     = m.id;
    document.getElementById('meta-project').textContent = m.project;
    document.getElementById('video-prog-name').textContent = m.prog;

    const drawingArea = document.getElementById('drawing-area');
    drawingArea.querySelectorAll('img').forEach(el => el.remove());
    if (m.image) {
        const img = document.createElement('img');
        img.src = m.image; img.alt = m.project + ' technical drawing';
        img.onerror = function() {
            if (img.src.endsWith('.jpg')) { img.src = m.image.replace(/\.jpg$/, '.png'); }
            else if (img.src.endsWith('.png')) { img.src = m.image.replace(/\.png$/, '.jpg'); }
            img.onerror = null;
        };
        document.getElementById('drawing-placeholder').style.display = 'none';
        drawingArea.appendChild(img);
    } else {
        document.getElementById('drawing-placeholder').style.display = '';
    }

    /* ── Horizontal video gallery for models with multiple videos ── */
    if (m.videos && m.videos.length) {
        const panel = document.getElementById('cam-video-panel');
        const indexNums = m.videos.map(function(_, i) {
            return '<span class="tg-idx-num' + (i === 0 ? ' active' : '') + '" data-idx="' + i + '">' + (i + 1) + '</span>';
        }).join('');
        panel.innerHTML =
            '<div class="video-panel-header">' +
                '<span class="video-panel-label">CAM — Machining Footage</span>' +
                '<div class="tg-index">' +
                    '<span class="tg-index-label">Videos:</span>' +
                    indexNums +
                '</div>' +
            '</div>' +
            '<div class="turning-gallery-scroll" id="tg-scroll">' +
                m.videos.map(function(url, i) {
                    return '<div class="turning-video-item" data-idx="' + i + '">' +
                        '<div class="turning-video-label">' +
                            '<span class="turning-video-num">0' + (i + 1) + '</span>' +
                            '<span>Turning Sequence ' + (i + 1) + '</span>' +
                        '</div>' +
                        '<div class="turning-video-wrap">' +
                            '<video src="' + url + '" poster="' + (m.posters && m.posters[i] ? m.posters[i] : '') + '" playsinline preload="metadata"></video>' +
                            '<div class="vp-overlay">' +
                                '<div class="vp-play-btn">' +
                                    '<div class="vp-icon-play"></div>' +
                                '</div>' +
                            '</div>' +
                            '<div class="vp-bar">' +
                                '<div class="vp-progress">' +
                                    '<div class="vp-fill"></div>' +
                                    '<div class="vp-knob"></div>' +
                                '</div>' +
                                '<div class="vp-row">' +
                                    '<button class="vp-btn" title="Play / Pause">' +
                                        '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>' +
                                    '</button>' +
                                    '<span class="vp-time">0:00 / 0:00</span>' +
                                    '<div class="vp-spacer"></div>' +
                                    '<button class="vp-btn" title="Mute">' +
                                        '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>' +
                                    '</button>' +
                                    '<input class="vp-vol" type="range" min="0" max="1" step="0.02" value="1">' +
                                    '<button class="vp-btn" title="Fullscreen">' +
                                        '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>' +
                                    '</button>' +
                                '</div>' +
                            '</div>' +
                        '</div>' +
                    '</div>';
                }).join('') +
            '</div>';

        /* ── Custom player per video ── */
        function makeTurningPlayer(wrap) {
            const vid      = wrap.querySelector('video');
            const overlay  = wrap.querySelector('.vp-overlay');
            const playBtn  = wrap.querySelector('.vp-play-btn');
            const icon     = playBtn.querySelector('div');
            const bar      = wrap.querySelector('.vp-bar');
            const progress = wrap.querySelector('.vp-progress');
            const fill     = wrap.querySelector('.vp-fill');
            const knob     = wrap.querySelector('.vp-knob');
            const ppBtn    = wrap.querySelectorAll('.vp-btn')[0];
            const ppPath   = ppBtn.querySelector('path');
            const timeEl   = wrap.querySelector('.vp-time');
            const muteBtn  = wrap.querySelectorAll('.vp-btn')[1];
            const mutePath = muteBtn.querySelector('path');
            const volSlider= wrap.querySelector('.vp-vol');
            const fsBtn    = wrap.querySelectorAll('.vp-btn')[2];

            let hideTimer = null, scrubbing = false;

            function fmt(s) {
                s = Math.floor(s || 0);
                return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
            }
            let overlayTimer = null;
            function setPlaying(playing) {
                icon.className = playing ? 'vp-icon-pause' : 'vp-icon-play';
                icon.innerHTML = playing ? '<b></b><b></b>' : '';
                ppPath.setAttribute('d', playing ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z');
                if (playing) {
                    overlay.classList.remove('faded');
                    clearTimeout(overlayTimer);
                    overlayTimer = setTimeout(function() { overlay.classList.add('faded'); }, 500);
                } else {
                    clearTimeout(overlayTimer);
                    overlay.classList.remove('faded');
                }
            }
            function showControls() {
                bar.classList.remove('faded');
                clearTimeout(hideTimer);
                if (!vid.paused) {
                    hideTimer = setTimeout(function() { bar.classList.add('faded'); }, 2800);
                }
            }
            function updateProgress() {
                if (!vid.duration || scrubbing) return;
                var pct = (vid.currentTime / vid.duration) * 100;
                fill.style.width = pct + '%';
                knob.style.left  = pct + '%';
                timeEl.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
            }
            function seekTo(e) {
                var rect = progress.getBoundingClientRect();
                var pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                vid.currentTime = pct * vid.duration;
                fill.style.width = (pct * 100) + '%';
                knob.style.left  = (pct * 100) + '%';
            }
            function togglePlay() { vid.paused ? vid.play() : vid.pause(); }

            playBtn.addEventListener('click', togglePlay);
            ppBtn.addEventListener('click', togglePlay);
            wrap.addEventListener('click', function(e) { if (e.target === vid) togglePlay(); });

            vid.addEventListener('play',  function() { setPlaying(true);  showControls(); });
            vid.addEventListener('pause', function() { setPlaying(false); showControls(); });
            vid.addEventListener('timeupdate', updateProgress);
            vid.addEventListener('loadedmetadata', updateProgress);
            vid.addEventListener('ended', function() { setPlaying(false); showControls(); });

            progress.addEventListener('mousedown', function(e) { scrubbing = true; seekTo(e); });
            window.addEventListener('mousemove', function(e) { if (scrubbing) seekTo(e); });
            window.addEventListener('mouseup',   function() { scrubbing = false; });

            wrap.addEventListener('mousemove',  showControls);
            wrap.addEventListener('mouseenter', showControls);
            wrap.addEventListener('mouseleave', function() {
                if (!vid.paused) { bar.classList.add('faded'); }
            });

            muteBtn.addEventListener('click', function() {
                vid.muted = !vid.muted;
                mutePath.setAttribute('d', vid.muted
                    ? 'M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06A8.99 8.99 0 0 0 17.73 18L19 19.27 20.27 18 5.27 3 4.27 3zM12 4L9.91 6.09 12 8.18V4z'
                    : 'M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z');
            });
            volSlider.addEventListener('input', function() {
                vid.volume = parseFloat(volSlider.value);
                vid.muted  = vid.volume === 0;
            });
            fsBtn.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    wrap.requestFullscreen && wrap.requestFullscreen();
                } else {
                    document.exitFullscreen && document.exitFullscreen();
                }
            });

            setPlaying(false);
            showControls();
        }

        /* Index indicator — highlight active video on scroll */
        const scroll = document.getElementById('tg-scroll');
        const items  = scroll.querySelectorAll('.turning-video-item');

        scroll.querySelectorAll('.turning-video-wrap').forEach(makeTurningPlayer);
        const dots   = panel.querySelectorAll('.tg-idx-num');

        function setActive(idx) {
            dots.forEach(function(d) {
                d.classList.toggle('active', parseInt(d.dataset.idx) === idx);
            });
        }

        /* Click on number to jump to that video */
        dots.forEach(function(d) {
            d.addEventListener('click', function() {
                const target = items[parseInt(d.dataset.idx)];
                if (target) target.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
            });
        });

        const obs = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting && entry.intersectionRatio >= 0.5) {
                    setActive(parseInt(entry.target.dataset.idx));
                }
            });
        }, { root: scroll, threshold: 0.5 });

        items.forEach(function(item) { obs.observe(item); });
    }

    /* ── G-code token highlighter (single line) ── */
    function highlightCode(line) {
        return escH(line)
            .replace(/\b(G\d+\.?\d*)/g, '<span class="gk-g">$1</span>')
            .replace(/\b(M\d+)\b/g, '<span class="gk-m">$1</span>')
            .replace(/\b([TDH]\d+)\b/g, '<span class="gk-t">$1</span>')
            .replace(/\b(F[\d.]+)\b/g, '<span class="gk-f">$1</span>');
    }
    function escH(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ── Render the 3-column read-only code table: N° / G-CODE / COMMENT ──
       On mobile the comment column collapses into a 💬 button; tapping it
       opens a detail row with the full comment and an ✕ to close it. */
    function renderCodeTable(program) {
        const rows = program.map(row => {
            const comment = escH(row.comment);
            return `<tr class="sw-ct-row">` +
                `<td class="sw-ct-n">` +
                    `<button type="button" class="sw-ct-flag" onclick="toggleFlag(this)" aria-label="Flag line ${escH(row.n)}">${escH(row.n)}</button>` +
                `</td>` +
                `<td class="sw-ct-code">${highlightCode(row.code)}</td>` +
                `<td class="sw-ct-comment">` +
                    `<span class="sw-ct-ctext">${comment}</span>` +
                    `<button type="button" class="sw-ct-cbtn" onclick="toggleComment(this)" aria-label="Show comment">💬</button>` +
                `</td>` +
            `</tr>` +
            `<tr class="sw-ct-detail" hidden>` +
                `<td colspan="3">` +
                    `<div class="sw-ct-detail-box">` +
                        `<span>${comment}</span>` +
                        `<button type="button" class="sw-ct-close" onclick="toggleComment(this)" aria-label="Close comment">✕</button>` +
                    `</div>` +
                `</td>` +
            `</tr>`;
        }).join('');
        return `<table class="sw-code-table">` +
            `<thead><tr>` +
                `<th class="sw-ct-n">N°</th>` +
                `<th class="sw-ct-code">G-CODE · ISO</th>` +
                `<th class="sw-ct-comment">COMMENT (EN)</th>` +
            `</tr></thead>` +
            `<tbody>${rows}</tbody>` +
        `</table>`;
    }

    document.getElementById('viewer-code').innerHTML = renderCodeTable(SHARED_PROGRAM);

    /* Read-only display: block copy / cut / right-click / drag on the code window */
    (function() {
        const wrap = document.getElementById('viewer-code');
        ['copy', 'cut', 'contextmenu', 'dragstart'].forEach(evt => {
            wrap.addEventListener(evt, e => e.preventDefault());
        });
    })();

    /* Toggle the mobile comment detail row open/closed */
    function toggleComment(btn) {
        if (btn.classList.contains('sw-ct-cbtn')) {
            const detail = btn.closest('tr').nextElementSibling;
            if (detail) detail.hidden = false;
        } else {
            btn.closest('tr').hidden = true;
        }
    }

    /* Flag a line as critical for analysis — stays highlighted until clicked again */
    function toggleFlag(btn) {
        const row = btn.closest('tr');
        row.classList.toggle('sw-ct-flagged');
        const detail = row.nextElementSibling;
        if (detail && detail.classList.contains('sw-ct-detail')) {
            detail.classList.toggle('sw-ct-flagged');
        }
    }

    </script>

    <!-- ── Language switch (ES / IT via Google Website Translator) ── -->
    <div id="google_translate_element"></div>
    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'en', includedLanguages: 'es,it', autoDisplay: false }, 'google_translate_element');
        }
        const LANG_FLAGS = { en: '🇬🇧', es: '🇪🇸', it: '🇮🇹' };
        function toggleLangMenu(e) {
            e.stopPropagation();
            document.getElementById('lang-switch').classList.toggle('open');
        }
        document.addEventListener('click', (e) => {
            const ls = document.getElementById('lang-switch');
            if (ls && !ls.contains(e.target)) ls.classList.remove('open');
        });
        function setSiteLanguage(lang) {
            const expr = '/en/' + lang;
            document.cookie = 'googtrans=' + expr + '; path=/';
            document.cookie = 'googtrans=' + expr + '; path=/; domain=' + location.hostname;
            localStorage.setItem('migue100_lang', lang);
            location.reload();
        }
        function applyGlossary() {
            const lang = localStorage.getItem('migue100_lang') || 'en';
            if (lang === 'en') return;
            document.querySelectorAll('[data-i18n-' + lang + ']').forEach(el => {
                el.textContent = el.getAttribute('data-i18n-' + lang);
            });
        }
        (function() {
            const saved = localStorage.getItem('migue100_lang') || 'en';
            const flagEl = document.getElementById('lang-trigger-flag');
            if (flagEl) flagEl.textContent = LANG_FLAGS[saved] || LANG_FLAGS.en;
            document.querySelectorAll('.lang-menu .lang-btn').forEach(btn => {
                if (btn.dataset.lang === saved) btn.style.display = 'none';
            });
            applyGlossary();
        })();
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
