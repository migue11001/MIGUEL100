<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Drawing — migue100.com</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📐</text></svg>">
    <meta name="author" content="Miguel Otero">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap">
    <style>
        :root {
            --neon-blue:   #00d4ff; --smoke-gray: #bebec8;
            --neon-dim:    #0099cc;
            --steel-dark:  #08090d;
            --steel-panel: #1a1e28;
            --chrome:      #8ab4cc;
            --text-main:   #cce8f4;
            --text-dim:    #5a7a90;
            --sw-bg:       #020408;
            --sw-text:     #a8c8e0;
            --sw-g:        #4fc3f7;
            --sw-m:        #ffb74d;
            --sw-n:        #455a64;
            --sw-comment:  #2e4a58;
            --sw-cycle:    #ce93d8;
            --sw-val:      #80cbc4;
            --sw-tf:       #81c784;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            background-color: var(--steel-dark);
            background-image:
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,180,255,0.015) 2px, rgba(0,180,255,0.015) 4px),
                repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,180,255,0.02) 40px, rgba(0,180,255,0.02) 41px),
                linear-gradient(160deg, #08090d 0%, #101520 30%, #0d1a2a 55%, #101520 80%, #08090d 100%);
            min-height: 100vh;
            color: var(--text-main);
            padding: 80px 20px 80px;
            overflow-x: hidden;
        }

        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
            pointer-events: none; z-index: 999;
        }

        /* ── Nav ── */
        .site-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 900;
            padding: 0 2rem; height: 56px;
            background: rgba(8,9,13,0.9); backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(190, 190, 200, 0.18);
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.15rem; font-weight: 400; letter-spacing: 0.15em;
            color: #fff; text-decoration: none; background: none; border: none;
            cursor: pointer;
            text-shadow: 0 0 4px #fff, 0 0 12px var(--neon-blue), 0 0 28px rgba(0,180,255,0.35);
            transition: text-shadow 0.3s ease;
        }
        .nav-logo:hover {
            text-shadow: 0 0 6px #fff, 0 0 18px var(--neon-blue), 0 0 40px rgba(0,180,255,0.5);
        }
        .nav-back {
            font-family: 'Share Tech Mono', monospace; font-size: 0.7rem;
            letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--neon-blue); text-decoration: none;
            padding: 0.4rem 0.9rem;
            background: rgba(0,212,255,0.04);
            border: 1px solid rgba(190, 190, 200, 0.22); border-radius: 3px;
            transition: all 0.25s ease;
        }
        .nav-back:hover {
            background: rgba(0,212,255,0.1);
            border-color: var(--smoke-gray); color: #fff;
            box-shadow: 0 0 10px rgba(0,212,255,0.2);
        }

        .lang-switch { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .lang-trigger {
            display: flex; align-items: center; gap: 0.32rem;
            background: rgba(0,212,255,0.04); border: 1px solid rgba(190, 190, 200, 0.22); border-radius: 3px;
            padding: 0.22rem 0.5rem; font-family: 'Share Tech Mono', monospace; font-size: 0.68rem;
            letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); line-height: 1;
            cursor: pointer; transition: all 0.25s ease;
        }
        .lang-trigger-flag { font-size: 0.95rem; line-height: 1; }
        .lang-trigger-caret { font-size: 0.6rem; transition: transform 0.25s ease; }
        .lang-trigger:hover, .lang-switch.open .lang-trigger {
            border-color: var(--smoke-gray); background: rgba(0,212,255,0.1);
            box-shadow: 0 0 10px rgba(0,212,255,0.2); color: #fff;
        }
        .lang-switch.open .lang-trigger-caret { transform: rotate(180deg); }
        .lang-menu {
            position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(-6px);
            display: flex; flex-direction: column; gap: 0.28rem;
            background: rgba(8,9,13,0.97); border: 1px solid rgba(190, 190, 200, 0.22); border-radius: 4px;
            padding: 0.35rem; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 950;
        }
        .lang-switch.open .lang-menu { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .lang-menu .lang-btn {
            display: flex; align-items: center; gap: 0.45rem; width: 100%; white-space: nowrap;
            background: rgba(0,212,255,0.04); border: 1px solid rgba(190, 190, 200, 0.18); border-radius: 3px;
            padding: 0.3rem 0.6rem; font-family: 'Share Tech Mono', monospace; font-size: 0.72rem;
            letter-spacing: 0.05em; color: var(--text-dim); cursor: pointer; transition: all 0.2s ease;
        }
        .lang-menu .lang-btn:hover { border-color: var(--smoke-gray); background: rgba(0,212,255,0.1); color: #fff; }
        #google_translate_element, .goog-te-banner-frame, .skiptranslate { display: none !important; }
        body { top: 0px !important; }
        html.translated-ltr body, html.translated-rtl body { top: 0 !important; }
        @media (max-width: 560px) { .lang-trigger-label { display: none; } }
        @media (max-width: 768px) {
            .site-nav { padding: 0 1rem; height: 50px; }
            .nav-logo { font-size: 0.9rem; }
            .nav-back { font-size: 0.6rem; padding: 0.35rem 0.6rem; }
        }
        @media (max-width: 480px) {
            .site-nav { padding: 0 0.6rem; }
            .nav-logo { font-size: 0.78rem; letter-spacing: 0.1em; }
            .nav-back { font-size: 0.55rem; padding: 0.28rem 0.45rem; letter-spacing: 0.12em; }
        }

        /* ── Page Header ── */
        .page-header { max-width: 1200px; margin: 0 auto 32px; }
        .page-tag {
            font-family: 'Share Tech Mono', monospace; font-size: 0.6em;
            letter-spacing: 0.22em; color: var(--neon-dim); margin-bottom: 6px;
        }
        .page-tag::before { content: '['; }
        .page-tag::after  { content: ']'; }
        .page-title {
            font-family: 'Share Tech Mono', monospace; font-size: 1.6em;
            letter-spacing: 0.1em; color: var(--text-main); text-transform: uppercase;
        }
        .page-title span { color: var(--neon-blue); }
        .page-divider {
            margin-top: 12px; height: 1px;
            background: linear-gradient(90deg, rgba(0,212,255,0.5), transparent);
        }

        /* ── Section Label ── */
        .section-label {
            max-width: 1200px; margin: 48px auto 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.58em; letter-spacing: 0.28em;
            color: var(--neon-dim); text-transform: uppercase;
            display: flex; align-items: center; gap: 12px;
        }
        .section-label::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(0,212,255,0.2), transparent);
        }

        /* ── Drawing Panel ── */
        .drawing-panel {
            max-width: 1200px; margin: 0 auto;
            background: linear-gradient(160deg, rgba(26,30,40,0.95) 0%, rgba(18,22,32,0.98) 50%, rgba(22,26,38,0.95) 100%);
            border: 1px solid rgba(190, 190, 200, 0.18); border-radius: 4px; overflow: hidden;
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.03);
        }
        .drawing-panel::before {
            content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0,212,255,0.5), transparent);
        }
        .drawing-panel::after {
            content: ''; position: absolute; top: 6px; right: 6px;
            width: 8px; height: 8px;
            border-top: 2px solid rgba(190, 190, 200, 0.4); border-right: 2px solid rgba(190, 190, 200, 0.4);
            pointer-events: none;
        }
        .drawing-panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; border-bottom: 1px solid rgba(190, 190, 200, 0.1);
        }
        .drawing-panel-title {
            font-family: 'Share Tech Mono', monospace; font-size: 0.62em;
            letter-spacing: 0.16em; color: var(--text-dim); text-transform: uppercase;
        }
        .drawing-panel-id {
            font-family: 'Share Tech Mono', monospace; font-size: 0.56em;
            letter-spacing: 0.1em; color: rgba(0,212,255,0.4);
        }
        .drawing-area {
            min-height: 560px; display: flex; align-items: center;
            justify-content: center; padding: 0; position: relative; overflow: hidden;
        }
        .drawing-area img {
            width: 100%; height: auto; display: block;
            filter: invert(1) sepia(1) hue-rotate(175deg) saturate(6) brightness(1.1);
        }
        .drawing-placeholder {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 16px; opacity: 0.4;
        }
        .drawing-placeholder svg { width: 120px; height: 120px; }
        .drawing-placeholder-text {
            font-family: 'Share Tech Mono', monospace; font-size: 0.6em;
            letter-spacing: 0.2em; color: var(--text-dim); text-transform: uppercase;
        }
        .drawing-panel-footer {
            padding: 10px 16px; border-top: 1px solid rgba(190, 190, 200, 0.1);
            display: flex; gap: 32px; align-items: center; flex-wrap: wrap;
        }
        .drawing-meta { display: flex; flex-direction: column; gap: 2px; }
        .drawing-meta-label {
            font-family: 'Share Tech Mono', monospace; font-size: 0.46em;
            letter-spacing: 0.18em; color: rgba(0,212,255,0.35); text-transform: uppercase;
        }
        .drawing-meta-value {
            font-family: 'Rajdhani', sans-serif; font-size: 0.78em;
            font-weight: 600; color: var(--text-main); letter-spacing: 0.04em;
        }

        /* ── Floating drawing preview (toggled from the G-CODE window) ── */
        .drawing-float {
            position: fixed; top: 76px; left: 50%; transform: translateX(-50%);
            width: min(94vw, 720px); z-index: 500;
            background: linear-gradient(160deg, rgba(26,30,40,0.98) 0%, rgba(16,20,30,0.99) 100%);
            border: 1px solid rgba(255,23,68,0.4); border-radius: 4px;
            box-shadow: 0 10px 34px rgba(0,0,0,0.65), 0 0 22px rgba(255,23,68,0.15);
            overflow: hidden;
        }
        .drawing-float-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.25);
        }
        .drawing-float-title {
            font-family: 'Share Tech Mono', monospace; font-size: 0.62em;
            letter-spacing: 0.14em; color: #ff8a80; text-transform: uppercase;
        }
        .drawing-float-close {
            background: none; border: none; color: #ff8a80; cursor: pointer;
            font-size: 0.95em; line-height: 1; padding: 2px 4px;
        }
        .drawing-float-close:hover { color: #fff; }
        .drawing-float-body {
            max-height: 80vh; overflow-y: auto;
            display: flex; align-items: center; justify-content: center;
            padding: 6px;
        }
        .drawing-float-body img {
            width: 100%; height: auto; display: block;
            filter: invert(1) sepia(1) hue-rotate(175deg) saturate(6) brightness(1.1);
        }
        @media (max-width: 600px) { .drawing-float { top: 66px; } }

        /* ── G-CODE Grid ── */
        .gcode-grid {
            max-width: 1200px; margin: 0 auto;
        }
        @media (max-width: 768px) {
            .drawing-area { min-height: unset; }
            .drawing-area img { width: 100%; height: auto; }
        }

        /* ── Siemens Window Chrome ── */
        .siemens-win {
            border-radius: 3px; overflow: hidden;
            box-shadow: 0 6px 28px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
            display: flex; flex-direction: column;
            background: #12141c;
            border: 2px solid #252830;
        }

        /* Title bar — dark Siemens header */
        .sw-titlebar {
            background: #0c0e16;
            border-bottom: 1px solid #1e2130;
            padding: 6px 10px;
            display: flex; align-items: flex-start;
            flex-shrink: 0;
        }
        .sw-titlebar-left {
            display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
        }
        .sw-logo {
            font-family: 'Rajdhani', sans-serif; font-weight: 700;
            font-size: 1.08em; letter-spacing: 0.06em; color: #3a9ad9;
            text-transform: uppercase;
        }

        /* Screen area */
        .sw-screen {
            background: var(--sw-bg);
            position: relative;
        }
        /* CRT vignette */
        .sw-screen::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.45) 100%);
        }
        .sw-code-wrap {
            /* Height hugs the actual line count; caps at ~300 lines, then scrolls internally */
            max-height: 8000px; overflow-y: auto;
            padding: 8px 0;
            scrollbar-width: thin;
            scrollbar-color: #1a2030 transparent;
            /* Read-only display: no text selection / copy for site visitors */
            user-select: none; -webkit-user-select: none;
            -moz-user-select: none; -ms-user-select: none;
        }
        .sw-code-wrap::-webkit-scrollbar { width: 4px; }
        .sw-code-wrap::-webkit-scrollbar-thumb { background: #1e2a3a; border-radius: 2px; }
        /* 3-column code table: N° / G-CODE / COMMENT */
        .sw-code-table {
            width: 100%; border-collapse: collapse;
            font-family: 'Share Tech Mono', monospace;
        }
        .sw-code-table thead th {
            position: sticky; top: 0; z-index: 1;
            background: #0a0c14; border-bottom: 1px solid #1a2030;
            text-align: left; padding: 8px 13px;
            font-size: 0.65em; letter-spacing: 0.12em;
            color: #3a5268; text-transform: uppercase;
        }
        .sw-code-table thead th.sw-ct-comment { text-align: right; }
        .sw-code-table tbody tr:hover { background: rgba(0,160,220,0.05); }
        .sw-code-table td {
            padding: 2px 10px; vertical-align: baseline;
            font-size: 0.864em; line-height: 1.55;
            border-bottom: 1px solid rgba(255,255,255,0.02);
        }
        .sw-ct-n {
            width: 44px; min-width: 44px; text-align: right;
            color: #1e3040; user-select: none; white-space: nowrap;
        }
        /* Line-flag button — click to mark a line as critical; stays highlighted until toggled again */
        .sw-ct-flag {
            background: none; border: none; width: 100%;
            font: inherit; color: inherit; text-align: right;
            padding: 2px 4px; margin: -2px -4px;
            cursor: pointer; border-radius: 3px;
            transition: color 0.15s, text-shadow 0.15s, background 0.15s;
        }
        .sw-ct-flag:hover { color: #7ab4c8; background: rgba(0,180,255,0.08); }
        .sw-ct-row.sw-ct-flagged { background: rgba(255,23,68,0.08); }
        .sw-ct-row.sw-ct-flagged .sw-ct-flag {
            color: #ff1744;
            text-shadow: 0 0 6px rgba(255,23,68,0.85), 0 0 16px rgba(255,23,68,0.4);
        }
        .sw-ct-row.sw-ct-flagged .sw-ct-code { color: #ffb3ab; }
        .sw-ct-row.sw-ct-flagged .sw-ct-ctext,
        .sw-ct-row.sw-ct-flagged.sw-ct-detail .sw-ct-detail-box { color: #d98a86; }
        tr.sw-ct-detail.sw-ct-flagged .sw-ct-detail-box {
            border-left-color: #ff1744;
            background: rgba(255,23,68,0.08);
        }
        .sw-ct-code { color: var(--sw-text); white-space: pre; }
        .sw-code-table td.sw-ct-comment {
            color: var(--sw-comment);
            font-family: 'Rajdhani', sans-serif; font-size: 1em;
            text-align: right; padding-right: 14px;
        }
        /* Mobile-only comment toggle button */
        .sw-ct-cbtn {
            display: none;
            background: rgba(0,180,255,0.08);
            border: 1px solid rgba(0,212,255,0.45);
            color: var(--neon-blue);
            border-radius: 5px;
            font-size: 0.95em; line-height: 1;
            padding: 4px 8px; cursor: pointer;
            box-shadow: 0 0 6px rgba(0,212,255,0.35);
            transition: box-shadow 0.15s, background 0.15s;
        }
        .sw-ct-cbtn:hover, .sw-ct-cbtn:active {
            background: rgba(0,180,255,0.2);
            box-shadow: 0 0 12px rgba(0,212,255,0.65);
        }
        .sw-ct-detail td { padding: 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .sw-ct-detail-box {
            display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
            margin: 4px 8px; padding: 8px 10px;
            background: rgba(0,180,255,0.06);
            border-left: 2px solid var(--neon-blue);
            border-radius: 3px;
            font-family: 'Rajdhani', sans-serif; font-size: 0.92em;
            color: var(--sw-text);
        }
        .sw-ct-close {
            background: none; border: none; flex-shrink: 0;
            color: #ef5350; font-size: 1em; line-height: 1;
            cursor: pointer; padding: 0 2px;
        }
        @media (max-width: 768px) {
            .sw-ct-ctext { display: none; }
            .sw-ct-cbtn { display: inline-block; }
            .sw-code-table td.sw-ct-comment { width: 40px; text-align: center; padding-right: 10px; }
        }
        /* G-code syntax classes */
        .gk-n  { color: var(--sw-n); }
        .gk-g  { color: var(--sw-g);   font-weight: bold; }
        .gk-m  { color: var(--sw-m);   font-weight: bold; }
        .gk-t  { color: var(--sw-tf); }
        .gk-f  { color: var(--sw-tf); }
        .gk-cy { color: var(--sw-cycle); font-style: italic; }
        .gk-cm { color: var(--sw-comment); }
        .gk-pct{ color: #3a5060; }
        .gk-lbl{ color: #7e57c2; }

        /* Softkey bar */
        .sw-softkeys {
            background: #0c0e16; border-top: 1px solid #1a1c28;
            display: flex; align-items: stretch;
            height: 38px; flex-shrink: 0;
        }
        .sw-sk {
            flex: 1; background: none;
            border: none; border-right: 1px solid #1a1c28;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9em; cursor: default;
            transition: background 0.15s;
            padding: 0 4px;
        }
        .sw-sk:last-child { border-right: none; }
        .sw-sk:hover { background: rgba(0,180,255,0.07); }
        #drawing-toggle-btn {
            cursor: pointer; line-height: 1.15;
        }
        #drawing-toggle-btn .sw-sk-label {
            font-family: 'Share Tech Mono', monospace; font-size: 9.75px;
            letter-spacing: 0.03em; color: #fff; text-transform: uppercase;
            text-shadow: 0 0 4px #fff, 0 0 10px rgba(255,255,255,0.7);
            white-space: normal; text-align: center;
        }
        #drawing-toggle-btn.active {
            background: rgba(255,23,68,0.14);
            box-shadow: inset 0 0 0 1px rgba(255,23,68,0.45);
        }
        #drawing-toggle-btn.active .sw-sk-label { color: #ff8a80; }
    </style>
</head>
<body>

    <nav class="site-nav">
        <a href="index.html" class="nav-logo">migue100.com</a>
        <div class="lang-switch" id="lang-switch">
            <button class="lang-trigger notranslate" id="lang-trigger" onclick="toggleLangMenu(event)" title="Language">
                <span class="lang-trigger-flag" id="lang-trigger-flag">🇬🇧</span>
                <span class="lang-trigger-label">Language</span>
                <span class="lang-trigger-caret">▾</span>
            </button>
            <div class="lang-menu" id="lang-menu">
                <button class="lang-btn" data-lang="en" onclick="setSiteLanguage('en')" title="English">🇬🇧 English</button>
                <button class="lang-btn" data-lang="es" onclick="setSiteLanguage('es')" title="Español">🇪🇸 Español</button>
                <button class="lang-btn" data-lang="it" onclick="setSiteLanguage('it')" title="Italiano">🇮🇹 Italiano</button>
            </div>
        </div>
        <a href="index.html" class="nav-back notranslate" data-i18n-es="← Volver" data-i18n-it="← Indietro">← Back</a>
    </nav>

    <!-- Floating drawing preview — toggled by the DRAWING softkey, stays pinned while scrolling through the code -->
    <div class="drawing-float" id="drawing-float" hidden>
        <div class="drawing-float-header">
            <span class="drawing-float-title">Technical Drawing</span>
            <button class="drawing-float-close" onclick="toggleDrawingFloat(false)" aria-label="Close drawing preview">✕</button>
        </div>
        <div class="drawing-float-body">
            <img id="drawing-float-img" alt="Technical drawing preview">
        </div>
    </div>

    <!-- Page Header -->
    <div class="page-header">
        <div class="page-tag" id="page-tag">MODEL 01</div>
        <div class="page-title"><span class="notranslate" style="color:var(--text-main)" data-i18n-es="Dibujo" data-i18n-it="Disegno">Technical</span> <span class="notranslate" data-i18n-es="Técnico" data-i18n-it="Tecnico">Drawing</span></div>
        <div class="page-divider"></div>
    </div>

    <!-- Drawing Panel -->
    <div class="drawing-panel">

    /* ── G-code token highlighter (single line) ── */
    function highlightCode(line) {
        return escH(line)
            .replace(/\b(G\d+\.?\d*)/g, '<span class="gk-g">$1</span>')
            .replace(/\b(M\d+)\b/g, '<span class="gk-m">$1</span>')
            .replace(/\b([TDH]\d+)\b/g, '<span class="gk-t">$1</span>')
            .replace(/\b(F[\d.]+)\b/g, '<span class="gk-f">$1</span>');
    }
    function escH(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    /* ── Render the 3-column read-only code table: N° / G-CODE / COMMENT ──
       On mobile the comment column collapses into a 💬 button; tapping it
       opens a detail row with the full comment and an ✕ to close it. */
    function renderCodeTable(program) {
        const rows = program.map(row => {
            const comment = escH(row.comment);
            return `<tr class="sw-ct-row">` +
                `<td class="sw-ct-n">` +
                    `<button type="button" class="sw-ct-flag" onclick="toggleFlag(this)" aria-label="Flag line ${escH(row.n)}">${escH(row.n)}</button>` +
                `</td>` +
                `<td class="sw-ct-code">${highlightCode(row.code)}</td>` +
                `<td class="sw-ct-comment">` +
                    `<span class="sw-ct-ctext">${comment}</span>` +
                    `<button type="button" class="sw-ct-cbtn" onclick="toggleComment(this)" aria-label="Show comment">💬</button>` +
                `</td>` +
            `</tr>` +
            `<tr class="sw-ct-detail" hidden>` +
                `<td colspan="3">` +
                    `<div class="sw-ct-detail-box">` +
                        `<span>${comment}</span>` +
                        `<button type="button" class="sw-ct-close" onclick="toggleComment(this)" aria-label="Close comment">✕</button>` +
                    `</div>` +
                `</td>` +
            `</tr>`;
        }).join('');
        return `<table class="sw-code-table">` +
            `<thead><tr>` +
                `<th class="sw-ct-n">N°</th>` +
                `<th class="sw-ct-code">G-CODE · ISO</th>` +
                `<th class="sw-ct-comment">COMMENT (EN)</th>` +
            `</tr></thead>` +
            `<tbody>${rows}</tbody>` +
        `</table>`;
    }

    document.getElementById('viewer-code').innerHTML = renderCodeTable(SHARED_PROGRAM);

    /* Read-only display: block copy / cut / right-click / drag on the code window */
    (function() {
        const wrap = document.getElementById('viewer-code');
        ['copy', 'cut', 'contextmenu', 'dragstart'].forEach(evt => {
            wrap.addEventListener(evt, e => e.preventDefault());
        });
    })();

    /* Toggle the mobile comment detail row open/closed */
    function toggleComment(btn) {
        if (btn.classList.contains('sw-ct-cbtn')) {
            const detail = btn.closest('tr').nextElementSibling;
            if (detail) detail.hidden = false;
        } else {
            btn.closest('tr').hidden = true;
        }
    }

    /* Flag a line as critical for analysis — stays highlighted until clicked again */
    function toggleFlag(btn) {
        const row = btn.closest('tr');
        row.classList.toggle('sw-ct-flagged');
        const detail = row.nextElementSibling;
        if (detail && detail.classList.contains('sw-ct-detail')) {
            detail.classList.toggle('sw-ct-flagged');
        }
    }

    /* Show/hide the floating drawing preview — pinned on screen while scrolling the code */
    function toggleDrawingFloat(forceState) {
        const panel = document.getElementById('drawing-float');
        const btn   = document.getElementById('drawing-toggle-btn');
        const show  = typeof forceState === 'boolean' ? forceState : panel.hidden;
        if (show) {
            document.getElementById('drawing-float-img').src = m.image || '';
            panel.hidden = false;
            btn.classList.add('active');
            btn.setAttribute('aria-pressed', 'true');
        } else {
            panel.hidden = true;
            btn.classList.remove('active');
            btn.setAttribute('aria-pressed', 'false');
        }
    }

    <!-- ── Language switch (ES / IT via Google Website Translator) ── -->
    <div id="google_translate_element"></div>
    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'en', includedLanguages: 'es,it', autoDisplay: false }, 'google_translate_element');
        }
        const LANG_FLAGS = { en: '🇬🇧', es: '🇪🇸', it: '🇮🇹' };
        function toggleLangMenu(e) {
            e.stopPropagation();
            document.getElementById('lang-switch').classList.toggle('open');
        }
        document.addEventListener('click', (e) => {
            const ls = document.getElementById('lang-switch');
            if (ls && !ls.contains(e.target)) ls.classList.remove('open');
        });
        function setSiteLanguage(lang) {
            const expr = '/en/' + lang;
            document.cookie = 'googtrans=' + expr + '; path=/';
            document.cookie = 'googtrans=' + expr + '; path=/; domain=' + location.hostname;
            localStorage.setItem('migue100_lang', lang);
            location.reload();
        }
        function applyGlossary() {
            const lang = localStorage.getItem('migue100_lang') || 'en';
            if (lang === 'en') return;
            document.querySelectorAll('[data-i18n-' + lang + ']').forEach(el => {
                el.textContent = el.getAttribute('data-i18n-' + lang);
            });
        }
        (function() {
            const saved = localStorage.getItem('migue100_lang') || 'en';
            const flagEl = document.getElementById('lang-trigger-flag');
            if (flagEl) flagEl.textContent = LANG_FLAGS[saved] || LANG_FLAGS.en;
            document.querySelectorAll('.lang-menu .lang-btn').forEach(btn => {
                if (btn.dataset.lang === saved) btn.style.display = 'none';
            });
            applyGlossary();
        })();
    </script>
