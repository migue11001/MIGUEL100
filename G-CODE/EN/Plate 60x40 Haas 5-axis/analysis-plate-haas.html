<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haas plate analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: pannello di controllo CNC — barra di stato, riga messaggi, finestre (editor / spiegazione / posizione), softkey verticali a destra e orizzontali in basso. Un unico aspetto chiaro industriale, di proposito. */
:root {
  --frame: #b9c1c8;
  --win: #eef1f3;
  --paper: #ffffff;
  --ink: #1b232a;
  --muted: #5a6670;
  --rule: #98a3ad;
  --head: #34495a;
  --head-ink: #f4f7f9;
  --accent: #0a6a8c;
  --cursor: #f3a712;
  --cursor-ink: #1b1400;
  --key-top: #fbfcfc;
  --key-bot: #c8cfd5;
  --key-on: #ffd27a;
  --ok: #2c7a3a;
  --warn: #b76a00;
  --warn-bg: #fff1d6;
  --err: #c0262d;
  --err-bg: #fde3e3;
  --steel: #c4ccd3;
  --steel-dark: #7d8a95;
  --code-g: #0a5d9e;
  --code-m: #7a3a9a;
  --code-c: #2f7d4a;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--frame);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  padding-inline: 16px;
  padding-block: 16px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.hmi {
  max-width: 1480px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 128px;
  grid-template-areas: "bar bar" "msg msg" "work vkeys" "hkeys hkeys";
  gap: 4px;
  background: #8d979f;
  padding: 4px;
  border: 1px solid #6f7a83;
}

/* barra superiore */
.bar { grid-area: bar; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px; }
.bar > div { background: var(--head); color: var(--head-ink); padding: 6px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.area { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.path { font-family: var(--font-code); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chan { font-weight: 600; letter-spacing: .04em; }
.chan .led { width: 10px; height: 10px; border-radius: 50%; background: #58c26a; box-shadow: 0 0 0 2px #2a3a47; }

/* riga messaggi */
.msg { grid-area: msg; background: var(--paper); border: 1px solid var(--rule); padding: 5px 10px; display: flex; gap: 10px; align-items: baseline; min-height: 34px; font-weight: 500; }
.msg .tag { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 12px; padding: 1px 6px; border-radius: 2px; flex: none; }
.msg.ok .tag { background: #dcefdf; color: var(--ok); }
.msg.warn { background: var(--warn-bg); }
.msg.warn .tag { background: var(--warn); color: #fff; }
.msg.err { background: var(--err-bg); }
.msg.err .tag { background: var(--err); color: #fff; }

/* zona finestre */
.work { grid-area: work; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); grid-template-areas: "editor info" "pos info"; gap: 4px; min-width: 0; }
.win { background: var(--win); border: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; }
.win-h { background: linear-gradient(#4a6274, var(--head)); color: var(--head-ink); padding: 4px 10px; font-weight: 600; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.win-h small { font-weight: 400; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editor { grid-area: editor; }
.info { grid-area: info; }
.pos { grid-area: pos; }

/* editor */
.code { font-family: var(--font-code); font-size: 13.5px; background: var(--paper); margin: 6px; border: 1px solid var(--rule); overflow: auto; max-height: 340px; flex: 1; }
.ln { display: grid; grid-template-columns: 4.2em 1.2em minmax(0, 1fr); align-items: baseline; padding: 1px 6px 1px 0; cursor: pointer; white-space: pre; border-left: 4px solid transparent; }
.ln:hover { background: #eaf3f7; }
.ln .no { color: var(--muted); text-align: right; padding-right: 8px; font-size: 11.5px; user-select: none; }
.ln .flag { font-size: 11px; font-weight: 700; }
.ln.warn .flag { color: var(--warn); }
.ln.err .flag { color: var(--err); }
.ln.mark { background: #e3f0f6; border-left-color: var(--accent); }
.ln.cur { background: var(--cursor); color: var(--cursor-ink); border-left-color: #a46c00; }
.ln.cur .no, .ln.cur .t-n, .ln.cur .t-g, .ln.cur .t-m, .ln.cur .t-c { color: var(--cursor-ink); }
.ln.blank { cursor: default; }
.ln.gap { color: var(--muted); font-style: italic; background: repeating-linear-gradient(135deg, #f4f6f7 0 6px, #eceff1 6px 12px); }
.ln.gap.cur { background: var(--cursor); }
.t-n { color: var(--muted); }
.t-g { color: var(--code-g); font-weight: 600; }
.t-m { color: var(--code-m); font-weight: 600; }
.t-c { color: var(--code-c); font-style: italic; }

/* posizione */
.pos-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 6px 6px 0; }
.axis { background: var(--paper); border: 1px solid var(--rule); padding: 3px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; min-width: 0; }
.axis b { font-size: 12px; color: var(--muted); letter-spacing: .05em; }
.axis span { font-family: var(--font-code); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal { margin: 4px 6px 0; background: var(--paper); border: 1px solid var(--rule); padding: 4px 8px; font-family: var(--font-code); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.modal i { font-style: normal; color: var(--muted); font-family: var(--font-ui); font-size: 12px; }
.scene { margin: 6px; background: var(--paper); border: 1px solid var(--rule); position: relative; }
.scene canvas { display: block; width: 100%; }
.scene .cap { position: absolute; left: 8px; top: 4px; font-size: 12px; color: var(--muted); pointer-events: none; }

/* spiegazione */
.info-body { padding: 10px 14px 14px; overflow: auto; max-height: 720px; display: grid; gap: 12px; align-content: start; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--head-ink); background: var(--accent); padding: 2px 8px; border-radius: 2px; justify-self: start; }
.blk { font-family: var(--font-code); font-size: 15px; background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--cursor); padding: 6px 10px; overflow-x: auto; white-space: pre; }
.sec { display: grid; gap: 4px; }
.sec h3 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sec h3::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.sec p { margin: 0; max-width: 68ch; }
.sec ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 70ch; }
.sec.why h3 { color: var(--accent); }
.sec.why { background: var(--paper); border: 1px solid #bcd6e1; padding: 8px 12px 10px; }
.sec.risk { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 6px 10px; }
.sec.risk.err { border-left-color: var(--err); background: var(--err-bg); }
.sec.risk h3 { color: var(--warn); }
.sec.risk.err h3 { color: var(--err); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--paper); }
th, td { border: 1px solid #c3cbd2; padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: #dfe5ea; font-weight: 600; font-size: 13px; }
td.num, th.num { text-align: right; font-family: var(--font-code); font-variant-numeric: tabular-nums; white-space: nowrap; }
td code, p code, li code { font-family: var(--font-code); font-size: .92em; background: #e8edf1; padding: 0 3px; border-radius: 2px; }
tr.hit td { background: #fff3d1; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #eaf3f7; }
td.bad { color: var(--err); font-weight: 600; }
td.meh { color: var(--warn); font-weight: 600; }

.card { background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--warn); padding: 8px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; }
.card.err { border-left-color: var(--err); }
.card.on { box-shadow: 0 0 0 2px var(--cursor); }
.card h4 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.card h4 .n { font-family: var(--font-code); font-size: 12px; color: var(--muted); }
.card .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; max-width: 70ch; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; background: var(--paper); border: 1px solid var(--rule); padding: 8px 12px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.check label { font-weight: 600; cursor: pointer; }
.check p { grid-column: 2; margin: 0; color: var(--muted); }
.check.done label { text-decoration: line-through; color: var(--ok); }
.note { font-size: 13.5px; color: var(--muted); max-width: 72ch; margin: 0; }

/* softkey */
.vkeys { grid-area: vkeys; display: grid; grid-auto-rows: minmax(54px, auto); gap: 4px; align-content: start; }
.hkeys { grid-area: hkeys; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.sk { background: linear-gradient(var(--key-top), var(--key-bot)); border: 1px solid #77838d; border-radius: 3px; box-shadow: inset 0 1px 0 #fff, 0 1px 0 #6d7881; padding: 6px 8px; min-height: 48px; font-weight: 600; line-height: 1.15; text-align: center; cursor: pointer; }
.sk:hover:not(:disabled) { background: linear-gradient(#ffffff, #d7dde2); }
.sk:active:not(:disabled) { box-shadow: inset 0 2px 3px rgba(0,0,0,.25); }
.sk.on { background: linear-gradient(#fff3d6, var(--key-on)); border-color: #a46c00; }
.sk:disabled { cursor: default; color: transparent; background: linear-gradient(#e3e7ea, #cdd3d8); box-shadow: none; }
a.sk { text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: center; }
.sk small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }

@media (max-width: 1100px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-areas: "editor" "info" "pos"; }
  .code { max-height: 260px; }
  .info-body { max-height: none; }
}
@media (max-width: 760px) {
  body { padding-inline: 8px; }
  .hmi { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "msg" "vkeys" "work" "hkeys"; }
  .bar { grid-template-columns: minmax(0, 1fr) auto; }
  .bar .path-box { grid-column: 1 / -1; order: 3; }
  .vkeys { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: auto; }
  .hkeys { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sk:disabled { display: none; }
  .sk { min-height: 42px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="hmi" id="hmi">
  <header class="bar">
    <div class="area">Program</div>
    <div class="path-box"><span class="path" id="path"></span></div>
    <div class="chan"><span class="led" aria-hidden="true"></span>CHANNEL 1 · RESET</div>
  </header>

  <div class="msg ok" id="msg" role="status"><span class="tag">Info</span><span id="msgText"></span></div>

  <main class="work">
    <section class="win editor" aria-label="Program editor">
      <div class="win-h"><span>Editor</span><small id="edName"></small></div>
      <div class="code" id="code" tabindex="0" aria-label="Program lines. Use the arrow keys to move."></div>
    </section>

    <section class="win info" aria-live="polite">
      <div class="win-h"><span id="infoTitle">Explanation</span><small id="infoSub"></small></div>
      <div class="info-body" id="info"></div>
    </section>

    <section class="win pos" aria-label="Position and status">
      <div class="win-h"><span>Work position</span><small id="posSub"></small></div>
      <div class="pos-grid" id="axes"></div>
      <div class="modal" id="pMod"><i>G modals:</i> —</div>
      <div class="scene"><span class="cap" id="cap"></span><canvas id="cv" height="220" aria-label="Drawing of the operation toolpath and tool position"></canvas></div>
    </section>
  </main>

  <nav class="vkeys" id="vkeys" aria-label="Vertical softkeys"></nav>
  <nav class="hkeys" id="hkeys" aria-label="Horizontal softkeys"></nav>
</div>

const D = {"key":"piastra-haas","board":"board-plate-haas.html","axes":["X","Y","Z","ROT. AXES","S","F","T","SPINDLE","COOLANT","LENGTH OFFS."],"posSub":"G54 work zero · mm","zLabel":"Z","info":{"pct":{"que":"Start or end-of-file marker.","pq":["When the program arrives over the network or USB, the control starts reading at the first % and stops at the next. Anything outside is ignored."],"sino":"Some controls don't recognise the start of the program and the load fails."},"oname":{"que":"Program number in the machine memory.","pq":["The Haas control identifies programs by the letter O and 5 digits. Fusion writes the number you entered when posting.","The two files in this folder have different numbers (O00012 and O00004): they can be loaded together without overwriting each other."]},"hifeed":{"lvl":"warn","que":"Post comment: rapids are written as G1 F228600 instead of G0.","pq":["On a 5-axis machine a G0 with rotary axes may not be a straight line: each axis runs at its own max speed and the tool tip takes a “dog-leg” path.","Writing G1 with a huge feed (228.6 m/min) makes the machine interpolate all axes together so the tip goes straight. The control then caps the feed at the axes' real maximum."],"riesgo":"With G1 rapid override doesn't apply: to slow the first run you have to use feed override."},"caution335":{"lvl":"warn","que":"Post warning: this program uses normal G0 and asks you to check Setting 335.","pq":["Haas Setting 335 decides how rapids move. With “Linear + Rotary” every axis, B and C included, arrives together and the tip moves in a straight line.","It's the alternative to the other version's G1 F228600: same goal (a straight rapid), but the machine guarantees it, not the program."],"riesgo":"If Setting 335 isn't set, a rapid with B or C can curve and pass close to the part or vise."},"toollist":{"que":"Comment: list of tools used with diameter, corner radius, angle and lowest Z reached.","pq":["Helps the operator set up the magazine before starting: check every T is loaded and measured.","ZMIN is the lowest Z that tool reaches. Compare it with the part thickness and the vise: if ZMIN goes below the part, there must be clearance underneath."]},"n10":{"que":"Safety modes: absolute coordinates (G90), feed in mm/min (G94), XY plane (G17).","pq":["At start-up the control may still hold the previous program's modes. Writing them at the top avoids surprises.","G17 is the plane for G2/G3 arcs and drilling cycles (Z axis perpendicular)."],"sino":"If G91 (incremental) were left active, the first move would start from the current position instead of the work zero."},"n15":{"que":"Cancels length compensation (G49) and tilted work coordinates (G269).","pq":["On Haas G268/G269 turn the “Feature Coordinate System” on/off, the tilted work plane for 3+2 machining.","Before moving anything, start from a clean state: no tool offset, no rotated plane."]},"n20":{"que":"Metric units: all coordinates in millimetres.","pq":["A UMC can work in inches or millimetres. G21 fixes it in the program so it doesn't depend on the machine setting."],"sino":"In inches, X38.8 would become 985 mm: an over-travel alarm or, worse, a huge move."},"g53z":{"que":"Rapid in machine coordinates (G53) to machine Z0: the spindle goes up to its highest point.","pq":["G53 ignores the work zero and uses machine zero. Machine Z0 is full upward travel, the safest place.","It's done before rotating the table, before tool changes and at the end of every operation: with the spindle up nothing can touch the part."]},"n30":{"que":"Sends rotary axes B and C to zero (head/table aligned).","pq":["On a UMC the table tilts (B) and rotates (C). This program does everything in 3 axes with the table flat: B0 C0 puts it in its reference position.","It's done with the spindle already up (previous line): as the table rotates it carries the part and vise with it."],"riesgo":"Check the vise and part don't touch the guards while rotating."},"t1m6":{"que":"Tool change: loads T1, Ø12 end mill with 0.5 corner radius (used for facing).","pq":["M6 performs the actual change. Haas moves the spindle to the change position automatically."]},"s40000":{"lvl":"err","que":"Starts the spindle at 40,000 rpm, clockwise.","pq":["The value comes from the Fusion tool library: Vc = π·12·40,000/1000 ≈ 1,508 m/min, typical of a high-speed aluminium spindle.","M3: clockwise rotation as seen from the spindle, the direction of normal right-hand cutters."],"riesgo":"No standard Haas UMC spindle reaches 40,000 rpm (depending on version: 8,100, 12,000 or 15,000). The machine caps the rpm or stops with an alarm: either way feed and speed no longer match what was calculated. See Errors."},"safeblk":{"que":"Repeats the safety modes at the start of the operation.","pq":["The post rewrites them in every operation: if the operator restarts mid-program (after an M1 or a broken tool), the modes are right again."]},"g54":{"que":"Activates G54 work zero.","pq":["All following X Y Z values are measured from the point the operator set on the part (here the centre of the plate and the top face).","The post repeats it in every operation for the same reason as the safety modes."]},"approach":{"que":"XY rapid above the entry point, with the spindle still up.","pq":["Move in XY first and only then down in Z: that way the horizontal rapid happens at the highest level."]},"g43ok":{"que":"Activates the tool length offset (G43 H) and drops to Z15.","pq":["Every tool has a different length. G43 with the right H number tells the machine how far the tip sticks out, so Z15 really is 15 mm above the part.","The H number must match the loaded tool: here T1 → H1."],"sino":"Without an offset, Z would refer to the spindle nose and the tip would end up much lower."},"g43h1err":{"lvl":"err","que":"Activates length offset H1 — but the loaded tool isn't T1.","pq":["The H number comes from the tool's “Length offset” field in Fusion. For T2 and T3 it was left at 1."],"riesgo":"The machine uses T1's length (the end mill) for a drill. If the drill is longer than the end mill, it goes lower than planned: the rapid to Z5 can end up inside the part and the hole goes deeper. If it's shorter, the hole comes out short."},"m8":{"que":"Turns coolant on.","pq":["Cools the edge and clears chips. Essential for drilling and tapping: chips in the hole jam the drill."]},"presel":{"que":"Pre-selects the next tool in the magazine (without changing).","pq":["While the current tool works, the magazine brings the next one into position. The next M6 change is faster."]},"z5":{"que":"Rapid to Z5, 5 mm above the part.","pq":["It's the last rapid height: from here down it feeds (G1), more slowly."]},"n80":{"que":"Feeds down to Z0.2, just above the surface.","pq":["From Z5 to Z0.2 the cutter is still in air but already moving in G1: if the stock were taller than expected, it would touch at feed rate rather than in rapid."]},"ramparc":{"que":"XZ-plane arc lead-in (G18): the cutter drops from Z0.2 to Z-1 while moving in X.","pq":["Entering on an arc avoids dropping straight onto the part edge: the load on the edge builds gradually.","G18 switches the arc plane to XZ; I and K are the arc centre distances in X and Z."]},"facepass":{"que":"Facing pass from one side of the part to the other.","pq":["Facing removes 1 mm from the top to get a flat surface and a reliable Z0.","Passes go back and forth (zig-zag): no time wasted returning through air."]},"stepover":{"que":"Linking arc between passes (G17, XY plane).","pq":["The stepover is about 7.1 mm: with a Ø12 cutter each pass overlaps the previous one by about 5 mm.","An arc instead of a sharp corner: the cutter doesn't stop and leaves no marks."]},"exitarc":{"que":"XZ-plane arc lead-out: the cutter rises to Z0.2 moving away from the part.","pq":["Like the entry: the edge unloads gradually instead of breaking away suddenly."]},"z15":{"que":"Rapid to Z15, above the part.","pq":["End of cutting moves: the tool leaves the material before the spindle stops."]},"m5":{"que":"Stops the spindle.","pq":["The spindle stops before the tool change or end of program."]},"m9":{"que":"Turns coolant off.","pq":["It's shut off before going up, so the long move doesn't spray the whole enclosure."]},"g49":{"que":"Cancels the length offset.","pq":["The next move is in machine coordinates (G53): the offset is no longer needed and this way it isn't accidentally left active for the next tool."]},"m1":{"que":"Optional stop: the machine only stops if the “Optional Stop” key is on.","pq":["Before every tool change: on the first run the operator can stop, check the previous tool's work and then carry on.","In production Optional Stop is switched off and the program runs straight through."]},"t2m6":{"que":"Tool change: T2, Ø7 drill with 140° point (tap drill for M8×1).","pq":["Ø7 is the standard tap drill for M8×1 (diameter − pitch = 8 − 1)."]},"s1820":{"que":"Spindle at 1,820 rpm.","pq":["For the Ø7 drill: Vc = π·7·1,820/1000 ≈ 40 m/min, a steel value."]},"g73":{"lvl":"err","params":[["G98","At the end of each hole it returns to the initial height (Z5), not to R."],["G73","Chip-break drilling: feeds in steps of Q and backs off slightly."],["X20. Y10.","First hole."],["Z-17.274","Hole bottom (point included)."],["R2.5","Feed start height: Z5 to Z2.5 in rapid."],["Q1.75","Depth of each peck: 1.75 mm."],["F0.08","Feed… in mm/min (G94 active)."]],"que":"Chip-break drilling cycle: drills the first hole in 1.75 mm pecks to Z-17.274.","pq":["G73 makes small retracts to break the chip without leaving the hole: it's faster than G83.","The -17.274 depth includes the 140° point: full diameter reaches about Z-16."],"riesgo":"F0.08 with G94 active means 0.08 mm per minute: about 3½ hours for 16 mm. The drill spins without cutting, heats up and gets ruined. The right value was 0.08 mm/rev = 145.6 mm/min."},"hole2":{"que":"Second hole of the same cycle: the machine moves to X-20 Y-10 and repeats the drilling.","pq":["Canned cycles are modal: just write the new position and the cycle repeats with the same parameters."]},"g80":{"que":"Cancels the canned cycle.","pq":["Without G80, the next X/Y move would drill another hole."]},"g81":{"lvl":"err","params":[["G81","Simple drilling: feeds to Z and rapids out."],["Z-17.128","Hole bottom."],["R3.5","Feed starts at Z3.5."],["F0.07","Feed in mm/min (G94)."]],"que":"Simple drilling cycle for the Ø6.2 holes that will be reamed to Ø6.5.","pq":["Ø6.2 leaves 0.15 mm per side for the reamer: the typical allowance for reaming an H7 hole."],"riesgo":"Same mistake as Drill1: F0.07 mm/min. The right value was about 0.07 mm/rev = 127 mm/min."},"s2499":{"que":"Spindle at 2,499 rpm for the Ø12 flat end mill.","pq":["Vc = π·12·2,499/1000 ≈ 94 m/min: a steel value, very different from the 40,000 rpm of the facing."]},"g43h4":{"que":"Length offset H4 for T4: here the number is right.","pq":["Compare with the drills: T4 → H4, T6 → H6, T5 → H5, T7 → H7. Only T2 and T3 have H1."]},"g43gen":{"que":"Activates the length offset of the newly loaded tool and drops to Z15.","pq":["Here the H number matches the tool number: correct.","Z15 is the safe height above the part where every operation starts."]},"plunge":{"lvl":"warn","que":"Feed down (F75) to Z-14.3, outside the part.","pq":["The point X-31.2 Y29.6 is outside the plate (Y20 is the edge): the cutter drops through air next to the part.","The contour is done in one full-depth pass: Z-15.5."],"riesgo":"If the stock is bigger in Y than you think, this vertical plunge goes into solid: a flat end mill needs to be centre-cutting or it breaks."},"leadin":{"que":"YZ-plane arc lead-in (G19): the cutter drops from Z-14.3 to Z-15.5 while approaching the part.","pq":["As in the facing: the edge loads up gradually."]},"cfeed":{"que":"Contour: pass along the Y=26 side (cutter centre) at 124.94 mm/min.","pq":["The centre of the Ø12 cutter is 6 mm from the part: Y26 − 6 = Y20, the edge of the 60×40 plate.","There's no G41/G42: Fusion already computed the radius compensation. If the real cutter isn't Ø12, the part changes size."]},"corner":{"que":"Arc around the corner: the cutter centre swings at radius 6 around the part corner.","pq":["Path radius 6 = cutter radius: the part corner stays sharp (90°)."]},"leadout":{"que":"YZ-plane arc lead-out and retract.","pq":["The edge leaves the material without marking it."]},"chdown":{"que":"Drops to Z-2 for the chamfer (first to Z2 in a controlled rapid at F1400).","pq":["T6 is a 120° countersink: the lower it goes, the wider the chamfer. Z-2 gives a chamfer of about 0.5–1.5 mm on the face (which is at Z-1 after facing)."]},"chcircle":{"que":"Circle around the hole (G3, circular interpolation): chamfers the hole edge.","pq":["The arc centre is the hole centre; the path radius sets the chamfer width: 3.285 for the tapped holes, 2.018 for the reamed ones."]},"hifmove":{"lvl":"warn","que":"Move between chamfers in G1 at 228,600 mm/min: a “disguised” rapid.","pq":["See the comment at the top of the program: on 5 axes this keeps the path straight.","The machine caps the feed at its real maximum."],"riesgo":"It happens at Z5: if the safe height is wrong, the part gets hit at full speed."},"g0move335":{"lvl":"warn","que":"Modal rapid (G0 active from the previous line) to the next chamfer.","pq":["In this version the post uses normal G0: the path is only straight with Setting 335 = Linear + Rotary."]},"chcontour":{"que":"Chamfer along the part contour.","pq":["The path is 31.232 from centre on the X sides: the countersink touches the edge at X30 with its cone."]},"s2000":{"lvl":"warn","que":"Spindle at 2,000 rpm for the M8 tap.","pq":["In rigid tapping speed and feed are linked: F = S × pitch."]},"g84":{"lvl":"warn","params":[["G84","Rigid tapping: feeds in, reverses the spindle at the bottom, comes out."],["Z-16.","Thread bottom."],["R2.5","Start height."],["F2000.","2,000 mm/min ÷ 2,000 rpm = 1.0 mm pitch."]],"que":"Right-hand tapping cycle in the Ø7 holes.","pq":["The resulting pitch is 1.0 mm: it's M8×1 (fine pitch). The Ø7 tap drill is right for this pitch.","The machine synchronises the spindle with the Z axis: every rev Z advances exactly one pitch."],"riesgo":"If the magazine holds a normal M8 tap (1.25 pitch), the thread strips and the tap breaks. Check the pitch marked on the tap."},"s800":{"que":"Spindle at 800 rpm for the Ø6.5 reamer.","pq":["Reamers run slowly: Vc = π·6.5·800/1000 ≈ 16 m/min. Low speed = an accurate, smooth hole."]},"g95":{"lvl":"err","que":"Switches to feed in mm/rev.","pq":["For the reamer the post writes feed per rev. The G94 after the cycle restores mm/min."],"riesgo":"The next cycle has F0.: with G95, zero millimetres per rev."},"g89":{"lvl":"err","params":[["G89","Reaming with dwell at the bottom, feed out."],["Z-16.","Bottom."],["R3.5","Start height."],["P0","Dwell at the bottom: 0 seconds."],["F0.","Zero feed."]],"que":"Reaming cycle for the Ø6.2 holes to Ø6.5.","pq":["G89 feeds out (not rapid) so it doesn't score the reamed hole walls."],"riesgo":"F0. → the machine alarms or won't move. In Fusion the reaming feed was left at zero."},"g94back":{"que":"Back to feed in mm/min.","pq":["Restores the standard mode for the following moves."]},"g53y":{"que":"Brings the table forward (machine Y0) to unload the part.","pq":["At the end of the program the operator finds the part near the door."]},"m30":{"que":"End of program: stops everything and rewinds.","pq":["M30 rewinds the program: pressing Cycle Start again machines the next part."]},"seconda":{"lvl":"err","que":"Comment: the second part of the program starts (the other side of the part).","pq":["Fusion merged two setups into one file. The second setup machines the opposite face: the part has to be flipped."],"riesgo":"Between the two parts there's no M0 (mandatory stop) and no second work zero (G55). See Errors."},"m1flip":{"lvl":"err","que":"Optional stop before the second part.","pq":["Here the operator should flip the part and re-set zero."],"riesgo":"M1 only stops if Optional Stop is on. If it's off, the machine faces 10 mm off the finished side, over the tapped holes."},"facestep":{"que":"New facing pass 3 mm lower (Z-2.8 → Z-4).","pq":["The second face removes 10 mm in 4 levels: Z-1, -4, -7, -10. Each level has 7 zig-zag passes."]},"chz11":{"que":"Drops to Z-11 to chamfer the contour edge on the second side.","pq":["After facing the face is at Z-10: Z-11 gives the same chamfer as the first side (1 mm below the face)."]},"n1025":{"que":"Rapid above the start of the second-side facing, wider than the first (X±41.1).","pq":["The second side is unmachined stock: Fusion uses the stock dimensions, not the finished plate."]}},"errors":[{"lvl":"err","t":"Spindle at 40,000 rpm","pq":"The facing (T1) and chamfer (T6) ask for 40,000 rpm. Haas UMC spindles reach 8,100, 12,000 or 15,000 rpm depending on the version. The control caps the rpm or stops with an alarm. If it caps them, the F6100 feed stays the same at 5 times fewer rpm: each tooth takes 5 times the chip.","sol":"In Fusion set the tool speed within the machine limit (and recalculate feed per tooth), or use a machine the library was built for.","prog":"o12","lines":[19,124]},{"lvl":"err","t":"Length offset H1 for drills T2 and T3","pq":"G43 H1 applies T1's length (the end mill). With a drill loaded, the drill's real Z is off by the length difference between the two tools: the rapid to Z5 can end up inside the part, and the hole depth is wrong.","sol":"In the Fusion library set “Length offset” = tool number (T2 → 2, T3 → 3) and re-post. The other operations (H4, H5, H6, H7) are already right.","prog":"o12","lines":[55,75]},{"lvl":"err","t":"Drilling at 0.08 and 0.07 mm/min","pq":"With G94 active, F0.08 means 0.08 millimetres per minute: 17 mm takes over 3 hours per hole. The drill spins without managing to cut, rubs, heats up and wears out. The feed was entered in mm/rev in a mm/min field.","sol":"Feed per rev 0.08 → F = 0.08 × 1,820 = 145.6 mm/min (Drill1) and 0.07 × 1,820 ≈ 127 mm/min (Drill2).","prog":"o12","lines":[59,79]},{"lvl":"err","t":"Reaming with zero feed","pq":"The G89 cycle is in G95 (mm/rev) with F0.: zero millimetres per rev. The machine alarms or sits still with the reamer spinning in the hole.","sol":"Typical feed for a Ø6.5 reamer: 0.1–0.2 mm/rev (F0.15 with G95, or 120 mm/min with G94).","prog":"o12","lines":[213,214]},{"lvl":"err","t":"Second side with no M0 and the same work zero","prog":"o04","pq":"In O00004 the second part (10 mm facing and chamfer at Z-11) starts after an M1, an optional stop, and still uses G54. If Optional Stop is off, the machine doesn't stop and faces 10 mm off the side it just finished. Even if it stops, G54 is still the first side's zero.","sol":"M0 before the second part, with a comment for the operator (“FLIP THE PART”), and a second work zero (G55) for the second setup in Fusion. Better still: two separate programs.","lines":[225,228,232]},{"lvl":"warn","t":"Tapping with a 1.0 mm pitch","pq":"F2000 / S2000 = 1.0 mm per rev, i.e. M8×1 (fine pitch). Standard M8 is 1.25 pitch. The Ø7 tap drill is right for M8×1 (for M8×1.25 it would be Ø6.8).","sol":"Check the tap at the machine. If it's M8×1.25, fix the tool pitch in Fusion (F becomes 2,500) and the tap drill (Ø6.8).","prog":"o12","lines":[185,193]},{"lvl":"warn","t":"5-axis rapids: two different approaches","pq":"O00012 replaces rapids with G1 F228600 (rapid override doesn't work on these lines); O00004 uses G0 and requires Setting 335 = Linear + Rotary. They're two ways of getting a straight rapid: don't mix them.","sol":"Pick one option in the post and always use it. With G0, check Setting 335 on the machine before running.","prog":"o12","lines":[3,139,153,161]}],"checks":[{"t":"T1–T7 lengths measured and H numbers equal to tool numbers","pq":"Especially T2 and T3, which use H1 in the program.","prog":"o12","lines":[23,55,75]},{"t":"Clearance under the holes and under the contour","pq":"The drills go down to Z-17.3 and the contour to Z-15.5: the vise parallels must not sit under the holes (X±20 Y±10) or under the edge.","prog":"o12","lines":[59,79,100]},{"t":"Table free to rotate to B0 C0","pq":"The “B0. C0.” line moves the table with the part on it: the vise and part must not touch the guards.","prog":"o12","lines":[15]},{"t":"Setting 335 = Linear + Rotary (for O00004)","pq":"Without it, rapids with rotary axes aren't straight.","prog":"o04","lines":[3,139]},{"t":"M8×1 tap loaded in T5","pq":"With an M8×1.25 the thread strips.","prog":"o12","lines":[184,193]},{"t":"Spindle max rpm ≥ program rpm","pq":"The program asks for 40,000 rpm: fix it before running.","prog":"o12","lines":[19,124]},{"t":"Part flipped and new zero before the second part (O00004)","pq":"The program won't stop by itself: Optional Stop must be on.","prog":"o04","lines":[228]},{"t":"First run: single block, rapids at 25 %, Optional Stop on","pq":"In O00012 the rapids are G1: turn the feed override down too.","prog":"o12","lines":[49]}],"codes":[["G90","Absolute coordinates","All coordinates are measured from the work zero.","\\bG90\\b"],["G94 / G95","Feed mm/min / mm/rev","The root of two errors: F0.08 in G94 and F0. in G95.","\\bG9[45]\\b"],["G17 / G18 / G19","XY / XZ / YZ plane","Lead-in and lead-out arcs are in XZ (facing) and YZ (contour).","\\bG1[789]\\b"],["G21","Millimetres","Fixes the units in the program.","\\bG21\\b"],["G269","Tilted plane off (Haas)","Machining in 3 axes with the table flat.","G269"],["G53","Machine coordinates","Up to machine Z0 before changes and rotations.","\\bG53\\b"],["G54","Work zero","The same for both sides: error 5.","\\bG54\\b"],["G0 / G1","Rapid / feed","In O00012 rapids are G1 F228600.","\\bG[01]\\b"],["G2 / G3","Clockwise / counter-clockwise arc","Links between passes and chamfer circles.","\\bG[23]\\b"],["G43 H / G49","Length offset on / off","H must be the loaded tool's number: error 2.","\\bG4[39]\\b"],["G73","Chip-break drilling","Drill1, Ø7 holes.","\\bG73\\b"],["G81","Simple drilling","Drill2, Ø6.2 holes.","\\bG81\\b"],["G84","Rigid tapping","Drill3: F/S = pitch.","\\bG84\\b"],["G89","Reaming with dwell","Drill5: feed out so the hole isn't scored.","\\bG89\\b"],["G80","End of canned cycle","Without it, every XY move would drill a hole.","\\bG80\\b"],["G98","Return to initial point","Between holes it rises to Z5, not R.","\\bG98\\b"],["M6 / Tn","Tool change / pre-select","T alone readies the next tool in the magazine.","M6|^N\\d+ T\\d+$"],["M3 / M5","Spindle clockwise / stop","Every operation starts and stops the spindle.","\\bM[35]\\b"],["M8 / M9","Coolant on / off","On in every operation.","\\bM[89]\\b"],["M1 / M30","Optional stop / end","M1 before every change; no M0 between the two sides.","\\bM1\\b|M30"],["B0. C0.","Rotary axes to zero","Table flat: 3-axis machining on a 5-axis machine.","B0\\. C0\\."]],"tools":{"head":["T","Tool","Operations","Speed","Vc","Time (milling)","Note"],"rows":[{"prog":"o04","op":0,"cells":["T1","Ø12 R0.5 end mill","Facing1, Facing1 2","40,000","1,508 m/min","34 s","S40000 above the limit"],"cls":[null,null,null,"bad",null,null,"bad"]},{"prog":"o04","op":1,"cells":["T2","Ø7 140° drill","Drill1","1,820","40 m/min","—","H1 · F0.08 mm/min"],"cls":[null,null,null,null,null,null,"bad"]},{"prog":"o04","op":2,"cells":["T3","Ø6.2 140° drill","Drill2","1,820","35 m/min","—","H1 · F0.07 mm/min"],"cls":[null,null,null,null,null,null,"bad"]},{"prog":"o04","op":3,"cells":["T4","Ø12 flat end mill","2D Contour1","2,499","94 m/min","2.2 min","ok"],"cls":[null,null,null,null,null,null,""]},{"prog":"o04","op":4,"cells":["T6","Ø10 120° countersink","Chamfer1, Chamfer1 2","40,000","1,257 m/min","9 s","S40000 above the limit"],"cls":[null,null,null,"bad",null,null,"bad"]},{"prog":"o04","op":5,"cells":["T5","M8 right-hand tap","Drill3","2,000","50 m/min","—","pitch 1.0: M8×1?"],"cls":[null,null,null,null,null,null,"meh"]},{"prog":"o04","op":6,"cells":["T7","Ø6.5 reamer","Drill5","800","16 m/min","—","F0 in G95"],"cl const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const nf = (v, d) => v == null ? "—" : Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const store = {
  get(k, def) { try { const v = localStorage.getItem(D.key + "-" + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(D.key + "-" + k, JSON.stringify(v)); } catch (e) {} }
};
function hl(line) {
  if (/^\s*(N\d+\s*)?\(.*\)\s*$/.test(line) || /^\s*;/.test(line)) return '<span class="t-c">' + esc(line) + "</span>";
  let s = esc(line);
  s = s.replace(/(\(.*?\)|;.*$)/g, '<span class="t-c">$1</span>');
  return s
    .replace(/^(N\d+)/, '<span class="t-n">$1</span>')
    .replace(/\b(G\d+(?:\.\d)?)(?![^<]*<\/span>)/g, '<span class="t-g">$1</span>')
    .replace(/\b(M\d*=?\d+)(?![^<]*<\/span>)/g, '<span class="t-m">$1</span>');
}

function firstLine(p) { const i = p.lines.findIndex(l => l[2] === "op"); return i < 0 ? 0 : i; }

function opOf(i, p) { p = p || S.prog; return p.lineOp[i]; }

/* ---------- editor ---------- */
function renderCode() {
  const box = $("code"), p = S.prog;

    const kind = l[2], txt = l[1];
    const lv = levelOf(i) || "";
    const cls = ["ln", kind === "gap" ? "gap" : (txt.trim() ? "" : "blank"), lv, S.marks.has(i) ? "mark" : "", i === S.cur ? "cur" : ""].join(" ");

    return '<div class="' + cls + '" data-i="' + i + '"><span class="no">' + no + '</span><span class="flag">' + flag + "</span><span>" + (kind === "gap" ? esc(txt) : (txt ? hl(txt) : " ")) + "</span></div>";

    box.innerHTML = '<p class="note">Tap an error to see the lines that cause it in the editor.</p>' + D.errors.map((e, k) =>
      '<button class="card ' + e.lvl + (k === S.errSel ? " on" : "") + '" data-err="' + k + '"><h4><span class="n">' + (k + 1) + "</span>" + e.t + "</h4>" +
      '<span class="lbl">Why</span><p>' + e.pq + '</p><span class="lbl">Fix</span><p>' + e.sol + "</p></button>").join("");
    const e = D.errors[S.errSel];
    setMsg(e.lvl, "Error " + (S.errSel + 1) + ": " + e.t.replace(/<[^>]+>/g, "") + ".");
    return;
  }
  if (S.mode === "collisioni") {
    $("infoTitle").textContent = "Checks before running";
    const done = D.checks.filter((c, k) => S.checks[k]).length;
    $("infoSub").textContent = done + " of " + D.checks.length + " done";
    box.innerHTML = '<p class="note">Tick each item once you\'ve checked it at the machine. Ticks are only saved in this browser.</p>' + D.checks.map((c, k) =>
      '<div class="check' + (S.checks[k] ? " done" : "") + '"><input type="checkbox" id="chk' + k + '" data-chk="' + k + '"' + (S.checks[k] ? " checked" : "") + '><label for="chk' + k + '">' + c.t + "</label><p>" + c.pq + "</p></div>").join("");
    setMsg(done === D.checks.length ? "ok" : "warn", done === D.checks.length ? "All checks done. First run: single block." : (D.checks.length - done) + " checks left before running.");
    return;
  }
  if (S.mode === "codici") {
    $("infoTitle").textContent = "Codes in this exercise"; $("infoSub").textContent = "tap a row to see it in the editor";
    box.innerHTML = '<div class="tbl-wrap"><table><tr><th>Code</th><th>Function</th><th>Why in this exercise</th></tr>' +
      D.codes.map((c, k) => '<tr class="click' + (k === S.codeSel ? " hit" : "") + '" data-code="' + k + '"><td><code>' + c[0] + "</code></td><td>" + c[1] + "</td><td>" + c[2] + "</td></tr>").join("") + "</table></div>";
    setMsg("ok", D.codes.length + " codes explained. The highlighted lines in the editor contain them.");
    return;
  }
  if (S.mode === "utensili") {
    $("infoTitle").textContent = "Tools and times"; $("infoSub").textContent = "tap a row to go to the operation";
    box.innerHTML = '<div class="tbl-wrap"><table><tr>' + D.tools.head.map(h => "<th>" + h + "</th>").join("") + "</tr>" +
      D.tools.rows.map((r, k) => '<tr class="click' + (k === S.toolSel ? " hit" : "") + '" data-tool="' + k + '">' + r.cells.map((c, j) => "<td" + (r.cls && r.cls[j] ? ' class="' + r.cls[j] + '"' : "") + ">" + c + "</td>").join("") + "</tr>").join("") +
      "</table></div>" + (D.tools.note ? '<p class="note">' + D.tools.note + "</p>" : "");
    setMsg(D.tools.lvl || "ok", D.tools.msg || "Times estimated from toolpath length and programmed feeds.");
    return;
  }
  if (S.mode === "confronto") {
    const c = D.compare;
    $("infoTitle").textContent = c.title; $("infoSub").textContent = c.sub;
    box.innerHTML = c.html;
    setMsg(c.lvl || "ok", c.msg);
  }
}
$("info").addEventListener("click", e => {
  const card = e.target.closest("[data-err]"); if (card) { selectError(+card.dataset.err); return; }
  const row = e.target.closest("[data-code]"); if (row) { selectCode(+row.dataset.code); return; }
  const tr = e.target.closest("[data-tool]"); if (tr) { selectTool(+tr.dataset.tool); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { const [pid, n] = j.dataset.jump.split(":"); loadProg(P[pid]); setMode("ciclo", true); const k = idxOfFileLine(S.prog, +n); go(k < 0 ? 0 : k); }
});
$("info").addEventListener("change", e => {
  const k = e.target.dataset.chk; if (k == null) return;
  S.checks[+k] = e.target.checked; store.set("checks", S.checks);
  markRefs(D.checks[+k]); renderCode(); renderInfo();
});
function markRefs(ref) {
  if (ref.prog && P[ref.prog] && S.prog !== P[ref.prog]) loadProg(P[ref.prog]);
  S.marks = new Set((ref.lines || []).map(n => idxOfFileLine(S.prog, n)).filter(i => i >= 0));
}
function selectError(k) {
  S.errSel = k; markRefs(D.errors[k]);
  const first = [...S.marks][0]; S.cur = first != null ? first : -1;
  render();
}
function selectCode(k) {
  S.codeSel = k;
  const re = new RegExp(D.codes[k][3]);
  let p = S.prog;
  if (!p.lines.some(l => l[2] !== "gap" && re.test(l[1]))) { const o = D.progs.find(q => q.lines.some(l => l[2] !== "gap" && re.test(l[1]))); if (o) loadProg(o); }
  S.marks = new Set(S.prog.lines.map((l, i) => l[2] !== "gap" && re.test(l[1]) ? i : -1).filter(i => i >= 0));
  S.cur = -1; render();
}
function selectTool(k) {
  S.toolSel = k; const r = D.tools.rows[k];
  if (r.prog && P[r.prog]) loadProg(P[r.prog]);
  const op = S.prog.ops[r.op]; if (!op) { render(); return; }
  S.marks = new Set(); for (let i = 0; i < S.prog.lines.length; i++) if (S.prog.lineOp[i] === r.op) S.marks.add(i);
  S.cur = op.start; render();
}

/* ---------- softkey ---------- */
function hkeys() {
  const k = [["ciclo", "Work cycle", "block by block"], ["errori", "Errors", D.errors.length + " found"], ["collisioni", "Collisions", "before running"], ["codici", "Codes", "and why"], ["utensili", "Tools", "and times"]];
  if (D.compare) k.push(["confronto", D.compare.key, D.compare.keySub]);
  return k;
}
function vkeysFor(mode) {
  if (mode === "ciclo") {
    const v = [["◀ Block", () => step(-1)], ["Block ▶", () => step(1)], ["◀ Op.", () => jumpOp(-1)], ["Op. ▶", () => jumpOp(1)]];
    v.push([anim ? "■ Stop" : "▶ Simulate", () => (anim ? stopAnim() : startAnim()), "op. toolpath"]);
    if (D.progs.length > 1) D.progs.forEach(p => { if (p !== S.prog) v.push(["Open " + p.short, () => { loadProg(p); S.cur = firstLine(p); render(); }, p.shortSub]); });
    v.push(["Start", () => go(0)]);
    return v;
  }
  if (mode === "errori") return D.errors.slice(0, 8).map((e, k) => ["Error " + (k + 1), () => selectError(k), e.lvl === "err" ? "severe" : "warning"]);
  if (mode === "collisioni") return [["Clear ticks", () => { S.checks = []; store.set("checks", []); S.marks = new Set(); render(); }]];
  if (mode === "codici" || mode === "confronto" || mode === "utensili") return D.progs.map(p => ["View " + p.short, () => { loadProg(p); S.marks = new Set(); S.codeSel = -1; S.cur = firstLine(p); render(); }, p.shortSub]);
  return [];
}
function renderKeys() {
  const v = vkeysFor(S.mode);
  const vk = $("vkeys"); vk.innerHTML = "";
  for (let k = 0; k < 8; k++) {
    const b = document.createElement("button"); b.className = "sk";
    if (v[k]) {
      b.innerHTML = v[k][0] + (v[k][2] ? "<small>" + v[k][2] + "</small>" : "");
      b.onclick = v[k][1];
      if (S.mode === "errori" && k === S.errSel) b.classList.add("on");
      if (S.mode !== "ciclo" && S.mode !== "errori" && S.mode !== "collisioni" && D.progs[k] === S.prog && D.progs.length > 1) b.classList.add("on");
    } else { b.disabled = true; b.textContent = "·"; b.setAttribute("aria-hidden", "true"); }
    vk.appendChild(b);
  }
  const H = hkeys();
  const hk = $("hkeys"); hk.innerHTML = "";
  for (let k = 0; k < 8; k++) {
    if (k === 7) {
      const a = document.createElement("a"); a.className = "sk link";
      a.href = D.board;
      a.innerHTML = "◀ Board<small>exercise notes</small>";
      hk.appendChild(a); continue;
    }
    const b = document.createElement("button"); b.className = "sk";
    const h = H[k];
    if (h) {
      b.innerHTML = h[1] + "<small>" + h[2] + "</small>";
      if (h[0] === S.mode) { b.classList.add("on"); b.setAttribute("aria-pressed", "true"); }
      b.onclick = () => setMode(h[0]);
    } else { b.disabled = true; b.textContent = "·"; b.setAttribute("aria-hidden", "true"); }
    hk.appendChild(b);
  }
}
function loadProg(p) {
  S.prog = p;
  $("path").textContent = "/" + p.file;
  $("edName").textContent = p.ctrl;
}
function setMode(m, quiet) {
  stopAnim();
  S.mode = m; S.marks = new Set();
  if (m === "ciclo") { if (S.cur < 0) S.cur = firstLine(S.prog); }
  else if (m === "errori") { selectError(S.errSel); store.set("mode", m); return; }
  else { S.cur = -1; S.codeSel = -1; S.toolSel = -1; }
  store.set("mode", m);
  if (!quiet) render();
}

/* ---------- disegno ---------- */
const cv = $("cv"), ctx = cv.getContext("2d");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim = null, W = 300, H = 200;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function viewOf(op) { return op ? D.views[op.view] : null; }
function frame(v) {
  const w = cv.clientWidth || 300;
  const bw = v.b[2] - v.b[0], bh = v.b[3] - v.b[1];
  const padL = 34, padR = 40, padT = 22, padB = 22;
  const k = Math.min((w - padL - padR) / bw, 1.0 * (w * 0.62) / bh);
  W = w; H = Math.round(bh * k + padT + padB);
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ox = padL + ((w - padL - padR) - bw * k) / 2;
  return { k, sx: a => ox + (a - v.b[0]) * k, sy: b => H - padB - (b - v.b[1]) * k };
}
function drawPath(F, pts, style) {
  ctx.lineWidth = style.w || 1;
  let last = null;
  for (let j = 0; j < pts.length; j += 3) {
    const a = pts[j], b = pts[j + 1], r = pts[j + 2];
    if (last && (!style.rapids && r)) { last = [a, b]; continue; }
    if (last) {
      ctx.strokeStyle = r ? style.rc : style.c;
      ctx.setLineDash(r ? [4, 3] : []);
      ctx.beginPath(); ctx.moveTo(F.sx(last[0]), F.sy(last[1])); ctx.lineTo(F.sx(a), F.sy(b)); ctx.stroke();
    }
    last = [a, b];
  }
  ctx.setLineDash([]);
}
function drawBase(F, v, op) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = css("--paper"); ctx.fillRect(0, 0, W, H);
  ctx.font = "11px " + css("--font-ui");
  (v.shapes || []).forEach(s => {
    ctx.fillStyle = s.fill || "transparent"; ctx.strokeStyle = s.stroke || "transparent"; ctx.lineWidth = 1;
    if (s.rect) { const [a, b, c, d] = s.rect; const x = F.sx(a), y = F.sy(d), w = F.sx(c) - x, h = F.sy(b) - y; if (s.fill) ctx.fillRect(x, y, w, h); if (s.stroke) ctx.strokeRect(x, y, w, h); }
    if (s.poly) { ctx.beginPath(); s.poly.forEach((p, k) => k ? ctx.lineTo(F.sx(p[0]), F.sy(p[1])) : ctx.moveTo(F.sx(p[0]), F.sy(p[1]))); ctx.closePath(); if (s.fill) ctx.fill(); if (s.stroke) ctx.stroke(); }
    if (s.circle) { const [a, b, r] = s.circle; ctx.beginPath(); ctx.arc(F.sx(a), F.sy(b), r * F.k, 0, 7); if (s.fill) ctx.fill(); if (s.stroke) ctx.stroke(); }
    if (s.text) { ctx.fillStyle = s.color || css("--muted"); ctx.fillText(s.text, F.sx(s.at[0]), F.sy(s.at[1])); }
    if (s.dash) { ctx.strokeStyle = s.color || css("--err"); ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(F.sx(s.dash[0]), F.sy(s.dash[1])); ctx.lineTo(F.sx(s.dash[2]), F.sy(s.dash[3])); ctx.stroke(); ctx.setLineDash([]); }
  });
  if (v.ghost) drawPath(F, v.ghost, { c: "rgba(90,102,112,.16)", rc: "rgba(0,0,0,0)", w: 1 });
  // assi
  ctx.strokeStyle = css("--muted"); ctx.lineWidth = 1; ctx.setLineDash([6, 3, 2, 3]);
  if (v.b[1] < 0 && v.b[3] > 0) { ctx.beginPath(); ctx.moveTo(F.sx(v.b[0]), F.sy(0)); ctx.lineTo(F.sx(v.b[2]), F.sy(0)); ctx.stroke(); }
  if (v.b[0] < 0 && v.b[2] > 0 && v.cross) { ctx.beginPath(); ctx.moveTo(F.sx(0), F.sy(v.b[1])); ctx.lineTo(F.sx(0), F.sy(v.b[3])); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.fillStyle = css("--muted");
  ctx.fillText(v.ax[0] + " →", W - 40, H - 6);
  ctx.save(); ctx.translate(12, 40); ctx.rotate(-Math.PI / 2); ctx.fillText("← " + v.ax[1], -10, 0); ctx.restore();
  if (op) drawPath(F, op.pts, { c: "rgba(10,106,140,.55)", rc: "rgba(10,106,140,.25)", w: 1.2, rapids: true });
}
function zGauge(z, op) {
  if (!op || z == null || !op.z) return;
  const [z0, z1] = op.z; if (z1 - z0 < 0.01) return;
  const x = W - 22, y0 = 26, y1 = H - 26;
  const y = zz => y1 - (Math.max(z0, Math.min(z1, zz)) - z0) / (z1 - z0) * (y1 - y0);
  ctx.strokeStyle = css("--rule"); ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
  ctx.fillStyle = css("--muted"); ctx.font = "10px " + css("--font-ui");
  ctx.fillText(D.zLabel || "Z", x - 3, y0 - 12); ctx.fillText(nf(z1, 1), x - 18, y0 - 3); ctx.fillText(nf(z0, 1), x - 18, y1 + 12);
  ctx.fillStyle = css("--cursor"); ctx.strokeStyle = "#5c4100"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(x - 7, y(z) - 3, 14, 6); ctx.fill(); ctx.stroke();
}
function drawTool(F, a, b, label) {
  if (a == null || b == null) return;
  const x = F.sx(a), y = F.sy(b);
  const inside = x > 0 && x < W && y > 0 && y < H;
  const cx = Math.max(10, Math.min(W - 30, x)), cy = Math.max(14, Math.min(H - 8, y));
  ctx.fillStyle = css("--cursor"); ctx.strokeStyle = "#5c4100"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 9, cy); ctx.lineTo(cx + 9, cy); ctx.moveTo(cx, cy - 9); ctx.lineTo(cx, cy + 9); ctx.stroke();
  if (!inside || label) {
    ctx.fillStyle = css("--ink"); ctx.font = "600 11px " + css("--font-ui");
    const t = label || "out of view ↗";
    ctx.fillText(t, Math.min(cx + 10, W - ctx.measureText(t).width - 4), Math.max(cy - 8, 12));
  }
}
function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
function curOp() {
  let i = S.cur; if (i < 0) { const m = [...S.marks][0]; i = m == null ? -1 : m; }
  const oi = i >= 0 ? opOf(i) : null;
  return oi != null && oi >= 0 ? S.prog.ops[oi] : null;
}
function drawScene() {
  if (anim) return;
  const op = curOp();
  const v = viewOf(op) || D.views[D.progs[0].ops[0].view];
  const F = frame(v);
  drawBase(F, v, op);
  $("cap").textContent = (op ? op.name + " · " : "") + v.cap;
  const t = S.cur >= 0 ? S.prog.tp[S.cur] : null;
  if (t && t[0] != null) {
    if (t[3] != null) {
      ctx.strokeStyle = css("--cursor"); ctx.lineWidth = 2.5; ctx.setLineDash(t[5] ? [5, 4] : []);
      ctx.beginPath(); ctx.moveTo(F.sx(t[3]), F.sy(t[4])); ctx.lineTo(F.sx(t[0]), F.sy(t[1])); ctx.stroke(); ctx.setLineDash([]);
    }
    drawTool(F, t[0], t[1], null);
    zGauge(t[2], op);
  } else if (S.cur >= 0) {
    ctx.fillStyle = css("--muted"); ctx.font = "12px " + css("--font-ui");
    ctx.fillText("Tool position not defined yet", 40, 40);
  }
}
function startAnim() {
  const op = curOp(); if (!op || op.pts.length < 6) return;
  const v = viewOf(op);
  const pts = op.pts, n = pts.length / 3;
  const dur = Math.min(14000, Math.max(4000, n * 6));
  if (reduce) { stopAnim(); return; }
  let t0 = null;
  const F = frame(v);
  const tick = ts => {
    if (t0 == null) t0 = ts;
    const f = ((ts - t0) % dur) / dur, j = Math.floor(f * (n - 1)) * 3;
    drawBase(F, v, op);
    ctx.strokeStyle = css("--cursor"); ctx.lineWidth = 2;
    ctx.beginPath(); for (let q = Math.max(0, j - 90); q <= j; q += 3) { if (q === Math.max(0, j - 90)) ctx.moveTo(F.sx(pts[q]), F.sy(pts[q + 1])); else ctx.lineTo(F.sx(pts[q]), F.sy(pts[q + 1])); } ctx.stroke();
    drawTool(F, pts[j], pts[j + 1], "simulation " + Math.round(f * 100) + " %");
    anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
  renderKeys();
}

/* ---------- render ---------- */
function render() { renderKeys(); renderCode(); renderPos(); renderInfo(); drawScene(); }
if (window.ResizeObserver) new ResizeObserver(() => { if (!anim) drawScene(); }).observe(cv);
else window.addEventListener("resize", drawScene);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (S.mode !== "ciclo") return;
  if (e.key === "PageDown") { e.preventDefault(); step(1); }
  if (e.key === "PageUp") { e.preventDefault(); step(-1); }
});

renderAxes();
loadProg(S.prog);
const start = store.get("mode", "ciclo");
if (hkeys().some(h => h[0] === start) && start !== "ciclo") setMode(start); else render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!anim) drawScene(); });
})();
</script>

</body>
