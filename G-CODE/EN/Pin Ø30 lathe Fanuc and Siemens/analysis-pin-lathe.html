<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pin lathe analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: pannello di controllo CNC — barra di stato, riga messaggi, finestre (editor / spiegazione / posizione), softkey verticali a destra e orizzontali in basso. Un unico aspetto chiaro industriale, di proposito. */
:root {
  --frame: #b9c1c8;
  --win: #eef1f3;
  --paper: #ffffff;
  --ink: #1b232a;
  --muted: #5a6670;
  --rule: #98a3ad;
  --head: #34495a;
  --head-ink: #f4f7f9;
  --accent: #0a6a8c;
  --cursor: #f3a712;
  --cursor-ink: #1b1400;
  --key-top: #fbfcfc;
  --key-bot: #c8cfd5;
  --key-on: #ffd27a;
  --ok: #2c7a3a;
  --warn: #b76a00;
  --warn-bg: #fff1d6;
  --err: #c0262d;
  --err-bg: #fde3e3;
  --steel: #c4ccd3;
  --steel-dark: #7d8a95;
  --code-g: #0a5d9e;
  --code-m: #7a3a9a;
  --code-c: #2f7d4a;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--frame);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  padding-inline: 16px;
  padding-block: 16px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.hmi {
  max-width: 1480px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 128px;
  grid-template-areas: "bar bar" "msg msg" "work vkeys" "hkeys hkeys";
  gap: 4px;
  background: #8d979f;
  padding: 4px;
  border: 1px solid #6f7a83;
}

/* barra superiore */
.bar { grid-area: bar; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px; }
.bar > div { background: var(--head); color: var(--head-ink); padding: 6px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.area { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.path { font-family: var(--font-code); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chan { font-weight: 600; letter-spacing: .04em; }
.chan .led { width: 10px; height: 10px; border-radius: 50%; background: #58c26a; box-shadow: 0 0 0 2px #2a3a47; }

/* riga messaggi */
.msg { grid-area: msg; background: var(--paper); border: 1px solid var(--rule); padding: 5px 10px; display: flex; gap: 10px; align-items: baseline; min-height: 34px; font-weight: 500; }
.msg .tag { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 12px; padding: 1px 6px; border-radius: 2px; flex: none; }
.msg.ok .tag { background: #dcefdf; color: var(--ok); }
.msg.warn { background: var(--warn-bg); }
.msg.warn .tag { background: var(--warn); color: #fff; }
.msg.err { background: var(--err-bg); }
.msg.err .tag { background: var(--err); color: #fff; }

/* zona finestre */
.work { grid-area: work; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); grid-template-areas: "editor info" "pos info"; gap: 4px; min-width: 0; }
.win { background: var(--win); border: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; }
.win-h { background: linear-gradient(#4a6274, var(--head)); color: var(--head-ink); padding: 4px 10px; font-weight: 600; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.win-h small { font-weight: 400; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editor { grid-area: editor; }
.info { grid-area: info; }
.pos { grid-area: pos; }

/* editor */
.code { font-family: var(--font-code); font-size: 13.5px; background: var(--paper); margin: 6px; border: 1px solid var(--rule); overflow: auto; max-height: 340px; flex: 1; }
.ln { display: grid; grid-template-columns: 4.2em 1.2em minmax(0, 1fr); align-items: baseline; padding: 1px 6px 1px 0; cursor: pointer; white-space: pre; border-left: 4px solid transparent; }
.ln:hover { background: #eaf3f7; }
.ln .no { color: var(--muted); text-align: right; padding-right: 8px; font-size: 11.5px; user-select: none; }
.ln .flag { font-size: 11px; font-weight: 700; }
.ln.warn .flag { color: var(--warn); }
.ln.err .flag { color: var(--err); }
.ln.mark { background: #e3f0f6; border-left-color: var(--accent); }
.ln.cur { background: var(--cursor); color: var(--cursor-ink); border-left-color: #a46c00; }
.ln.cur .no, .ln.cur .t-n, .ln.cur .t-g, .ln.cur .t-m, .ln.cur .t-c { color: var(--cursor-ink); }
.ln.blank { cursor: default; }
.ln.gap { color: var(--muted); font-style: italic; background: repeating-linear-gradient(135deg, #f4f6f7 0 6px, #eceff1 6px 12px); }
.ln.gap.cur { background: var(--cursor); }
.t-n { color: var(--muted); }
.t-g { color: var(--code-g); font-weight: 600; }
.t-m { color: var(--code-m); font-weight: 600; }
.t-c { color: var(--code-c); font-style: italic; }

/* posizione */
.pos-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 6px 6px 0; }
.axis { background: var(--paper); border: 1px solid var(--rule); padding: 3px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; min-width: 0; }
.axis b { font-size: 12px; color: var(--muted); letter-spacing: .05em; }
.axis span { font-family: var(--font-code); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal { margin: 4px 6px 0; background: var(--paper); border: 1px solid var(--rule); padding: 4px 8px; font-family: var(--font-code); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.modal i { font-style: normal; color: var(--muted); font-family: var(--font-ui); font-size: 12px; }
.scene { margin: 6px; background: var(--paper); border: 1px solid var(--rule); position: relative; }
.scene canvas { display: block; width: 100%; }
.scene .cap { position: absolute; left: 8px; top: 4px; font-size: 12px; color: var(--muted); pointer-events: none; }

/* spiegazione */
.info-body { padding: 10px 14px 14px; overflow: auto; max-height: 720px; display: grid; gap: 12px; align-content: start; grid-auto-rows: max-content; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--head-ink); background: var(--accent); padding: 2px 8px; border-radius: 2px; justify-self: start; }
.blk { font-family: var(--font-code); font-size: 15px; background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--cursor); padding: 6px 10px; overflow-x: auto; white-space: pre; }
.sec { display: grid; gap: 4px; }
.sec h3 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sec h3::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.sec p { margin: 0; max-width: 68ch; }
.sec ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 70ch; }
.sec.why h3 { color: var(--accent); }
.sec.why { background: var(--paper); border: 1px solid #bcd6e1; padding: 8px 12px 10px; }
.sec.risk { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 6px 10px; }
.sec.risk.err { border-left-color: var(--err); background: var(--err-bg); }
.sec.risk h3 { color: var(--warn); }
.sec.risk.err h3 { color: var(--err); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--paper); }
th, td { border: 1px solid #c3cbd2; padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: #dfe5ea; font-weight: 600; font-size: 13px; }
td.num, th.num { text-align: right; font-family: var(--font-code); font-variant-numeric: tabular-nums; white-space: nowrap; }
td code, p code, li code { font-family: var(--font-code); font-size: .92em; background: #e8edf1; padding: 0 3px; border-radius: 2px; }
tr.hit td { background: #fff3d1; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #eaf3f7; }
td.bad { color: var(--err); font-weight: 600; }
td.meh { color: var(--warn); font-weight: 600; }

.card { background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--warn); padding: 8px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; }
.card.err { border-left-color: var(--err); }
.card.on { box-shadow: 0 0 0 2px var(--cursor); }
.card h4 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.card h4 .n { font-family: var(--font-code); font-size: 12px; color: var(--muted); }
.card .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; max-width: 70ch; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; background: var(--paper); border: 1px solid var(--rule); padding: 8px 12px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.check label { font-weight: 600; cursor: pointer; }
.check p { grid-column: 2; margin: 0; color: var(--muted); }
.check.done label { text-decoration: line-through; color: var(--ok); }
.note { font-size: 13.5px; color: var(--muted); max-width: 72ch; margin: 0; }

/* softkey */
.vkeys { grid-area: vkeys; display: grid; grid-auto-rows: minmax(54px, auto); gap: 4px; align-content: start; }
.hkeys { grid-area: hkeys; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.sk { background: linear-gradient(var(--key-top), var(--key-bot)); border: 1px solid #77838d; border-radius: 3px; box-shadow: inset 0 1px 0 #fff, 0 1px 0 #6d7881; padding: 6px 8px; min-height: 48px; font-weight: 600; line-height: 1.15; text-align: center; cursor: pointer; }
.sk:hover:not(:disabled) { background: linear-gradient(#ffffff, #d7dde2); }
.sk:active:not(:disabled) { box-shadow: inset 0 2px 3px rgba(0,0,0,.25); }
.sk.on { background: linear-gradient(#fff3d6, var(--key-on)); border-color: #a46c00; }
.sk:disabled { cursor: default; color: transparent; background: linear-gradient(#e3e7ea, #cdd3d8); box-shadow: none; }
a.sk { text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: center; }
.sk small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }

@media (max-width: 1100px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-areas: "editor" "info" "pos"; }
  .code { max-height: 260px; }
  .info-body { max-height: none; }
}
@media (max-width: 760px) {
  body { padding-inline: 8px; }
  .hmi { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "msg" "vkeys" "work" "hkeys"; }
  .bar { grid-template-columns: minmax(0, 1fr) auto; }
  .bar .path-box { grid-column: 1 / -1; order: 3; }
  .vkeys { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: auto; }
  .hkeys { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sk:disabled { display: none; }
  .sk { min-height: 42px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="hmi" id="hmi">
  <header class="bar">
    <div class="area">Program</div>
    <div class="path-box"><span class="path" id="path"></span></div>
    <div class="chan"><span class="led" aria-hidden="true"></span>CHANNEL 1 · RESET</div>
  </header>

  <div class="msg ok" id="msg" role="status"><span class="tag">Info</span><span id="msgText"></span></div>

  <main class="work">
    <section class="win editor" aria-label="Program editor">
      <div class="win-h"><span>Editor</span><small id="edName"></small></div>
      <div class="code" id="code" tabindex="0" aria-label="Program lines. Use the arrow keys to move."></div>
    </section>

    <section class="win info" aria-live="polite">
      <div class="win-h"><span id="infoTitle">Explanation</span><small id="infoSub"></small></div>
      <div class="info-body" id="info"></div>
    </section>

    <section class="win pos" aria-label="Position and status">
      <div class="win-h"><span>Work position</span><small id="posSub"></small></div>
      <div class="pos-grid" id="axes"></div>
      <div class="modal" id="pMod"><i>G modals:</i> —</div>
      <div class="scene"><span class="cap" id="cap"></span><canvas id="cv" height="220" aria-label="Drawing of the operation toolpath and tool position"></canvas></div>
    </section>
  </main>

  <nav class="vkeys" id="vkeys" aria-label="Vertical softkeys"></nav>
  <nav class="hkeys" id="hkeys" aria-label="Horizontal softkeys"></nav>
</div>

<script>

const D = {"key":"perno-tornio","board":"board-pin-lathe.html","axes":["X","Z","C","S SPINDLE","LIVE TOOL","F","T","SPINDLE","COOLANT"],"posSub":"X in diameter · mm","zLabel":"Z","info":{"pct":{"que":"Start or end-of-file marker.","pq":["The control only reads what is between the two % signs."]},"l3":{"params":[["G0","Rapid."],["G18","XZ plane, the lathe plane."],["G21","Millimetres."],["G40","No tool nose radius compensation."],["G54","Work zero."],["G80","No canned cycle."],["G99","Feed in mm/rev."],["M110","Machine function (see below)."]],"que":"Safety line: puts the machine in a known state before moving any axis.","pq":["G99 is the normal lathe mode: feed is in millimetres per spindle revolution, so the chip thickness stays the same even when the speed changes.","Machine-specific code of this lathe (not a standard Fanuc code): its function is in the machine's M-code table. M110 appears at the start and end of every turning op: it probably disables a mode (C axis or spindle positioning)."]},"m24":{"que":"Machine M code at program start (M24; M25 at the end).","pq":["Machine-specific code of this lathe (not a standard Fanuc code): its function is in the machine's M-code table."]},"sub":{"que":"Rapid in machine coordinates (G53): the sub-spindle (B axis) returns to its home position.","pq":["On a lathe with a sub-spindle, B is the axis that moves it. It must be moved away before the turret moves, to avoid hitting it.","The post does this at the start of every operation."]},"g28uv":{"que":"Return to machine reference in X and Y (U and V = incremental moves, zero = directly).","pq":["On a lathe U, V and W are the incremental versions of X, Y and Z. G28 U0. V0. means “go to reference in X and Y with no intermediate point”.","X first (the turret moves away from the part axis), then Z on the next line: always retract in X first."]},"g28w":{"que":"Return to machine reference in Z.","pq":["The turret backs off in Z, away from the part, after already retracting in X."]},"m90":{"que":"M90: releases the C-axis brake (inferred: used before moving C or spinning the spindle).","pq":["Machine-specific code of this lathe (not a standard Fanuc code): its function is in the machine's M-code table."]},"m89":{"que":"M89: clamps the C-axis brake (inferred).","pq":["Machine-specific code of this lathe (not a standard Fanuc code): its function is in the machine's M-code table."]},"g54":{"que":"Activates G54 work zero: Z0 on the part face, X0 on the axis.","pq":["On a lathe X0 is always the rotation axis: X values are diameters."]},"turnmode":{"que":"Feed mm/rev, XZ plane and M34: turning mode (inferred: the spindle runs as a spindle, not as a C axis).","pq":["Machine-specific code of this lathe (not a standard Fanuc code): its function is in the machine's M-code table.","For live-tool milling the post writes G98 G18 M35 instead: mm/min and spindle as C axis."]},"millmode":{"que":"Feed mm/min (G98), XZ plane and M35: C-axis mode (inferred) for live-tool milling.","pq":["The part no longer spins: the spindle positions it as a rotary axis (C).","Feed switches to mm/min because the reference is now the rotating tool, not the part.","Machine-specific code of this lathe (not a standard Fanuc code): its function is in the machine's M-code table."]},"m8":{"que":"Turns coolant on.","pq":["Cools the insert and flushes chips out of the cutting zone."]},"g96":{"que":"Constant surface speed: 107 m/min. From here rpm changes by itself with the diameter.","pq":["The insert always cuts at the same surface speed: even wear and the same finish from edge to centre."]},"m1":{"que":"Optional stop.","pq":["With Optional Stop on the machine stops: time to measure the diameters before milling."]},"m5p11":{"que":"Stops the main spindle (P11).","pq":["To mill with the live tool the part must be still: the spindle becomes a C axis."]},"g28h":{"que":"C axis return to zero (H = incremental C).","pq":["The spindle orients to its reference: from here C values are absolute."]},"g121":{"que":"Activates polar interpolation (G12.1).","pq":["The control turns part rotation (C) and radial motion (X) into a Cartesian plane: you program it like a mill, with X and C as if they were X and Y.","In this mode X is still in diameter and C is in millimetres on the face."]},"g131":{"que":"Cancels polar interpolation.","pq":["Back to normal lathe coordinates before moving the turret away."]},"m5p12":{"que":"Stops the live tool.","pq":["Before returning to reference."]},"m25":{"que":"Machine M code at the end of the program (M24 was at the start).","pq":["Machine-specific code of this lathe (not a standard Fanuc code): its function is in the machine's M-code table."]},"m111":{"que":"Machine M code before the end (paired with M110).","pq":["Machine-specific code of this lathe (not a standard Fanuc code): its function is in the machine's M-code table."]},"m30":{"que":"End of program and rewind.","pq":["Stops spindle, live tool and coolant."]},"g97back":{"que":"Back to fixed rpm before changing operation.","pq":["That way, during rapids or if the program stops here, rpm doesn't change with every X move."]},"oname":{"que":"Program number: O2222.","pq":["The Siemens version of the same part is a named file (TORNO_SIEMENS_ADAPTATIVO.MPF) instead of a number."]},"g50":{"que":"Limits the spindle to 5,000 rpm.","pq":["With G96 rpm grows towards the centre: n = 1000·107 / (π·D). Below Ø6.8 the limit kicks in.","On a Ø40 bar the 5,000 limit is reasonable, but compare it with the chuck's."]},"t0202":{"que":"Turret to tool 2, offset 2: external tool.","pq":["Does the facing and profile roughing."]},"s566":{"que":"Main spindle at a fixed 566 rpm (P11) for the approach.","pq":["566 rpm is what G96 S107 gives at about Ø60, the starting diameter."]},"fastf":{"que":"Rapid approach to Ø50, Z-0.5, just outside the Ø40 bar.","pq":["The tool reaches the start of the first facing pass in rapid; from here every move cuts at 0.127 mm/rev."]},"x40":{"que":"Cutting feed 0.127 mm/rev, down to Ø40 (edge of the stock).","pq":["From here the facing cuts."]},"facecut":{"que":"Facing to X-1.587, past centre.","pq":["The first level removes 0.5 mm (Z-0.5), the other two 3 mm (Z-3.5 and Z-6.5): the finished face is at Z-6.5."]},"facestep":{"que":"Rapid to the next facing level, 3 mm further in.","pq":["Z zero is on the stock face: the finished part starts at Z-6.5."]},"t0801":{"que":"Turret to tool 8: Ø3 axial live drill.","pq":["Drills the three holes parallel to the Z axis at radius 12.5, with the spindle held as a C axis.","Ø3 at radius 12.5 leaves a 1.1 mm wall to the Ø30.2 diameter."]},"c150":{"que":"Rapid above the first hole: X25 (radius 12.5) and C-150°.","pq":["The holes are off centre: the C axis turns the part to the right angle, X gives the distance from the axis.","On Siemens the same position is X12.5 (radius, DIAMOF) and SP1=210 (= -150°)."]},"rough":{"que":"First roughing pass: Ø36.733 to Z-33.363.","pq":["Three passes (Ø36.7, Ø33.5, Ø30.2) of about 1.6 mm per side."]},"r30":{"que":"Last pass: Ø30.2 to Z-33.363, the pin diameter.","pq":["At 0.127 mm/rev and 107 m/min this pass leaves the final surface: the turned diameter is finished here."]},"frontr":{"que":"Fillet on the pin's leading edge.","pq":["Removes the sharp edge on the face: from Ø29.4 to Ø30.2 with a small arc."]},"t0901":{"que":"Turret to tool 9: Ø6 live drill for the centre hole.","pq":["Hole on the axis (X0): the entry hole for the pocket end mill."]},"c0clamp":{"que":"Unclamps C, moves C to 0°, clamps C.","pq":["For drilling on the axis the angle doesn't matter, but the part must be still: the brake holds it."]},"g83":{"params":[["G83","Peck deep drilling."],["Z-12.5","Hole bottom: 6 mm below the face."],["R-9.5","Incremental from the initial point (Z5): the R point is at Z-4.5."],["Q2250","2.25 mm pecks (in microns)."],["F130.","130 mm/min (G98) = 0.1 mm/rev at 1,300 rpm."]],"que":"Centre drilling cycle down to Z-12.5.","pq":["The centre hole is the entry for the pocket end mill: it goes down without plunging into solid material."]},"m138":{"que":"M138 before the high-speed live tool (M139 at the end).","pq":["Machine-specific code of this lathe (not a standard Fanuc code): its function is in the machine's M-code table."]},"polar1":{"que":"First move in polar interpolation, at 3,000 mm/min.","pq":["G0 isn't allowed in G12.1: positioning moves are written as G1 at 3,000 mm/min, and each cutting move states its own feed again."]},"s_head":{"que":"Header: program name for the Siemens control (_N_…_MPF = main program).","pq":["On Siemens programs have a name, not a number. MPF = Main Program File."]},"s_wp":{"params":[["\"CYLINDER\"","Cylindrical stock."],["192","Definition type code (from the post)."],["0 / -40","From Z0 to Z-40: 40 mm long."],["-39","Part-off / part position (from the post)."],["40","Diameter: Ø40."]],"que":"Defines the stock for the control's simulation: a Ø40 cylinder 40 mm long.","pq":["The Siemens control can simulate the program before running it: WORKPIECE tells it what the stock looks like."]},"s_n11":{"que":"Feed mm/min (G94) and XZ plane (G18) as the initial state.","pq":["Then each operation sets its own mode (G95 for turning)."]},"s_g71":{"que":"G71 on Siemens = metric units (millimetres).","pq":["Careful: on a Fanuc lathe G71 is the roughing cycle, on Okuma the threading cycle (see the M20 thread folder). On Siemens it just means “millimetres”, like G21 on Fanuc."]},"s_lims":{"que":"General speed limit: 6,000 (LIMS).","pq":["It's the Siemens equivalent of Fanuc's G50 S."]},"s_lims1":{"que":"Spindle 1 speed limit: 5,000.","pq":["Like G50 S5000 in the Fanuc version. [1] = main spindle."]},"s_g53x":{"que":"Rapid in machine coordinates to X250, with the offset off (D0).","pq":["Like Fanuc's G28 U0: the turret retracts in X away from the part. D0 keeps the offset from shifting the position."]},"s_g53yz":{"que":"Machine coordinates: Y0 and then Z300.","pq":["X first, then Y to centre, then Z back: always retract in X first."]},"s_msg":{"que":"MSG: shows the operation name on the control screen.","pq":["It's the equivalent of Fanuc's (NAME) comment, but the operator sees it in the message line while running."]},"s_tool":{"que":"Calls the tool and its cutting edge D1.","pq":["On Siemens T is the tool and D is the offset (cutting edge). The change happens with M6 on the next line."]},"s_m6":{"que":"Performs the tool change.","pq":["In this post the change is separate from the T call."]},"s_diamon":{"que":"DIAMON: X in diameter.","pq":["For turning X is the diameter, as on the drawing."]},"s_diamof":{"que":"DIAMOF: X in radius.","pq":["For live tools the post switches to radius: X12.5 here is the same point as X25 in the Fanuc version."]},"s_setms1":{"que":"SETMS(1): the main spindle is the “master” spindle.","pq":["S, M3, G96, G95 refer to spindle 1 until changed."]},"s_setms2":{"que":"SETMS(2): spindle 2 (live tools) becomes the master.","pq":["From here S and M3/M5 without a number drive the live tool. It's the equivalent of P12 on Fanuc."]},"s_s1":{"que":"Spindle 1 at a fixed 566 rpm, clockwise (M1=3).","pq":["S1= and M1= refer to spindle 1. Don't confuse M1=3 (spindle 1 clockwise) with plain M1 (optional stop)."]},"s_n23":{"que":"XZ plane, absolute coordinates, feed mm/rev (G95).","pq":["G95 on Siemens = G99 on a Fanuc lathe: mm per rev."]},"s_d2":{"que":"Activates cutting edge D2 of tool T2.","pq":["T2 is called with D1 at the change and turns with D2: in the Fanuc version the same tool is T0202 (offset 2)."]},"s_n29":{"que":"Rapid to Z5 and Ø60 on the same line.","pq":["Diagonal move: fine, since there's nothing in front of the part."]},"s_g96":{"que":"Constant surface speed 107 m/min on spindle 1.","pq":["Same as the Fanuc version."]},"s_fast":{"que":"Rapid approach to Ø50, Z-0.5.","pq":["Same line as the Fanuc version."]},"s_dafter":{"que":"Re-activates the D offset after the machine-coordinate move.","pq":["The post puts it back after every G53 … D0."]},"s_m15":{"que":"Stops spindle 1 (M1=5).","pq":["End of turning: the next tool is a live tool."]},"s_sp1":{"que":"Hole position: X12.5 (radius), Y0, and spindle 1 positioned at 210° (SP1=210).","pq":["SP1 positions the spindle as an axis: 210° = -150°, the same angle as the Fanuc version."]},"s_m25stop":{"que":"Stops the live tool (M2=5).","pq":["M2=5 = spindle 2 stop. Don't confuse it with M2 (end of program)."]},"s_sp0":{"que":"Positions spindle 1 at 0°.","pq":["For the centre hole the angle doesn't matter, but the spindle must be stopped in position."]},"s_cycle83":{"params":[["5","RTP: retract plane Z5."],["-6.5","RFP: faced surface."],["2","SDIS: safety distance."],["-12.5","DP: final depth."],["-8.75","FDEP: first depth (2.25 mm)."],["0 (DAM)","No degression."],["1 (VARI)","Full retract every peck."],["2.25","Minimum peck."]],"que":"Centre drilling cycle down to Z-12.5.","pq":["Same as G83 in the Fanuc version: the entry hole for the pocket end mill."]},"s_s5000":{"que":"Live tool at 5,000 rpm for the adaptive roughing.","pq":["Same tool (T14) and speed as the Fanuc version."]},"s_transmit":{"que":"TRANSMIT(1): activates the transformation for milling on the face.","pq":["Like G12.1 on Fanuc: X and Y are Cartesian coordinates on the face, the control translates them into X and C moves.","Here X and Y are in radius (DIAMOF)."]},"s_helixcr":{"que":"Helical entry: 0.97 mm radius arcs (CR=) dropping about 0.05 mm each time.","pq":["On Siemens an arc can be written with its radius (CR=) instead of its centre (I, J).","Very tight helix: the cutter goes down almost vertically."]},"s_trafoof":{"que":"TRAFOOF: cancels the TRANSMIT transformation.","pq":["Like G13.1 on Fanuc. Right after it goes back to DIAMON."]},"faceret":{"que":"Lifts 1 mm off the face before going back out.","pq":["The insert leaves the surface it has just cut instead of dragging back across it: clean face and a rapid return."]},"roughin":{"que":"Rapid to Z-5.5, 1 mm in front of the faced surface (Z-6.5).","pq":["Every pass starts in air and enters the material in feed: the insert never moves in rapid along the finished face."]},"s2600":{"que":"Starts the live drill (P12) at 2,600 rpm.","pq":["Ø3 drill: Vc = π·3·2600/1000 ≈ 24.5 m/min, the right value for an HSS-Co drill in steel.","P12 = live-tool motor."]},"g83off":{"params":[["G83","Peck deep drilling with full retract."],["Z-32.5","Hole bottom: 26 mm below the face."],["R-9.5","Incremental from the initial point Z5: the R point is at Z-4.5, 2 mm above the face."],["Q1500","1.5 mm pecks (in microns), half the drill diameter."],["F130.","130 mm/min (G98) = 0.05 mm/rev at 2,600 rpm."]],"que":"First off-centre hole: G83 cycle down to Z-32.5.","pq":["A 26 mm hole with a Ø3 drill is almost 9 diameters deep: a full retract every 1.5 mm keeps the flutes clear.","The whole hole is one block: the control repeats the pecks by itself."]},"g83more":{"que":"Same G83 cycle on the next hole.","pq":["C is already in position and clamped: the cycle drills down to Z-32.5 and returns to Z5."]},"g80":{"que":"Cancels the drilling cycle.","pq":["Before turning C to the next hole: with the cycle still active, any move would drill again."]},"cnext":{"que":"C turns to the next hole, 120° further on.","pq":["Sequence for every hole: M90 releases the brake, C turns, M89 clamps it, G83 drills. The part stays still while the drill cuts."]},"s1300":{"que":"Live drill at 1,300 rpm.","pq":["Ø6 drill: Vc ≈ 24.5 m/min, the same cutting speed as the Ø3 drill."]},"t1414":{"que":"Turret to tool 14: live end mill for the pocket roughing.","pq":["Same tool number as the Siemens version (T14): one tool list for both machines."]},"s5000f":{"que":"Live tool at 5,000 rpm (P12).","pq":["Same speed as the Siemens version (S2=5000), within the live tool's range."]},"polarout":{"que":"Retract to Z15 at 3,000 mm/min, still in polar interpolation.","pq":["Then G13.1 cancels polar interpolation with the tool already clear of the part."]},"t1515":{"que":"Turret to tool 15: live end mill for the 3D pocket finishing.","pq":["Same tool and same toolpath as the Siemens version: both programs make the same pocket."]},"fin600":{"que":"First finishing move at 600 mm/min.","pq":["Finishing moves at 600 mm/min, ramps at 200 mm/min, linking moves at 1,500 mm/min.","At 5,000 rpm that is about 0.06 mm per tooth for a 2-flute end mill."]},"m139":{"que":"M139 after the high-speed live-tool work (M138 was at the start).","pq":["Machine-specific code of this lathe (not a standard Fanuc code): its function is in the machine's M-code table."]},"s_s2600":{"que":"Live tool (spindle 2) at 2,600 rpm for the Ø3 drill.","pq":["Same as the Fanuc version (S2600 P12)."]},"s_millmode":{"que":"Face plane (G17), absolute coordinates, feed in mm/min (G94).","pq":["Live-tool mode: the feed refers to the rotating tool, like G98 on Fanuc."]},"s_f130":{"que":"Drilling feed: 130 mm/min (G94).","pq":["CYCLE83 uses the active feed."]},"s_cyc83a":{"params":[["5","RTP: retract plane Z5."],["-6.5","RFP: reference plane = faced surface."],["2","SDIS: safety distance, drilling starts at Z-4.5."],["-32.5","DP: final depth."],["-8","FDEP: first depth (1.5 mm)."],["0 (DAM)","No degression: every peck is 1.5 mm."],["1 (VARI)","Chip removal: full retract every peck, like G83 on Fanuc."],["1.5","Minimum peck."]],"que":"Deep-drilling cycle at the current position: first off-centre hole.","pq":["Called without MCALL, the cycle runs once where the tool is. Then SP1= turns the part to the next hole and the cycle is called again.","Same pecks as the Fanuc version (Q1500)."]},"s_cyc83more":{"que":"Same CYCLE83 on the next hole.","pq":["The spindle is already at the new angle; the drill is at Z5, clear of the part."]},"s_spnext":{"que":"Positions spindle 1 at the next hole angle.","pq":["330° = -30° and 90°: the same angles as the Fanuc version. The drill waits at Z5, clear of the part."]},"s_s1300":{"que":"Live tool at 1,300 rpm for the Ø6 centre drill.","pq":["Same as the Fanuc version."]},"s_s5000fin":{"que":"Live tool at 5,000 rpm for the 3D finishing.","pq":["Same tool (T15) and speed as the Fanuc version."]},"s_finf600":{"que":"First finishing move at 600 mm/min.","pq":["Finishing 600 mm/min, ramps 200 mm/min, linking 1,500 mm/min: the same values as the Fanuc version."]}},"errors":[],"checks":[{"t":"Ø40 bar with at least 40 mm out of the jaws","pq":"WORKPIECE declares a Ø40 × 40 cylinder; the profile reaches Z-33.4.","prog":"s","lines":[2]},{"t":"Z zero on the stock face","pq":"Facing removes 6.5 mm: the finished face is at Z-6.5.","prog":"f","lines":[20]},{"t":"Tools loaded: T02, T08 Ø3, T09 Ø6, T14, T15","pq":"Same numbers on both controls (Fanuc T0202, T0801, T0901, T1414, T1515).","prog":"f","lines":[14,98,136,164,965]},{"t":"Siemens: cutting edge D2 set on T2","pq":"The turning operations use T2 D2.","prog":"s","lines":[19]},{"t":"Live tool up to 5,000 rpm","pq":"The pocket runs at 5,000 rpm on both controls.","prog":"f","lines":[166,967]},{"t":"Sub-spindle home and turret clear","pq":"The program sends the sub-spindle home in every operation.","prog":"f","lines":[7]},{"t":"First part: single block, feed override low","pq":"Watch the first approach of each tool; then run at 100 %.","prog":"f","lines":[21]}],"codes":[["G99 / G95","mm/rev (Fanuc / Siemens)","Same function, different code.","\\bG99\\b|\\bG95\\b"],["G98 / G94","mm/min (Fanuc / Siemens)","For live tools: F130 = 130 mm per minute.","\\bG98\\b|\\bG94\\b"],["G96 / G97","Constant Vc / fixed rpm","Identical on Fanuc and Siemens.","\\bG9[67]\\b"],["G50 S / LIMS","Speed limit (Fanuc / Siemens)","5,000 rpm in both.","G50 S|LIMS"],["G21 / G71","Millimetres (Fanuc / Siemens)","G71 on Siemens = mm; on Fanuc = roughing; on Okuma = threading.","G21|^N12 G71"],["G28 U V W / G53 … D0","Return to reference","Fanuc goes home with G28, Siemens goes to machine positions with G53.","G28 U|G53 X"],["G12.1 / TRANSMIT","Face milling","Polar interpolation: Fanuc with X in diameter, Siemens in radius.","G12\\.1|TRANSMIT"],["G13.1 / TRAFOOF","End of face milling","Back to normal lathe mode.","G13\\.1|TRAFOOF"],["G83 / CYCLE83","Deep drilling","The three off-centre holes and the centre hole.","G83|CYCLE83"],["P11 P12 / SETMS(n)","Spindle selection","Fanuc states it in every M3; Siemens changes the master.","P1[12]|SETMS"],["S1= M1=3 / S2= M2=3","Speed and direction of spindle 1 / 2","Siemens syntax for multiple spindles.","S[12]=|M[12]=[35]"],["C-150. / SP1=210.","Angular position","Same angle: -150° = 210°.","C-150|SP1=210"],["DIAMON / DIAMOF","X in diameter / radius","Siemens only: for live tools X is in radius.","DIAMO[NF]"],["MSG / (name)","Operation name","Siemens shows it on screen.","MSG|^N\\d\\("],["WORKPIECE","Stock for simulation","Siemens only: Ø40 × 40 cylinder.","WORKPIECE"],["CR=","Arc by radius","Siemens; Fanuc uses I and K (turning) or I and J (polar).","CR="],["M89 / M90","C brake on / off (inferred)","Fanuc: C is clamped before every hole.","M89|M90"],["M138 / M139","Machine function around high-speed live-tool milling","M138 before the pocket, M139 after it.","M13[89]"]],"tools":{"head":["Operation","Fanuc O2222","Siemens","Speed","F","Fanuc time","Siemens time"],"rows":[{"prog":"f","op":0,"cells":["Facing","T0202","T2 D2","G96 107 m/min","0.127 mm/rev","26 s","26 s"],"cls":[null,null,null,null,null,null,null]},{"prog":"f","op":1,"cells":["Profile turning","T0202","T2 D2","G96 107 m/min","0.127 mm/rev","49 s","49 s"],"cls":[null,null,null,null,null,null,null]},{"prog":"f","op":2,"cells":["Drill1 (3 holes Ø3)","T0801","T8","2,600 rpm","130 mm/min","39 s","39 s"],"cls":[null,null,null,null,null,null,null]},{"prog":"f","op":3,"cells":["Drill2 (centre Ø6)","T0901","T9","1,300 rpm","130 mm/min","4 s","4 s"],"cls":[null,null,null,null,null,null,null]},{"prog":"f","op":4,"cells":["Adaptive roughing","T1414","T14","5,000 rpm","333–1,000 mm/min","53 s","53 s"],"cls":[null,null,null,null,null,null,null]},{"prog":"f","op":5,"cells":["Pocket finishi function hl(line) {
  if (/^\s*(N\d+\s*)?\(.*\)\s*$/.test(line) || /^\s*;/.test(line)) return '<span class="t-c">' + esc(line) + "</span>";
  let s = esc(line);

  return s

    .replace(/\b(G\d+(?:\.\d)?)(?![^<]*<\/span>)/g, '<span class="t-g">$1</span>')

      sec("", "If it weren't done this way", d.sino) +
      (d.riesgo ? sec("risk " + (d.lvl === "err" ? "err" : ""), d.lvl === "err" ? "Error / risk" : "Risk", d.riesgo) : "") +
      ((d.opHead || d.gap) ? opCard(op) : "");
    const lv = d.lvl;
    setMsg(lv || "ok", lv && d.riesgo ? d.riesgo.replace(/<[^>]+>/g, "").split(". ")[0].replace(/\.+$/, "") + "." : (nTxt ? "Block at " + nTxt : "Blocks omitted") + " · " + phase + ". Use ↑ ↓ or the softkeys to step.");
    return;
  }
  if (S.mode === "errori") {
    $("infoTitle").textContent = "Errors found"; $("infoSub").textContent = D.errors.length + " found";
    box.innerHTML = '<p class="note">Tap an error to see the lines that cause it in the editor.</p>' + D.errors.map((e, k) =>
      '<button class="card ' + e.lvl + (k === S.errSel ? " on" : "") + '" data-err="' + k + '"><h4><span class="n">' + (k + 1) + "</span>" + e.t + "</h4>" +
      '<span class="lbl">Why</span><p>' + e.pq + '</p><span class="lbl">Fix</span><p>' + e.sol + "</p></button>").join("");
    const e = D.errors[S.errSel];
    setMsg(e.lvl, "Error " + (S.errSel + 1) + ": " + e.t.replace(/<[^>]+>/g, "") + ".");
    return;
  }
  if (S.mode === "collisioni") {
    $("infoTitle").textContent = "Checks before running";
    const done = D.checks.filter((c, k) => S.checks[k]).length;
    $("infoSub").textContent = done + " of " + D.checks.length + " done";
    box.innerHTML = '<p class="note">Tick each item once you\'ve checked it at the machine. Ticks are only saved in this browser.</p>' + D.checks.map((c, k) =>
      '<div class="check' + (S.checks[k] ? " done" : "") + '"><input type="checkbox" id="chk' + k + '" data-chk="' + k + '"' + (S.checks[k] ? " checked" : "") + '><label for="chk' + k + '">' + c.t + "</label><p>" + c.pq + "</p></div>").join("");
    setMsg(done === D.checks.length ? "ok" : "warn", done === D.checks.length ? "All checks done. First run: single block." : (D.checks.length - done) + " checks left before running.");
    return;
  }
  if (S.mode === "codici") {
    $("infoTitle").textContent = "Codes in this exercise"; $("infoSub").textContent = "tap a row to see it in the editor";
    box.innerHTML = '<div class="tbl-wrap"><table><tr><th>Code</th><th>Function</th><th>Why in this exercise</th></tr>' +
      D.codes.map((c, k) => '<tr class="click' + (k === S.codeSel ? " hit" : "") + '" data-code="' + k + '"><td><code>' + c[0] + "</code></td><td>" + c[1] + "</td><td>" + c[2] + "</td></tr>").join("") + "</table></div>";
    setMsg("ok", D.codes.length + " codes explained. The highlighted lines in the editor contain them.");
    return;
  }
  if (S.mode === "utensili") {
    $("infoTitle").textContent = "Tools and times"; $("infoSub").textContent = "tap a row to go to the operation";
    box.innerHTML = '<div class="tbl-wrap"><table><tr>' + D.tools.head.map(h => "<th>" + h + "</th>").join("") + "</tr>" +
      D.tools.rows.map((r, k) => '<tr class="click' + (k === S.toolSel ? " hit" : "") + '" data-tool="' + k + '">' + r.cells.map((c, j) => "<td" + (r.cls && r.cls[j] ? ' class="' + r.cls[j] + '"' : "") + ">" + c + "</td>").join("") + "</tr>").join("") +
      "</table></div>" + (D.tools.note ? '<p class="note">' + D.tools.note + "</p>" : "");
    setMsg(D.tools.lvl || "ok", D.tools.msg || "Times estimated from toolpath length and programmed feeds.");
    return;
  }
  if (S.mode === "confronto") {
    const c = D.compare;
    $("infoTitle").textContent = c.title; $("infoSub").textContent = c.sub;
    box.innerHTML = c.html;
    setMsg(c.lvl || "ok", c.msg);
  }
}
$("info").addEventListener("click", e => {
  const card = e.target.closest("[data-err]"); if (card) { selectError(+card.dataset.err); return; }
  const row = e.target.closest("[data-code]"); if (row) { selectCode(+row.dataset.code); return; }
  const tr = e.target.closest("[data-tool]"); if (tr) { selectTool(+tr.dataset.tool); return; }
  const j = e.target.closest("[data-jump]");
  if (j) { const [pid, n] = j.dataset.jump.split(":"); loadProg(P[pid]); setMode("ciclo", true); const k = idxOfFileLine(S.prog, +n); go(k < 0 ? 0 : k); }
});
$("info").addEventListener("change", e => {
  const k = e.target.dataset.chk; if (k == null) return;
  S.checks[+k] = e.target.checked; store.set("checks", S.checks);
  markRefs(D.checks[+k]); renderCode(); renderInfo();
});
function markRefs(ref) {
  if (ref.prog && P[ref.prog] && S.prog !== P[ref.prog]) loadProg(P[ref.prog]);
  S.marks = new Set((ref.lines || []).map(n => idxOfFileLine(S.prog, n)).filter(i => i >= 0));
}
function selectError(k) {
  S.errSel = k; markRefs(D.errors[k]);
  const first = [...S.marks][0]; S.cur = first != null ? first : -1;
  render();
}
function selectCode(k) {
  S.codeSel = k;
  const re = new RegExp(D.codes[k][3]);
  let p = S.prog;
  if (!p.lines.some(l => l[2] !== "gap" && re.test(l[1]))) { const o = D.progs.find(q => q.lines.some(l => l[2] !== "gap" && re.test(l[1]))); if (o) loadProg(o); }
  S.marks = new Set(S.prog.lines.map((l, i) => l[2] !== "gap" && re.test(l[1]) ? i : -1).filter(i => i >= 0));
  S.cur = -1; render();
}
function selectTool(k) {
  S.toolSel = k; const r = D.tools.rows[k];
  if (r.prog && P[r.prog]) loadProg(P[r.prog]);
  const op = S.prog.ops[r.op]; if (!op) { render(); return; }
  S.marks = new Set(); for (let i = 0; i < S.prog.lines.length; i++) if (S.prog.lineOp[i] === r.op) S.marks.add(i);
  S.cur = op.start; render();
}

/* ---------- softkey ---------- */
function hkeys() {
  const k = [["ciclo", "Work cycle", "block by block"], ["errori", "Errors", D.errors.length + " found"], ["collisioni", "Collisions", "before running"], ["codici", "Codes", "and why"], ["utensili", "Tools", "and times"]];
  if (!D.errors.length) k.splice(1, 1);
  if (D.compare) k.push(["confronto", D.compare.key, D.compare.keySub]);
  return k;
}
function vkeysFor(mode) {
  if (mode === "ciclo") {
    const v = [["◀ Block", () => step(-1)], ["Block ▶", () => step(1)], ["◀ Op.", () => jumpOp(-1)], ["Op. ▶", () => jumpOp(1)]];
    v.push([anim ? "■ Stop" : "▶ Simulate", () => (anim ? stopAnim() : startAnim()), "op. toolpath"]);
    if (D.progs.length > 1) D.progs.forEach(p => { if (p !== S.prog) v.push(["Open " + p.short, () => { loadProg(p); S.cur = firstLine(p); render(); }, p.shortSub]); });
    v.push(["Start", () => go(0)]);
    return v;
  }
  if (mode === "errori") return D.errors.slice(0, 8).map((e, k) => ["Error " + (k + 1), () => selectError(k), e.lvl === "err" ? "severe" : "warning"]);
  if (mode === "collisioni") return [["Clear ticks", () => { S.checks = []; store.set("checks", []); S.marks = new Set(); render(); }]];
  if (mode === "codici" || mode === "confronto" || mode === "utensili") return D.progs.map(p => ["View " + p.short, () => { loadProg(p); S.marks = new Set(); S.codeSel = -1; S.cur = firstLine(p); render(); }, p.shortSub]);
  return [];
}
function renderKeys() {
  const v = vkeysFor(S.mode);
  const vk = $("vkeys"); vk.innerHTML = "";
  for (let k = 0; k < 8; k++) {
    const b = document.createElement("button"); b.className = "sk";
    if (v[k]) {
      b.innerHTML = v[k][0] + (v[k][2] ? "<small>" + v[k][2] + "</small>" : "");
      b.onclick = v[k][1];
      if (S.mode === "errori" && k === S.errSel) b.classList.add("on");
      if (S.mode !== "ciclo" && S.mode !== "errori" && S.mode !== "collisioni" && D.progs[k] === S.prog && D.progs.length > 1) b.classList.add("on");
    } else { b.disabled = true; b.textContent = "·"; b.setAttribute("aria-hidden", "true"); }
    vk.appendChild(b);
  }
  const H = hkeys();
  const hk = $("hkeys"); hk.innerHTML = "";
  for (let k = 0; k < 8; k++) {
    if (k === 7) {
      const a = document.createElement("a"); a.className = "sk link";
      a.href = D.board;
      a.innerHTML = "◀ Board<small>exercise notes</small>";
      hk.appendChild(a); continue;
    }
    const b = document.createElement("button"); b.className = "sk";
    const h = H[k];
    if (h) {
      b.innerHTML = h[1] + "<small>" + h[2] + "</small>";
      if (h[0] === S.mode) { b.classList.add("on"); b.setAttribute("aria-pressed", "true"); }
      b.onclick = () => setMode(h[0]);
    } else { b.disabled = true; b.textContent = "·"; b.setAttribute("aria-hidden", "true"); }
    hk.appendChild(b);
  }
}
function loadProg(p) {
  S.prog = p;
  $("path").textContent = "/" + p.file;
  $("edName").textContent = p.ctrl;
}
function setMode(m, quiet) {
  stopAnim();
  S.mode = m; S.marks = new Set();
  if (m === "ciclo") { if (S.cur < 0) S.cur = firstLine(S.prog); }
  else if (m === "errori") { selectError(S.errSel); store.set("mode", m); return; }
  else { S.cur = -1; S.codeSel = -1; S.toolSel = -1; }
  store.set("mode", m);
  if (!quiet) render();
}

/* ---------- disegno ---------- */
const cv = $("cv"), ctx = cv.getContext("2d");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim = null, W = 300, H = 200;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function viewOf(op) { return op ? D.views[op.view] : null; }
function frame(v) {
  const w = cv.clientWidth || 300;
  const bw = v.b[2] - v.b[0], bh = v.b[3] - v.b[1];
  const padL = 34, padR = 40, padT = 22, padB = 22;
  const k = Math.min((w - padL - padR) / bw, 1.0 * (w * 0.62) / bh);
  W = w; H = Math.round(bh * k + padT + padB);
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ox = padL + ((w - padL - padR) - bw * k) / 2;
  return { k, sx: a => ox + (a - v.b[0]) * k, sy: b => H - padB - (b - v.b[1]) * k };
}
function drawPath(F, pts, style) {
  ctx.lineWidth = style.w || 1;
  let last = null;
  for (let j = 0; j < pts.length; j += 3) {
    const a = pts[j], b = pts[j + 1], r = pts[j + 2];
    if (last && (!style.rapids && r)) { last = [a, b]; continue; }
    if (last) {
      ctx.strokeStyle = r ? style.rc : style.c;
      ctx.setLineDash(r ? [4, 3] : []);
      ctx.beginPath(); ctx.moveTo(F.sx(last[0]), F.sy(last[1])); ctx.lineTo(F.sx(a), F.sy(b)); ctx.stroke();
    }
    last = [a, b];
  }
  ctx.setLineDash([]);
}
function drawBase(F, v, op) {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = css("--paper"); ctx.fillRect(0, 0, W, H);
  ctx.font = "11px " + css("--font-ui");
  (v.shapes || []).forEach(s => {
    ctx.fillStyle = s.fill || "transparent"; ctx.strokeStyle = s.stroke || "transparent"; ctx.lineWidth = 1;
    if (s.rect) { const [a, b, c, d] = s.rect; const x = F.sx(a), y = F.sy(d), w = F.sx(c) - x, h = F.sy(b) - y; if (s.fill) ctx.fillRect(x, y, w, h); if (s.stroke) ctx.strokeRect(x, y, w, h); }
    if (s.poly) { ctx.beginPath(); s.poly.forEach((p, k) => k ? ctx.lineTo(F.sx(p[0]), F.sy(p[1])) : ctx.moveTo(F.sx(p[0]), F.sy(p[1]))); ctx.closePath(); if (s.fill) ctx.fill(); if (s.stroke) ctx.stroke(); }
    if (s.circle) { const [a, b, r] = s.circle; ctx.beginPath(); ctx.arc(F.sx(a), F.sy(b), r * F.k, 0, 7); if (s.fill) ctx.fill(); if (s.stroke) ctx.stroke(); }
    if (s.text) { ctx.fillStyle = s.color || css("--muted"); ctx.fillText(s.text, F.sx(s.at[0]), F.sy(s.at[1])); }
    if (s.dash) { ctx.strokeStyle = s.color || css("--err"); ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(F.sx(s.dash[0]), F.sy(s.dash[1])); ctx.lineTo(F.sx(s.dash[2]), F.sy(s.dash[3])); ctx.stroke(); ctx.setLineDash([]); }
  });
  if (v.ghost) drawPath(F, v.ghost, { c: "rgba(90,102,112,.16)", rc: "rgba(0,0,0,0)", w: 1 });
  // assi
  ctx.strokeStyle = css("--muted"); ctx.lineWidth = 1; ctx.setLineDash([6, 3, 2, 3]);
  if (v.b[1] < 0 && v.b[3] > 0) { ctx.beginPath(); ctx.moveTo(F.sx(v.b[0]), F.sy(0)); ctx.lineTo(F.sx(v.b[2]), F.sy(0)); ctx.stroke(); }
  if (v.b[0] < 0 && v.b[2] > 0 && v.cross) { ctx.beginPath(); ctx.moveTo(F.sx(0), F.sy(v.b[1])); ctx.lineTo(F.sx(0), F.sy(v.b[3])); ctx.stroke(); }
  ctx.setLineDash([]);
  ctx.fillStyle = css("--muted");
  ctx.fillText(v.ax[0] + " →", W - 40, H - 6);
  ctx.save(); ctx.translate(12, 40); ctx.rotate(-Math.PI / 2); ctx.fillText("← " + v.ax[1], -10, 0); ctx.restore();
  if (op) drawPath(F, op.pts, { c: "rgba(10,106,140,.55)", rc: "rgba(10,106,140,.25)", w: 1.2, rapids: true });
}
function zGauge(z, op) {
  if (!op || z == null || !op.z) return;
  const [z0, z1] = op.z; if (z1 - z0 < 0.01) return;
  const x = W - 22, y0 = 26, y1 = H - 26;
  const y = zz => y1 - (Math.max(z0, Math.min(z1, zz)) - z0) / (z1 - z0) * (y1 - y0);
  ctx.strokeStyle = css("--rule"); ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
  ctx.fillStyle = css("--muted"); ctx.font = "10px " + css("--font-ui");
  ctx.fillText(D.zLabel || "Z", x - 3, y0 - 12); ctx.fillText(nf(z1, 1), x - 18, y0 - 3); ctx.fillText(nf(z0, 1), x - 18, y1 + 12);
  ctx.fillStyle = css("--cursor"); ctx.strokeStyle = "#5c4100"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(x - 7, y(z) - 3, 14, 6); ctx.fill(); ctx.stroke();
}
function drawTool(F, a, b, label) {
  if (a == null || b == null) return;
  const x = F.sx(a), y = F.sy(b);
  const inside = x > 0 && x < W && y > 0 && y < H;
  const cx = Math.max(10, Math.min(W - 30, x)), cy = Math.max(14, Math.min(H - 8, y));
  ctx.fillStyle = css("--cursor"); ctx.strokeStyle = "#5c4100"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 9, cy); ctx.lineTo(cx + 9, cy); ctx.moveTo(cx, cy - 9); ctx.lineTo(cx, cy + 9); ctx.stroke();
  if (!inside || label) {
    ctx.fillStyle = css("--ink"); ctx.font = "600 11px " + css("--font-ui");
    const t = label || "out of view ↗";
    ctx.fillText(t, Math.min(cx + 10, W - ctx.measureText(t).width - 4), Math.max(cy - 8, 12));
  }
}
function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
function curOp() {
  let i = S.cur; if (i < 0) { const m = [...S.marks][0]; i = m == null ? -1 : m; }
  const oi = i >= 0 ? opOf(i) : null;
  return oi != null && oi >= 0 ? S.prog.ops[oi] : null;
}
function drawScene() {
  if (anim) return;
  const op = curOp();
  const v = viewOf(op) || D.views[D.progs[0].ops[0].view];
  const F = frame(v);
  drawBase(F, v, op);
  $("cap").textContent = (op ? op.name + " · " : "") + v.cap;
  const t = S.cur >= 0 ? S.prog.tp[S.cur] : null;
  if (t && t[0] != null) {
    if (t[3] != null) {
      ctx.strokeStyle = css("--cursor"); ctx.lineWidth = 2.5; ctx.setLineDash(t[5] ? [5, 4] : []);
      ctx.beginPath(); ctx.moveTo(F.sx(t[3]), F.sy(t[4])); ctx.lineTo(F.sx(t[0]), F.sy(t[1])); ctx.stroke(); ctx.setLineDash([]);
    }
    drawTool(F, t[0], t[1], null);
    zGauge(t[2], op);
  } else if (S.cur >= 0) {
    ctx.fillStyle = css("--muted"); ctx.font = "12px " + css("--font-ui");
    ctx.fillText("Tool position not defined yet", 40, 40);
  }
}
function startAnim() {
  const op = curOp(); if (!op || op.pts.length < 6) return;
  const v = viewOf(op);
  const pts = op.pts, n = pts.length / 3;
  const dur = Math.min(14000, Math.max(4000, n * 6));
  if (reduce) { stopAnim(); return; }
  let t0 = null;
  const F = frame(v);
  const tick = ts => {
    if (t0 == null) t0 = ts;
    const f = ((ts - t0) % dur) / dur, j = Math.floor(f * (n - 1)) * 3;
    drawBase(F, v, op);
    ctx.strokeStyle = css("--cursor"); ctx.lineWidth = 2;
    ctx.beginPath(); for (let q = Math.max(0, j - 90); q <= j; q += 3) { if (q === Math.max(0, j - 90)) ctx.moveTo(F.sx(pts[q]), F.sy(pts[q + 1])); else ctx.lineTo(F.sx(pts[q]), F.sy(pts[q + 1])); } ctx.stroke();
    drawTool(F, pts[j], pts[j + 1], "simulation " + Math.round(f * 100) + " %");
    anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
  renderKeys();
}

/* ---------- render ---------- */
function render() { renderKeys(); renderCode(); renderPos(); renderInfo(); drawScene(); }
if (window.ResizeObserver) new ResizeObserver(() => { if (!anim) drawScene(); }).observe(cv);
else window.addEventListener("resize", drawScene);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (S.mode !== "ciclo") return;
  if (e.key === "PageDown") { e.preventDefault(); step(1); }
  if (e.key === "PageUp") { e.preventDefault(); step(-1); }
});

renderAxes();
loadProg(S.prog);
const start = store.get("mode", "ciclo");
if (hkeys().some(h => h[0] === start) && start !== "ciclo") setMode(start); else render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!anim) drawScene(); });
})();
</script>
