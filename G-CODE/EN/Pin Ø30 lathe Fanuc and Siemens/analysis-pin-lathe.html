<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pin lathe analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: pannello di controllo CNC — barra di stato, riga messaggi, finestre (editor / spiegazione / posizione), softkey verticali a destra e orizzontali in basso. Un unico aspetto chiaro industriale, di proposito. */
:root {
  --frame: #b9c1c8;
  --win: #eef1f3;
  --paper: #ffffff;
  --ink: #1b232a;
  --muted: #5a6670;
  --rule: #98a3ad;
  --head: #34495a;
  --head-ink: #f4f7f9;
  --accent: #0a6a8c;
  --cursor: #f3a712;
  --cursor-ink: #1b1400;
  --key-top: #fbfcfc;
  --key-bot: #c8cfd5;
  --key-on: #ffd27a;
  --ok: #2c7a3a;
  --warn: #b76a00;
  --warn-bg: #fff1d6;
  --err: #c0262d;
  --err-bg: #fde3e3;
  --steel: #c4ccd3;
  --steel-dark: #7d8a95;
  --code-g: #0a5d9e;
  --code-m: #7a3a9a;
  --code-c: #2f7d4a;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--frame);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  padding-inline: 16px;
  padding-block: 16px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.hmi {
  max-width: 1480px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 128px;
  grid-template-areas: "bar bar" "msg msg" "work vkeys" "hkeys hkeys";
  gap: 4px;
  background: #8d979f;
  padding: 4px;
  border: 1px solid #6f7a83;
}

/* barra superiore */
.bar { grid-area: bar; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px; }
.bar > div { background: var(--head); color: var(--head-ink); padding: 6px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.area { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.path { font-family: var(--font-code); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chan { font-weight: 600; letter-spacing: .04em; }
.chan .led { width: 10px; height: 10px; border-radius: 50%; background: #58c26a; box-shadow: 0 0 0 2px #2a3a47; }

/* riga messaggi */
.msg { grid-area: msg; background: var(--paper); border: 1px solid var(--rule); padding: 5px 10px; display: flex; gap: 10px; align-items: baseline; min-height: 34px; font-weight: 500; }
.msg .tag { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 12px; padding: 1px 6px; border-radius: 2px; flex: none; }
.msg.ok .tag { background: #dcefdf; color: var(--ok); }
.msg.warn { background: var(--warn-bg); }
.msg.warn .tag { background: var(--warn); color: #fff; }
.msg.err { background: var(--err-bg); }
.msg.err .tag { background: var(--err); color: #fff; }

/* zona finestre */
.work { grid-area: work; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); grid-template-areas: "editor info" "pos info"; gap: 4px; min-width: 0; }
.win { background: var(--win); border: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; }
.win-h { background: linear-gradient(#4a6274, var(--head)); color: var(--head-ink); padding: 4px 10px; font-weight: 600; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.win-h small { font-weight: 400; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editor { grid-area: editor; }
.info { grid-area: info; }
.pos { grid-area: pos; }

/* editor */
.code { font-family: var(--font-code); font-size: 13.5px; background: var(--paper); margin: 6px; border: 1px solid var(--rule); overflow: auto; max-height: 340px; flex: 1; }
.ln { display: grid; grid-template-columns: 4.2em 1.2em minmax(0, 1fr); align-items: baseline; padding: 1px 6px 1px 0; cursor: pointer; white-space: pre; border-left: 4px solid transparent; }
.ln:hover { background: #eaf3f7; }
.ln .no { color: var(--muted); text-align: right; padding-right: 8px; font-size: 11.5px; user-select: none; }
.ln .flag { font-size: 11px; font-weight: 700; }
.ln.warn .flag { color: var(--warn); }
.ln.err .flag { color: var(--err); }
.ln.mark { background: #e3f0f6; border-left-color: var(--accent); }
.ln.cur { background: var(--cursor); color: var(--cursor-ink); border-left-color: #a46c00; }
.ln.cur .no, .ln.cur .t-n, .ln.cur .t-g, .ln.cur .t-m, .ln.cur .t-c { color: var(--cursor-ink); }
.ln.blank { cursor: default; }
.ln.gap { color: var(--muted); font-style: italic; background: repeating-linear-gradient(135deg, #f4f6f7 0 6px, #eceff1 6px 12px); }
.ln.gap.cur { background: var(--cursor); }
.t-n { color: var(--muted); }
.t-g { color: var(--code-g); font-weight: 600; }
.t-m { color: var(--code-m); font-weight: 600; }
.t-c { color: var(--code-c); font-style: italic; }

/* posizione */
.pos-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 6px 6px 0; }
.axis { background: var(--paper); border: 1px solid var(--rule); padding: 3px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; min-width: 0; }
.axis b { font-size: 12px; color: var(--muted); letter-spacing: .05em; }
.axis span { font-family: var(--font-code); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal { margin: 4px 6px 0; background: var(--paper); border: 1px solid var(--rule); padding: 4px 8px; font-family: var(--font-code); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.modal i { font-style: normal; color: var(--muted); font-family: var(--font-ui); font-size: 12px; }
.scene { margin: 6px; background: var(--paper); border: 1px solid var(--rule); position: relative; }
.scene canvas { display: block; width: 100%; }
.scene .cap { position: absolute; left: 8px; top: 4px; font-size: 12px; color: var(--muted); pointer-events: none; }

/* spiegazione */
.info-body { padding: 10px 14px 14px; overflow: auto; max-height: 720px; display: grid; gap: 12px; align-content: start; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--head-ink); background: var(--accent); padding: 2px 8px; border-radius: 2px; justify-self: start; }
.blk { font-family: var(--font-code); font-size: 15px; background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--cursor); padding: 6px 10px; overflow-x: auto; white-space: pre; }
.sec { display: grid; gap: 4px; }
.sec h3 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sec h3::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.sec p { margin: 0; max-width: 68ch; }
.sec ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 70ch; }
.sec.why h3 { color: var(--accent); }
.sec.why { background: var(--paper); border: 1px solid #bcd6e1; padding: 8px 12px 10px; }
.sec.risk { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 6px 10px; }
.sec.risk.err { border-left-color: var(--err); background: var(--err-bg); }
.sec.risk h3 { color: var(--warn); }
.sec.risk.err h3 { color: var(--err); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--paper); }
th, td { border: 1px solid #c3cbd2; padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: #dfe5ea; font-weight: 600; font-size: 13px; }
td.num, th.num { text-align: right; font-family: var(--font-code); font-variant-numeric: tabular-nums; white-space: nowrap; }
td code, p code, li code { font-family: var(--font-code); font-size: .92em; background: #e8edf1; padding: 0 3px; border-radius: 2px; }
tr.hit td { background: #fff3d1; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #eaf3f7; }
td.bad { color: var(--err); font-weight: 600; }
td.meh { color: var(--warn); font-weight: 600; }

.card { background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--warn); padding: 8px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; }
.card.err { border-left-color: var(--err); }
.card.on { box-shadow: 0 0 0 2px var(--cursor); }
.card h4 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.card h4 .n { font-family: var(--font-code); font-size: 12px; color: var(--muted); }
.card .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; max-width: 70ch; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; background: var(--paper); border: 1px solid var(--rule); padding: 8px 12px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.check label { font-weight: 600; cursor: pointer; }
.check p { grid-column: 2; margin: 0; color: var(--muted); }
.check.done label { text-decoration: line-through; color: var(--ok); }
.note { font-size: 13.5px; color: var(--muted); max-width: 72ch; margin: 0; }

/* softkey */
.vkeys { grid-area: vkeys; display: grid; grid-auto-rows: minmax(54px, auto); gap: 4px; align-content: start; }
.hkeys { grid-area: hkeys; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.sk { background: linear-gradient(var(--key-top), var(--key-bot)); border: 1px solid #77838d; border-radius: 3px; box-shadow: inset 0 1px 0 #fff, 0 1px 0 #6d7881; padding: 6px 8px; min-height: 48px; font-weight: 600; line-height: 1.15; text-align: center; cursor: pointer; }
.sk:hover:not(:disabled) { background: linear-gradient(#ffffff, #d7dde2); }
.sk:active:not(:disabled) { box-shadow: inset 0 2px 3px rgba(0,0,0,.25); }
.sk.on { background: linear-gradient(#fff3d6, var(--key-on)); border-color: #a46c00; }
.sk:disabled { cursor: default; color: transparent; background: linear-gradient(#e3e7ea, #cdd3d8); box-shadow: none; }
a.sk { text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: center; }
.sk small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }

@media (max-width: 1100px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-areas: "editor" "info" "pos"; }
  .code { max-height: 260px; }
  .info-body { max-height: none; }
}
@media (max-width: 760px) {
  body { padding-inline: 8px; }
  .hmi { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "msg" "vkeys" "work" "hkeys"; }
  .bar { grid-template-columns: minmax(0, 1fr) auto; }
  .bar .path-box { grid-column: 1 / -1; order: 3; }
  .vkeys { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: auto; }
  .hkeys { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sk:disabled { display: none; }
  .sk { min-height: 42px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="hmi" id="hmi">
  <header class="bar">
    <div class="area">Program</div>
    <div class="path-box"><span class="path" id="path"></span></div>
    <div class="chan"><span class="led" aria-hidden="true"></span>CHANNEL 1 · RESET</div>
  </header>

  <div class="msg ok" id="msg" role="status"><span class="tag">Info</span><span id="msgText"></span></div>

  <main class="work">
    <section class="win editor" aria-label="Program editor">
      <div class="win-h"><span>Editor</span><small id="edName"></small></div>
      <div class="code" id="code" tabindex="0" aria-label="Program lines. Use the arrow keys to move."></div>
    </section>

    <section class="win info" aria-live="polite">
      <div class="win-h"><span id="infoTitle">Explanation</span><small id="infoSub"></small></div>
      <div class="info-body" id="info"></div>
    </section>

    <section class="win pos" aria-label="Position and status">
      <div class="win-h"><span>Work position</span><small id="posSub"></small></div>
      <div class="pos-grid" id="axes"></div>
      <div class="modal" id="pMod"><i>G modals:</i> —</div>
      <div class="scene"><span class="cap" id="cap"></span><canvas id="cv" height="220" aria-label="Drawing of the operation toolpath and tool position"></canvas></div>
    </section>
  </main>

  <nav class="vkeys" id="vkeys" aria-label="Vertical softkeys"></nav>
  <nav class="hkeys" id="hkeys" aria-label="Horizontal softkeys"></nav>
</div>

"]},"m90":{"que":"M90: releases the C-axis brake (inferred: used before moving C or spinning the spindle).","pq":["Machine-specific code: the meaning here is inferred from how the program uses it. Confirm it in the lathe manual."]},"m89":{"que":"M89: clamps the C-axis brake (inferred).","pq":["Machine-specific code: the meaning here is inferred from how the program uses it. Confirm it in the lathe manual."]},"g54":{"que":"Activates G54 work zero: Z0 on the part face, X0 on the axis.","pq":["On a lathe X0 is always the rotation axis: X values are diameters."]},"turnmode":{"que":"Feed mm/rev, XZ plane and M34: turning mode (inferred: the spindle runs as a spindle, not as a C axis).","pq":["Machine-specific code: the meaning here is inferred from how the program uses it. Confirm it in the lathe manual.","For live-tool milling the post writes G98 G18 M35 instead: mm/min and spindle as C axis."]},"millmode":{"que":"Feed mm/min (G98), XZ plane and M35: C-axis mode (inferred) for live-tool milling.","pq":["The part no longer spins: the spindle positions it as a rotary axis (C).","Feed switches to mm/min because the reference is now the rotating tool, not the part.","Machine-specific code: the meaning here is inferred from how the program uses it. Confirm it in the lathe manual."]},"m8":{"que":"Turns coolant on.","pq":["Cools the insert and flushes chips out of the cutting zone."]},"g96":{"que":"Constant surface speed: 107 m/min. From here rpm changes by itself with the diameter.","pq":["The insert always cuts at the same surface speed: even wear and the same finish from edge to centre."]},"m1":{"que":"Optional stop.","pq":["With Optional Stop on the machine stops: time to measure the diameters before milling."]},"m5p11":{"que":"Stops the main spindle (P11).","pq":["To mill with the live tool the part must be still: the spindle becomes a C axis."]},"g28h":{"que":"C axis return to zero (H = incremental C).","pq":["The spindle orients to its reference: from here C values are absolute."]},"g121":{"que":"Activates polar interpolation (G12.1).","pq":["The control turns part rotation (C) and radial motion (X) into a Cartesian plane: you program it like a mill, with X and C as if they were X and Y.","In this mode X is still in diameter and C is in millimetres on the face."]},"g131":{"que":"Cancels polar interpolation.","pq":["Back to normal lathe coordinates before moving the turret away."]},"m5p12":{"que":"Stops the live tool.","pq":["Before returning to reference."]},"m25":{"que":"Machine M code at the end of the program (M24 was at the start).","pq":["Machine-specific code: the meaning here is inferred from how the program uses it. Confirm it in the lathe manual."]},"m111":{"que":"Machine M code before the end (paired with M110).","pq":["Machine-specific code: the meaning here is inferred from how the program uses it. Confirm it in the lathe manual."]},"m30":{"que":"End of program and rewind.","pq":["Stops spindle, live tool and coolant."]},"g97back":{"que":"Back to fixed rpm before changing operation.","pq":["That way, during rapids or if the program stops here, rpm doesn't change with every X move."]},"oname":{"que":"Program number: O2222.","pq":["The Siemens version of the same part is a named file (TORNO_SIEMENS_ADAPTATIVO.MPF) instead of a number."]},"g50":{"que":"Limits the spindle to 5,000 rpm.","pq":["With G96 rpm grows towards the centre: n = 1000·107 / (π·D). Below Ø6.8 the limit kicks in.","On a Ø40 bar the 5,000 limit is reasonable, but compare it with the chuck's."]},"t0202":{"que":"Turret to tool 2, offset 2: external tool.","pq":["Does the facing and profile roughing."]},"s566":{"que":"Main spindle at a fixed 566 rpm (P11) for the approach.","pq":["566 rpm is what G96 S107 gives at about Ø60, the starting diameter."]},"fastf":{"lvl":"warn","que":"G1 approach at 17.669 mm/rev to Ø50, Z-0.5.","pq":["It's Fusion's high feed converted to mm/rev: at about 680 rpm that's 12 m/min.","In the Siemens version the same line has F7.362 ith a small arc."]},"t0901":{"que":"Turret to tool 9: live drill for the centre hole.","pq":["Hole on the axis (X0) with the spindle stopped."]},"s40":{"lvl":"warn","que":"Live drill at 40 rpm.","pq":["Same problem as Drill1."],"riesgo":"40 rpm: the drill doesn't cut. A hole on the axis is better done with the main spindle turning and the drill stationary."},"c0clamp":{"que":"Unclamps C, moves C to 0°, clamps C.","pq":["For drilling on the axis the angle doesn't matter, but the part must be still: the brake holds it."]},"g83":{"lvl":"warn","params":[["G83","Peck deep drilling."],["Z-12.5","Hole bottom."],["R-9.5","On a Fanuc lathe R is incremental from the initial point (Z5): the R point is at Z-4.5."],["Q2250","2.25 mm peck (in microns)."],["F3.","3 mm/min (G98)."]],"que":"Deep drilling cycle at the centre down to Z-12.5.","pq":["The centre hole serves as a pre-drill for the adaptive pocket roughing."],"riesgo":"3 mm/min and 40 rpm: extremely slow drilling that doesn't cut."},"m138":{"que":"M138 before the high-speed live tool (M139 at the end).","pq":["Machine-specific code: the meaning here is inferred from how the program uses it. Confirm it in the lathe manual."]},"s40000":{"lvl":"err","que":"Live tool at 40,000 rpm.","pq":["In the Siemens version the same operation has S2=5000."],"riesgo":"Lathe live tools usually top out at 4,000–6,000 rpm. 40,000 is out of range: an alarm or capped rpm, with a feed (3,300 mm/min) calculated for 40,000 rpm."},"polar1":{"que":"First move in polar interpolation at 3,300 mm/min.","pq":["From here the end mill machines the pocket in the centre of the face."]},"s_head":{"que":"Header: program name for the Siemens control (_N_…_MPF = main program).","pq":["On Siemens programs have a name, not a number. MPF = Main Program File."]},"s_wp":{"params":[["\"CYLINDER\"","Cylindrical stock."],["192","Definition type code (from the post)."],["0 / -40","From Z0 to Z-40: 40 mm long."],["-39","Part-off / part position (from the post)."],["40","Diameter: Ø40."]],"que":"Defines the stock for the control's simulation: a Ø40 cylinder 40 mm long.","pq":["The Siemens control can simulate the program before running it: WORKPIECE tells it what the stock looks like."]},"s_n11":{"que":"Feed mm/min (G94) and XZ plane (G18) as the initial state.","pq":["Then each operation sets its own mode (G95 for turning)."]},"s_g71":{"que":"G71 on Siemens = metric units (millimetres).","pq":["Careful: on a Fanuc lathe G71 is the roughing cycle, on Okuma the threading cycle (see the M20 thread folder). On Siemens it just means “millimetres”, like G21 on Fanuc."]},"s_lims":{"que":"General speed limit: 6,000 (LIMS).","pq":["It's the Siemens equivalent of Fanuc's G50 S."]},"s_lims1":{"que":"Spindle 1 speed limit: 5,000.","pq":["Like G50 S5000 in the Fanuc version. [1] = main spindle."]},"s_g53x":{"que":"Rapid in machine coordinates to X250, with the offset off (D0).","pq":["Like Fanuc's G28 U0: the turret retracts in X away from the part. D0 keeps the offset from shifting the position."]},"s_g53yz":{"que":"Machine coordinates: Y0 and then Z300.","pq":["X first, then Y to centre, then Z back: always retract in X first."]},"s_msg":{"que":"MSG: shows the operation name on the control screen.","pq":["It's the equivalent of Fanuc's (NAME) comment, but the operator sees it in the message line while running."]},"s_tool":{"que":"Calls the tool and its cutting edge D1.","pq":["On Siemens T is the tool and D is the offset (cutting edge). The change happens with M6 on the next line."]},"s_m6":{"que":"Performs the tool change.","pq":["In this post the change is separate from the T call."]},"s_diamon":{"que":"DIAMON: X in diameter.","pq":["For turning X is the diameter, as on the drawing."]},"s_diamof":{"que":"DIAMOF: X in radius.","pq":["For live tools the post switches to radius: X12.5 here is the same point as X25 in the Fanuc version."]},"s_setms1":{"que":"SETMS(1): the main spindle is the “master” spindle.","pq":["S, M3, G96, G95 refer to spindle 1 until changed."]},"s_setms2":{"que":"SETMS(2): spindle 2 (live tools) becomes the master.","pq":["From here S and M3/M5 without a number drive the live tool. It's the equivalent of P12 on Fanuc."]},"s_s1":{"que":"Spindle 1 at a fixed 566 rpm, clockwise (M1=3).","pq":["S1= and M1= refer to spindle 1. Don't confuse M1=3 (spindle 1 clockwise) with plain M1 (optional stop)."]},"s_n23":{"que":"XZ plane, absolute coordinates, feed mm/rev (G95).","pq":["G95 on Siemens = G99 on a Fanuc lathe: mm per rev."]},"s_d2":{"lvl":"warn","que":"Activates cutting edge D2 of tool T2.","pq":["The post called T2 D1 at the change and switches to D2 here: in the Fanuc version the tool is T0202 (offset 2)."],"riesgo":"D2 must exist in T2's tool table, otherwise it alarms."},"s_n29":{"que":"Rapid to Z5 and Ø60 on the same line.","pq":["Diagonal move: fine, since there's nothing in front of the part."]},"s_g96":{"que":"Constant surface speed 107 m/min on spindle 1.","pq":["Same as the Fanuc version."]},"s_fast":{"lvl":"warn","que":"G1 approach at 7.362 mm/rev to Ø50, Z-0.5.","pq":["Same line as the Fanuc version, but with F7.362 instead of F17.669."]},"s_dafter":{"que":"Re-activates the D offset after the machine-coordinate move.","pq":["The post puts it back after every G53 … D0."]},"s_m15":{"que":"Stops spindle 1 (M1=5).","pq":["End of turning: the next tool is a live tool."]},"s_s44":{"lvl":"err","que":"Live tool (spindle 2) at 44 rpm.","pq":["As in the Fanuc version."],"riesgo":"44 rpm: the drill doesn't cut."},"s_sp1":{"que":"Hole position: X12.5 (radius), Y0, and spindle 1 positioned at 210° (SP1=210).","pq":["SP1 positions the spindle as an axis: 210° = -150°, the same angle as the Fanuc version."]},"s_f2":{"lvl":"err","que":"Sets the feed to 2 mm/min (G94).","riesgo":"An hour for one hole, as in the Fanuc version."},"s_m25stop":{"que":"Stops the live tool (M2=5).","pq":["M2=5 = spindle 2 stop. Don't confuse it with M2 (end of program)."]},"s_s40":{"lvl":"warn","que":"Live too   const cx = Math.max(10, Math.min(W - 30, x)), cy = Math.max(14, Math.min(H - 8, y));
  ctx.fillStyle = css("--cursor"); ctx.strokeStyle = "#5c4100"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 9, cy); ctx.lineTo(cx + 9, cy); ctx.moveTo(cx, cy - 9); ctx.lineTo(cx, cy + 9); ctx.stroke();
  if (!inside || label) {
    ctx.fillStyle = css("--ink"); ctx.font = "600 11px " + css("--font-ui");
    const t = label || "out of view ↗";
    ctx.fillText(t, Math.min(cx + 10, W - ctx.measureText(t).width - 4), Math.max(cy - 8, 12));
  }
}
function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
function curOp() {
  let i = S.cur; if (i < 0) { const m = [...S.marks][0]; i = m == null ? -1 : m; }
  const oi = i >= 0 ? opOf(i) : null;
  return oi != null && oi >= 0 ? S.prog.ops[oi] : null;
}
function drawScene() {
  if (anim) return;
  const op = curOp();
  const v = viewOf(op) || D.views[D.progs[0].ops[0].view];
  const F = frame(v);
  drawBase(F, v, op);
  $("cap").textContent = (op ? op.name + " · " : "") + v.cap;
  const t = S.cur >= 0 ? S.prog.tp[S.cur] : null;
  if (t && t[0] != null) {
    if (t[3] != null) {
      ctx.strokeStyle = css("--cursor"); ctx.lineWidth = 2.5; ctx.setLineDash(t[5] ? [5, 4] : []);
      ctx.beginPath(); ctx.moveTo(F.sx(t[3]), F.sy(t[4])); ctx.lineTo(F.sx(t[0]), F.sy(t[1])); ctx.stroke(); ctx.setLineDash([]);
    }
    drawTool(F, t[0], t[1], null);
    zGauge(t[2], op);
  } else if (S.cur >= 0) {
    ctx.fillStyle = css("--muted"); ctx.font = "12px " + css("--font-ui");
    ctx.fillText("Tool position not defined yet", 40, 40);
  }
}
function startAnim() {
  const op = curOp(); if (!op || op.pts.length < 6) return;
  const v = viewOf(op);
  const pts = op.pts, n = pts.length / 3;
  const dur = Math.min(14000, Math.max(4000, n * 6));
  if (reduce) { stopAnim(); return; }
  let t0 = null;
  const F = frame(v);
  const tick = ts => {
    if (t0 == null) t0 = ts;
    const f = ((ts - t0) % dur) / dur, j = Math.floor(f * (n - 1)) * 3;
    drawBase(F, v, op);
    ctx.strokeStyle = css("--cursor"); ctx.lineWidth = 2;
    ctx.beginPath(); for (let q = Math.max(0, j - 90); q <= j; q += 3) { if (q === Math.max(0, j - 90)) ctx.moveTo(F.sx(pts[q]), F.sy(pts[q + 1])); else ctx.lineTo(F.sx(pts[q]), F.sy(pts[q + 1])); } ctx.stroke();
    drawTool(F, pts[j], pts[j + 1], "simulation " + Math.round(f * 100) + " %");
    anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
  renderKeys();
}

/* ---------- render ---------- */
function render() { renderKeys(); renderCode(); renderPos(); renderInfo(); drawScene(); }
if (window.ResizeObserver) new ResizeObserver(() => { if (!anim) drawScene(); }).observe(cv);
else window.addEventListener("resize", drawScene);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (S.mode !== "ciclo") return;
  if (e.key === "PageDown") { e.preventDefault(); step(1); }
  if (e.key === "PageUp") { e.preventDefault(); step(-1); }
});

renderAxes();
loadProg(S.prog);
const start = store.get("mode", "ciclo");
if (hkeys().some(h => h[0] === start) && start !== "ciclo") setMode(start); else render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!anim) drawScene(); });
})();
</script>
