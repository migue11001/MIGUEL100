<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Análisis placa Haas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: pannello di controllo CNC — barra di stato, riga messaggi, finestre (editor / spiegazione / posizione), softkey verticali a destra e orizzontali in basso. Un unico aspetto chiaro industriale, di proposito. */
:root {
  --frame: #b9c1c8;
  --win: #eef1f3;
  --paper: #ffffff;
  --ink: #1b232a;
  --muted: #5a6670;
  --rule: #98a3ad;
  --head: #34495a;
  --head-ink: #f4f7f9;
  --accent: #0a6a8c;
  --cursor: #f3a712;
  --cursor-ink: #1b1400;
  --key-top: #fbfcfc;
  --key-bot: #c8cfd5;
  --key-on: #ffd27a;
  --ok: #2c7a3a;
  --warn: #b76a00;
  --warn-bg: #fff1d6;
  --err: #c0262d;
  --err-bg: #fde3e3;
  --steel: #c4ccd3;
  --steel-dark: #7d8a95;
  --code-g: #0a5d9e;
  --code-m: #7a3a9a;
  --code-c: #2f7d4a;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--frame);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  padding-inline: 16px;
  padding-block: 16px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.hmi {
  max-width: 1480px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 128px;
  grid-template-areas: "bar bar" "msg msg" "work vkeys" "hkeys hkeys";
  gap: 4px;
  background: #8d979f;
  padding: 4px;
  border: 1px solid #6f7a83;
}

/* barra superiore */
.bar { grid-area: bar; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px; }
.bar > div { background: var(--head); color: var(--head-ink); padding: 6px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.area { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.path { font-family: var(--font-code); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chan { font-weight: 600; letter-spacing: .04em; }
.chan .led { width: 10px; height: 10px; border-radius: 50%; background: #58c26a; box-shadow: 0 0 0 2px #2a3a47; }

/* riga messaggi */
.msg { grid-area: msg; background: var(--paper); border: 1px solid var(--rule); padding: 5px 10px; display: flex; gap: 10px; align-items: baseline; min-height: 34px; font-weight: 500; }
.msg .tag { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 12px; padding: 1px 6px; border-radius: 2px; flex: none; }
.msg.ok .tag { background: #dcefdf; color: var(--ok); }
.msg.warn { background: var(--warn-bg); }
.msg.warn .tag { background: var(--warn); color: #fff; }
.msg.err { background: var(--err-bg); }
.msg.err .tag { background: var(--err); color: #fff; }

/* zona finestre */
.work { grid-area: work; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); grid-template-areas: "editor info" "pos info"; gap: 4px; min-width: 0; }
.win { background: var(--win); border: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; }
.win-h { background: linear-gradient(#4a6274, var(--head)); color: var(--head-ink); padding: 4px 10px; font-weight: 600; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.win-h small { font-weight: 400; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editor { grid-area: editor; }
.info { grid-area: info; }
.pos { grid-area: pos; }

/* editor */
.code { font-family: var(--font-code); font-size: 13.5px; background: var(--paper); margin: 6px; border: 1px solid var(--rule); overflow: auto; max-height: 340px; flex: 1; }
.ln { display: grid; grid-template-columns: 4.2em 1.2em minmax(0, 1fr); align-items: baseline; padding: 1px 6px 1px 0; cursor: pointer; white-space: pre; border-left: 4px solid transparent; }
.ln:hover { background: #eaf3f7; }
.ln .no { color: var(--muted); text-align: right; padding-right: 8px; font-size: 11.5px; user-select: none; }
.ln .flag { font-size: 11px; font-weight: 700; }
.ln.warn .flag { color: var(--warn); }
.ln.err .flag { color: var(--err); }
.ln.mark { background: #e3f0f6; border-left-color: var(--accent); }
.ln.cur { background: var(--cursor); color: var(--cursor-ink); border-left-color: #a46c00; }
.ln.cur .no, .ln.cur .t-n, .ln.cur .t-g, .ln.cur .t-m, .ln.cur .t-c { color: var(--cursor-ink); }
.ln.blank { cursor: default; }
.ln.gap { color: var(--muted); font-style: italic; background: repeating-linear-gradient(135deg, #f4f6f7 0 6px, #eceff1 6px 12px); }
.ln.gap.cur { background: var(--cursor); }
.t-n { color: var(--muted); }
.t-g { color: var(--code-g); font-weight: 600; }
.t-m { color: var(--code-m); font-weight: 600; }
.t-c { color: var(--code-c); font-style: italic; }

/* posizione */
.pos-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 6px 6px 0; }
.axis { background: var(--paper); border: 1px solid var(--rule); padding: 3px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; min-width: 0; }
.axis b { font-size: 12px; color: var(--muted); letter-spacing: .05em; }
.axis span { font-family: var(--font-code); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal { margin: 4px 6px 0; background: var(--paper); border: 1px solid var(--rule); padding: 4px 8px; font-family: var(--font-code); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.modal i { font-style: normal; color: var(--muted); font-family: var(--font-ui); font-size: 12px; }
.scene { margin: 6px; background: var(--paper); border: 1px solid var(--rule); position: relative; }
.scene canvas { display: block; width: 100%; }
.scene .cap { position: absolute; left: 8px; top: 4px; font-size: 12px; color: var(--muted); pointer-events: none; }

/* spiegazione */
.info-body { padding: 10px 14px 14px; overflow: auto; max-height: 720px; display: grid; gap: 12px; align-content: start; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--head-ink); background: var(--accent); padding: 2px 8px; border-radius: 2px; justify-self: start; }
.blk { font-family: var(--font-code); font-size: 15px; background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--cursor); padding: 6px 10px; overflow-x: auto; white-space: pre; }
.sec { display: grid; gap: 4px; }
.sec h3 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sec h3::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.sec p { margin: 0; max-width: 68ch; }
.sec ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 70ch; }
.sec.why h3 { color: var(--accent); }
.sec.why { background: var(--paper); border: 1px solid #bcd6e1; padding: 8px 12px 10px; }
.sec.risk { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 6px 10px; }
.sec.risk.err { border-left-color: var(--err); background: var(--err-bg); }
.sec.risk h3 { color: var(--warn); }
.sec.risk.err h3 { color: var(--err); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--paper); }
th, td { border: 1px solid #c3cbd2; padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: #dfe5ea; font-weight: 600; font-size: 13px; }
td.num, th.num { text-align: right; font-family: var(--font-code); font-variant-numeric: tabular-nums; white-space: nowrap; }
td code, p code, li code { font-family: var(--font-code); font-size: .92em; background: #e8edf1; padding: 0 3px; border-radius: 2px; }
tr.hit td { background: #fff3d1; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #eaf3f7; }
td.bad { color: var(--err); font-weight: 600; }
td.meh { color: var(--warn); font-weight: 600; }

.card { background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--warn); padding: 8px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; }
.card.err { border-left-color: var(--err); }
.card.on { box-shadow: 0 0 0 2px var(--cursor); }
.card h4 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.card h4 .n { font-family: var(--font-code); font-size: 12px; color: var(--muted); }
.card .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; max-width: 70ch; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; background: var(--paper); border: 1px solid var(--rule); padding: 8px 12px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.check label { font-weight: 600; cursor: pointer; }
.check p { grid-column: 2; margin: 0; color: var(--muted); }
.check.done label { text-decoration: line-through; color: var(--ok); }
.note { font-size: 13.5px; color: var(--muted); max-width: 72ch; margin: 0; }

/* softkey */
.vkeys { grid-area: vkeys; display: grid; grid-auto-rows: minmax(54px, auto); gap: 4px; align-content: start; }
.hkeys { grid-area: hkeys; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.sk { background: linear-gradient(var(--key-top), var(--key-bot)); border: 1px solid #77838d; border-radius: 3px; box-shadow: inset 0 1px 0 #fff, 0 1px 0 #6d7881; padding: 6px 8px; min-height: 48px; font-weight: 600; line-height: 1.15; text-align: center; cursor: pointer; }
.sk:hover:not(:disabled) { background: linear-gradient(#ffffff, #d7dde2); }
.sk:active:not(:disabled) { box-shadow: inset 0 2px 3px rgba(0,0,0,.25); }
.sk.on { background: linear-gradient(#fff3d6, var(--key-on)); border-color: #a46c00; }
.sk:disabled { cursor: default; color: transparent; background: linear-gradient(#e3e7ea, #cdd3d8); box-shadow: none; }
a.sk { text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: center; }
.sk small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }

@media (max-width: 1100px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-areas: "editor" "info" "pos"; }
  .code { max-height: 260px; }
  .info-body { max-height: none; }
}
@media (max-width: 760px) {
  body { padding-inline: 8px; }
  .hmi { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "msg" "vkeys" "work" "hkeys"; }
  .bar { grid-template-columns: minmax(0, 1fr) auto; }
  .bar .path-box { grid-column: 1 / -1; order: 3; }
  .vkeys { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: auto; }
  .hkeys { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sk:disabled { display: none; }
  .sk { min-height: 42px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="hmi" id="hmi">
  <header class="bar">
    <div class="area">Programa</div>
    <div class="path-box"><span class="path" id="path"></span></div>
    <div class="chan"><span class="led" aria-hidden="true"></span>CANAL 1 · RESET</div>
  </header>

  <div class="msg ok" id="msg" role="status"><span class="tag">Info</span><span id="msgText"></span></div>

  <main class="work">
    <section class="win editor" aria-label="Editor del programa">
      <div class="win-h"><span>Editor</span><small id="edName"></small></div>
      <div class="code" id="code" tabindex="0" aria-label="Líneas del programa. Usa las flechas para moverte."></div>
    </section>

    <section class="win info" aria-live="polite">
      <div class="win-h"><span id="infoTitle">Explicación</span><small id="infoSub"></small></div>
      <div class="info-body" id="info"></div>
    </section>

    <section class="win pos" aria-label="Posición y estado">
      <div class="win-h"><span>Posición pieza</span><small id="posSub"></small></div>
      <div class="pos-grid" id="axes"></div>
      <div class="modal" id="pMod"><i>Modales G:</i> —</div>
      <div class="scene"><span class="cap" id="cap"></span><canvas id="cv" height="220" aria-label="Dibujo de la trayectoria de la operación y posición de la herramienta"></canvas></div>
    </section>
  </main>

  <nav class="vkeys" id="vkeys" aria-label="Softkeys verticales"></nav>
  <nav class="hkeys" id="hkeys" aria-label="Softkeys horizontales"></nav>
</div>

<script>
(function () {
"use strict";
const D = {"key":"piastra-haas","board":"tablero-placa-haas.html","axes":["X","Y","Z","EJES ROT.","S","F","T","HUSILLO","REFRIG.","CORR. LONG."],"posSub":"cero pieza G54 · mm","zLabel":"Z","info":{"pct":{"que":"Marca de inicio o de fin del archivo.","pq":["Cuando el programa llega por red o por USB, el control empieza a leer en el primer % y se para en el siguiente. Lo que queda fuera se ignora."],"sino":"Algunos controles no reconocen el inicio del programa y la carga falla."},"oname":{"que":"Número de programa en la memoria de la máquina.","pq":["El control Haas identifica los programas con la letra O y 5 cifras. Fusion lo escribe con el número que pusiste al postprocesar.","Los dos archivos de esta carpeta tienen números distintos (O00012 y O00004): se pueden cargar juntos sin sobrescribirse."]},"hifeed":{"lvl":"warn","que":"Comentario del post: los rápidos están escritos como G1 F228600 en lugar de G0.","pq":["En una 5 ejes un G0 con ejes rotativos puede no ser una línea recta: cada eje va a su velocidad máxima y la punta de la herramienta hace un recorrido «en codo».","Escribiendo G1 con un avance altísimo (228,6 m/min) la máquina interpola todos los ejes a la vez y la punta va recta. Luego el control limita el avance al máximo real de los ejes."],"riesgo":"Con G1 el override de rápidos no actúa: para frenar la primera prueba tienes que usar el override de avance."},"caution335":{"lvl":"warn","que":"Aviso del post: este programa usa G0 normales y pide revisar el Setting 335.","pq":["El Setting 335 de Haas decide cómo se mueven los rápidos. Con «Linear + Rotary» todos los ejes, también B y C, llegan a la vez y la punta hace una línea recta.","Es la alternativa al G1 F228600 de la otra versión: mismo objetivo (rápido rectilíneo), pero lo garantiza la máquina y no el programa."],"riesgo":"Si el Setting 335 no está configurado, un rápido con B o C puede hacer una curva y pasar cerca de la pieza o de la mordaza."},"toollist":{"que":"Comentario: lista de herramientas usadas con diámetro, radio de punta, ángulo y cota Z más baja alcanzada.","pq":["Sirve al operario para preparar el almacén antes de arrancar: comprueba que cada T esté montada y medida.","ZMIN es la Z más baja que alcanza esa herramienta. Compárala con el espesor de la pieza y con la mordaza: si ZMIN baja por debajo de la pieza, debajo tiene que haber espacio libre."]},"n10":{"que":"Modos de seguridad: cotas absolutas (G90), avance en mm/min (G94), plano XY (G17).","pq":["Al arrancar el control puede tener todavía los modos del programa anterior. Escribirlos al inicio evita sorpresas.","G17 es el plano donde se hacen los arcos G2/G3 y los ciclos de taladrado (eje Z perpendicular)."],"sino":"Si hubiera quedado activo G91 (incremental), el primer movimiento partiría de la posición actual y no del cero pieza."},"n15":{"que":"Anula la compensación de longitud (G49) y las coordenadas de trabajo inclinadas (G269).","pq":["G268/G269 en Haas activan/desactivan el «Feature Coordinate System», el plano de trabajo inclinado para el mecanizado 3+2.","Antes de mover nada se parte de un estado limpio: ningún corrector de herramienta, ningún plano girado."]},"n20":{"que":"Unidades métricas: todas las cotas en milímetros.","pq":["Una UMC puede trabajar en pulgadas o milímetros. G21 lo fija en el programa, así no depende de la configuración de la máquina."],"sino":"En pulgadas, X38.8 se convertiría en 985 mm: alarma de fin de carrera o, peor, un movimiento enorme."},"g53z":{"que":"Rápido en coordenadas de máquina (G53) hasta Z0 máquina: el husillo sube al punto más alto.","pq":["G53 ignora el cero pieza y usa el cero de máquina. Z0 máquina es el recorrido máximo hacia arriba, el sitio más seguro.","Se hace antes de girar la mesa, antes de cambiar de herramienta y al final de cada operación: con el husillo arriba nada puede tocar la pieza."]},"n30":{"que":"Lleva los ejes rotativos B y C a cero (cabezal/mesa alineados).","pq":["En una UMC la mesa se inclina (B) y gira (C). Este programa trabaja todo en 3 ejes, con la mesa plana: B0 C0 la pone en posición de referencia.","Se hace con el husillo ya arriba (línea anterior): la mesa al girar arrastra también la pieza y la mordaza."],"riesgo":"Comprueba que la mordaza y la pieza no toquen las protecciones durante la rotación."},"t1m6":{"que":"Cambio de herramienta: monta T1, fresa Ø12 con radio de punta 0,5 (usada para planear).","pq":["M6 hace el cambio propiamente dicho. Haas lleva automáticamente el husillo a la posición de cambio."]},"s40000":{"lvl":"err","que":"Arranca el husillo a 40.000 rpm, sentido horario.","pq":["El valor viene de la biblioteca de herramientas de Fusion: Vc = π·12·40.000/1000 ≈ 1.508 m/min, típico de un husillo de alta velocidad para aluminio.","M3: giro horario visto desde el husillo, el de las fresas normales a derechas."],"riesgo":"Ningún husillo Haas UMC de serie llega a 40.000 rpm (según versión: 8.100, 12.000 o 15.000). La máquina limita las revoluciones o se para con alarma: en cualquier caso avance y revoluciones ya no corresponden a los calculados. Ver Errores."},"safeblk":{"que":"Repite los modos de seguridad al inicio de la operación.","pq":["El post los reescribe en cada operación: si el operario rearranca a mitad de programa (tras un M1 o una herramienta rota), los modos vuelven a ser los correctos."]},"g54":{"que":"Activa el cero pieza G54.","pq":["Todas las cotas X Y Z que siguen se miden desde el punto que el operario tomó en la pieza (aquí el centro de la placa y la cara superior).","El post lo repite en cada operación por el mismo motivo que los modos de seguridad."]},"approach":{"que":"Rápido en XY sobre el punto de entrada, con el husillo todavía arriba.","pq":["Primero se va en XY y solo después se baja en Z: así el rápido horizontal se hace a la cota más alta."]},"g43ok":{"que":"Activa el corrector de longitud de la herramienta (G43 H) y baja a Z15.","pq":["Cada herramienta tiene una longitud distinta. G43 con el número H correcto le dice a la máquina cuánto sobresale la punta, así Z15 es realmente 15 mm sobre la pieza.","El número H debe ser el de la herramienta montada: aquí T1 → H1."],"sino":"Sin corrector, la Z se referiría a la nariz del husillo y la punta acabaría mucho más abajo."},"g43h1err":{"lvl":"err","que":"Activa el corrector de longitud H1 — pero la herramienta montada no es T1.","pq":["El número H viene del campo «Length offset» de la herramienta en Fusion. Para T2 y T3 se quedó en 1."],"riesgo":"La máquina usa la longitud de T1 (la fresa) para una broca. Si la broca es más larga que la fresa, baja más de lo previsto: el rápido a Z5 puede acabar dentro de la pieza y el taladrado va más profundo. Si es más corta, el agujero queda corto."},"m8":{"que":"Abre el refrigerante.","pq":["Enfría el filo y se lleva la viruta. En taladrado y roscado es imprescindible: la viruta dentro del agujero bloquea la broca."]},"presel":{"que":"Preselecciona la herramienta siguiente en el almacén (sin cambiarla).","pq":["Mientras trabaja la herramienta actual, el almacén coloca la siguiente en posición. En el próximo M6 el cambio es más rápido."]},"z5":{"que":"Rápido hasta Z5, 5 mm sobre la pieza.","pq":["Es la última cota en rápido: de aquí para abajo se baja en trabajo (G1), más despacio."]},"n80":{"que":"Baja en trabajo hasta Z0,2, justo por encima de la superficie.","pq":["De Z5 a Z0,2 la fresa está todavía en el aire pero ya se mueve en G1: si el bruto fuera más alto de lo previsto, tocaría a velocidad de trabajo y no en rápido."]},"ramparc":{"que":"Entrada en arco en el plano XZ (G18): la fresa baja de Z0,2 a Z-1 mientras se desplaza en X.","pq":["Entrar con un arco evita bajar en vertical sobre el borde de la pieza: la carga en el filo crece gradualmente.","G18 cambia el plano de los arcos a XZ; I y K son las distancias del centro del arco en X y en Z."]},"facepass":{"que":"Pasada de planeado de un lado a otro de la pieza.","pq":["El planeado quita 1 mm de la cara superior para tener una superficie plana y un Z0 seguro.","Las pasadas van y vuelven (zigzag): sin tiempo perdido volviendo en vacío."]},"stepover":{"que":"Arco de enlace entre una pasada y otra (G17, plano XY).","pq":["El paso lateral es de unos 7,1 mm: con una fresa Ø12 cada pasada se solapa con la anterior unos 5 mm.","Un arco en lugar de una arista viva: la fresa no se para y no deja marcas."]},"exitarc":{"que":"Salida en arco en el plano XZ: la fresa sube a Z0,2 alejándose de la pieza.","pq":["Como la entrada: el filo se descarga gradualmente en lugar de separarse de golpe."]},"z15":{"que":"Rápido a Z15, sobre la pieza.","pq":["Fin de los movimientos de trabajo: antes de parar el husillo la herramienta sale del material."]},"m5":{"que":"Para el husillo.","pq":["El husillo se para antes del cambio de herramienta o del fin de programa."]},"m9":{"que":"Cierra el refrigerante.","pq":["Se cierra antes de subir, para no salpicar toda la cabina durante el movimiento largo."]},"g49":{"que":"Anula el corrector de longitud.","pq":["El próximo movimiento es en coordenadas de máquina (G53): el corrector ya no hace falta y así no queda activo por error con la siguiente herramienta."]},"m1":{"que":"Parada opcional: la máquina solo se para si la tecla «Optional Stop» está activada.","pq":["Antes de cada cambio de herramienta: en la primera prueba el operario puede pararse, revisar el trabajo de la herramienta anterior y luego seguir.","En producción se apaga Optional Stop y el programa sigue sin pararse."]},"t2m6":{"que":"Cambio de herramienta: T2, broca Ø7 con ángulo 140° (agujero para macho M8×1).","pq":["Ø7 es el pretaladro estándar para una rosca M8×1 (diámetro − paso = 8 − 1)."]},"s1820":{"que":"Husillo a 1.820 rpm.","pq":["Para la broca Ø7: Vc = π·7·1.820/1000 ≈ 40 m/min, un valor de acero."]},"g73":{"lvl":"err","params":[["G98","Al final de cada agujero vuelve a la cota inicial (Z5), no a R."],["G73","Taladrado con rompevirutas: entra en pasos de Q y retrocede un poco."],["X20. Y10.","Primer agujero."],["Z-17.274","Fondo del agujero (punta incluida)."],["R2.5","Cota de inicio de trabajo: de Z5 a Z2,5 en rápido."],["Q1.75","Profundidad de cada paso: 1,75 mm."],["F0.08","Avance… en mm/min (G94 activo)."]],"que":"Ciclo de taladrado con rompevirutas: taladra el primer agujero en pasos de 1,75 mm hasta Z-17,274.","pq":["G73 hace pequeños retrocesos para romper la viruta sin salir del agujero: es más rápido que G83.","La profundidad -17,274 incluye la punta cónica a 140°: el diámetro completo llega a unos Z-16."],"riesgo":"F0.08 con G94 activo significa 0,08 mm por minuto: unas 3 horas y media para 16 mm. La broca gira sin cortar, se calienta y se estropea. El valor correcto era 0,08 mm/vuelta = 145,6 mm/min."},"hole2":{"que":"Segundo agujero del mismo ciclo: la máquina va a X-20 Y-10 y repite el taladrado.","pq":["Los ciclos fijos son modales: basta escribir la nueva posición y el ciclo se repite con los mismos parámetros."]},"g80":{"que":"Anula el ciclo fijo.","pq":["Sin G80, el próximo movimiento en X/Y haría otro agujero."]},"g81":{"lvl":"err","params":[["G81","Taladrado simple: entra hasta Z y sale en rápido."],["Z-17.128","Fondo del agujero."],["R3.5","Inicio del trabajo en Z3,5."],["F0.07","Avance en mm/min (G94)."]],"que":"Ciclo de taladrado simple para los agujeros Ø6,2 que se escariarán a Ø6,5.","pq":["Ø6,2 deja 0,15 mm por lado al escariador: es el sobrematerial típico para escariar un agujero H7."],"riesgo":"El mismo error que Broca1: F0.07 mm/min. El valor correcto era unos 0,07 mm/vuelta = 127 mm/min."},"s2499":{"que":"Husillo a 2.499 rpm para la fresa cilíndrica Ø12.","pq":["Vc = π·12·2.499/1000 ≈ 94 m/min: un valor de acero, muy distinto de las 40.000 rpm del planeado."]},"g43h4":{"que":"Corrector de longitud H4 para T4: aquí el número es correcto.","pq":["Compara con las brocas: T4 → H4, T6 → H6, T5 → H5, T7 → H7. Solo T2 y T3 tienen H1."]},"g43gen":{"que":"Activa el corrector de longitud de la herramienta recién montada y baja a Z15.","pq":["Aquí el número H coincide con el número de herramienta: es correcto.","Z15 es la cota de seguridad sobre la pieza desde la que parte cada operación."]},"plunge":{"lvl":"warn","que":"Bajada en trabajo (F75) hasta Z-14,3, fuera de la pieza.","pq":["El punto X-31,2 Y29,6 está fuera de la placa (Y20 es el borde): la fresa baja en vacío junto a la pieza.","El contorno se hace en una sola pasada a toda profundidad: Z-15,5."],"riesgo":"Si el bruto es más grande en Y de lo que crees, esta bajada vertical se hace en lleno: con una fresa cilíndrica hace falta corte al centro, si no se rompe."},"leadin":{"que":"Entrada en arco en el plano YZ (G19): la fresa baja de Z-14,3 a Z-15,5 acercándose a la pieza.","pq":["Como en el planeado: el filo entra en carga gradualmente."]},"cfeed":{"que":"Contorno: pasada a lo largo del lado Y=26 (centro fresa) a 124,94 mm/min.","pq":["El centro de la fresa Ø12 está a 6 mm de la pieza: Y26 − 6 = Y20, el borde de la placa 60×40.","No hay G41/G42: la compensación de radio ya la calculó Fusion. Si la fresa real no es Ø12, la pieza cambia de medida."]},"corner":{"que":"Arco alrededor de la esquina: el centro fresa gira con radio 6 alrededor de la esquina de la pieza.","pq":["Radio de la trayectoria 6 = radio de la fresa: la esquina de la pieza queda viva (a 90°)."]},"leadout":{"que":"Salida en arco en el plano YZ y subida.","pq":["El filo sale del material sin dejar marca."]},"chdown":{"que":"Baja hasta Z-2 para el chaflán (antes a Z2 en rápido controlado a F1400).","pq":["T6 es un avellanador a 120°: cuanto más baja, más ancho es el chaflán. Z-2 da un chaflán de unos 0,5–1,5 mm en la cara (que está en Z-1 tras el planeado)."]},"chcircle":{"que":"Círculo alrededor del agujero (G3, interpolación circular): achaflana el borde del agujero.","pq":["El centro del arco es el centro del agujero; el radio de la trayectoria decide el ancho del chaflán: 3,285 para los agujeros roscados, 2,018 para los escariados."]},"hifmove":{"lvl":"warn","que":"Desplazamiento entre un chaflán y otro en G1 a 228.600 mm/min: es un rápido «disfrazado».","pq":["Ver el comentario al inicio del programa: en 5 ejes así la trayectoria sigue siendo recta.","La máquina limita el avance a su máximo real."],"riesgo":"Se hace a Z5: si la cota de seguridad está mal, la pieza se toca a velocidad máxima."},"g0move335":{"lvl":"warn","que":"Desplazamiento rápido modal (G0 activo desde la línea anterior) hacia el siguiente chaflán.","pq":["En esta versión el post usa G0 normales: la trayectoria es recta solo con el Setting 335 = Linear + Rotary."]},"chcontour":{"que":"Chaflán a lo largo del contorno de la pieza.","pq":["La trayectoria está a 31,232 del centro en los lados X: el avellanador toca la arista en X30 con la parte cónica."]},"s2000":{"lvl":"warn","que":"Husillo a 2.000 rpm para el macho M8.","pq":["En el roscado rígido las revoluciones y el avance están ligados: F = S × paso."]},"g84":{"lvl":"warn","params":[["G84","Roscado rígido: entra, invierte el husillo en el fondo, sale."],["Z-16.","Fondo de la rosca."],["R2.5","Cota de inicio."],["F2000.","2.000 mm/min ÷ 2.000 rpm = paso 1,0 mm."]],"que":"Ciclo de roscado a derechas en los agujeros Ø7.","pq":["El paso que resulta es 1,0 mm: es una M8×1 (paso fino). El pretaladro Ø7 es correcto para este paso.","La máquina sincroniza el husillo con el eje Z: en cada vuelta Z avanza exactamente un paso."],"riesgo":"Si en el almacén hay un macho M8 normal (paso 1,25), la rosca se arranca y el macho se rompe. Revisa el paso grabado en el macho."},"s800":{"que":"Husillo a 800 rpm para el escariador Ø6,5.","pq":["Los escariadores trabajan despacio: Vc = π·6,5·800/1000 ≈ 16 m/min. Velocidad baja = agujero preciso y liso."]},"g95":{"lvl":"err","que":"Pasa al avance en mm/vuelta.","pq":["Para el escariador el post escribe el avance por vuelta. El G94 tras el ciclo vuelve a poner mm/min."],"riesgo":"El ciclo siguiente tiene F0.: con G95, cero milímetros por vuelta."},"g89":{"lvl":"err","params":[["G89","Escariado con pausa en el fondo, salida en trabajo."],["Z-16.","Fondo."],["R3.5","Cota de inicio."],["P0","Pausa en el fondo: 0 segundos."],["F0.","Avance cero."]],"que":"Ciclo de escariado de los agujeros Ø6,2 a Ø6,5.","pq":["G89 sale en trabajo (no en rápido) para no rayar las paredes del agujero escariado."],"riesgo":"F0. → la máquina da alarma o no se mueve. En Fusion el avance del escariado se quedó a cero."},"g94back":{"que":"Vuelve al avance en mm/min.","pq":["Se restablece el modo estándar para los movimientos siguientes."]},"g53y":{"que":"Lleva la mesa hacia delante (Y0 máquina) para descargar la pieza.","pq":["Al final del programa el operario encuentra la pieza cerca de la puerta."]},"m30":{"que":"Fin de programa: para todo y vuelve al inicio.","pq":["M30 rebobina el programa: pulsando otra vez Cycle Start se mecaniza la pieza siguiente."]},"seconda":{"lvl":"err","que":"Comentario: empieza la segunda parte del programa (el otro lado de la pieza).","pq":["Fusion juntó dos setups en un solo archivo. El segundo setup mecaniza la cara opuesta: hay que dar la vuelta a la pieza."],"riesgo":"Entre las dos partes no hay un M0 (parada obligatoria) ni otro cero pieza (G55). Ver Errores."},"m1flip":{"lvl":"err","que":"Parada opcional antes de la segunda parte.","pq":["Aquí el operario debería voltear la pieza y volver a tomar el cero."],"riesgo":"M1 solo se para si Optional Stop está activado. Si está apagado, la máquina planea 10 mm del lado ya terminado, sobre los agujeros roscados."},"facestep":{"que":"Nueva pasada de planeado 3 mm más abajo (Z-2,8 → Z-4).","pq":["La segunda cara quita 10 mm en 4 niveles: Z-1, -4, -7, -10. Cada nivel tiene 7 pasadas en zigzag."]},"chz11":{"que":"Baja a Z-11 para achaflanar la arista del contorno en el segundo lado.","pq":["Tras el planeado la cara está en Z-10: Z-11 da el mismo chaflán que el primer lado (1 mm bajo la cara)."]},"n1025":{"que":"Rápido sobre el inicio del planeado del segundo lado, más ancho que el primero (X±41,1).","pq":["El segundo lado es el bruto sin mecanizar: Fusion usa las dimensiones del bruto, no de la placa acabada."]}},"errors":[{"lvl":"err","t":"Husillo a 40.000 rpm","pq":"El planeado (T1) y el chaflán (T6) piden 40.000 rpm. Los husillos de las Haas UMC llegan a 8.100, 12.000 o 15.000 rpm según la versión. El control limita las revoluciones o se para con alarma. Si las limita, el avance F6100 sigue igual con 5 veces menos revoluciones: cada diente quita 5 veces más viruta.","sol":"En Fusion pon las revoluciones de la herramienta dentro del límite de la máquina (y recalcula el avance por diente), o usa una máquina para la que se hizo la biblioteca.","prog":"o12","lines":[19,124]},{"lvl":"err","t":"Corrector de longitud H1 para las brocas T2 y T3","pq":"G43 H1 aplica la longitud de T1 (la fresa). Con una broca montada, la Z real de la punta está mal en la diferencia de longitud entre las dos herramientas: el rápido a Z5 puede acabar dentro de la pieza, y la profundidad del agujero es incorrecta.","sol":"En la biblioteca de Fusion pon «Length offset» = número de herramienta (T2 → 2, T3 → 3) y vuelve a postprocesar. Las demás operaciones (H4, H5, H6, H7) ya están bien.","prog":"o12","lines":[55,75]},{"lvl":"err","t":"Taladrados a 0,08 y 0,07 mm/min","pq":"Con G94 activo, F0.08 significa 0,08 milímetros por minuto: para 17 mm hacen falta más de 3 horas por agujero. La broca gira sin llegar a cortar, frota, se calienta y se gasta. El avance se escribió en mm/vuelta en un campo de mm/min.","sol":"Avance por vuelta 0,08 → F = 0,08 × 1.820 = 145,6 mm/min (Broca1) y 0,07 × 1.820 ≈ 127 mm/min (Broca2).","prog":"o12","lines":[59,79]},{"lvl":"err","t":"Escariado con avance cero","pq":"El ciclo G89 está en G95 (mm/vuelta) con F0.: cero milímetros por vuelta. La máquina da alarma o se queda quieta con el escariador girando en el agujero.","sol":"Avance típico para un escariador Ø6,5: 0,1–0,2 mm/vuelta (F0.15 con G95, o 120 mm/min con G94).","prog":"o12","lines":[213,214]},{"lvl":"err","t":"Segundo lado sin M0 y con el mismo cero pieza","prog":"o04","pq":"En O00004 la segunda parte (planeado de 10 mm y chaflán a Z-11) arranca después de un M1, es decir una parada opcional, y sigue usando G54. Si Optional Stop está apagado, la máquina no se para y planea 10 mm del lado recién terminado. Aunque se pare, el cero G54 es el del primer lado.","sol":"M0 antes de la segunda parte, con un comentario para el operario («VOLTEAR LA PIEZA»), y un segundo cero pieza (G55) para el segundo setup en Fusion. Mejor aún: dos programas separados.","lines":[225,228,232]},{"lvl":"warn","t":"Roscado con paso 1,0 mm","pq":"F2000 / S2000 = 1,0 mm por vuelta, es decir M8×1 (paso fino). La M8 normal tiene paso 1,25. El pretaladro Ø7 es correcto para M8×1 (para M8×1,25 sería Ø6,8).","sol":"Revisa el macho en máquina. Si es M8×1,25, en Fusion corrige el paso de la herramienta (F pasa a 2.500) y el pretaladro (Ø6,8).","prog":"o12","lines":[185,193]},{"lvl":"warn","t":"Rápidos en 5 ejes: dos soluciones distintas","pq":"O00012 sustituye los rápidos por G1 F228600 (el override de rápidos no funciona en estas líneas); O00004 usa G0 y pide el Setting 335 = Linear + Rotary. Son dos maneras de conseguir un rápido rectilíneo: no hay que mezclarlas.","sol":"Elige una configuración en el post y úsala siempre. Con G0, revisa el Setting 335 en la máquina antes de ejecutar.","prog":"o12","lines":[3,139,153,161]}],"checks":[{"t":"Longitudes T1–T7 medidas y números H iguales al número de herramienta","pq":"Sobre todo T2 y T3, que en el programa usan H1.","prog":"o12","lines":[23,55,75]},{"t":"Espacio libre debajo de los agujeros y debajo del contorno","pq":"Las brocas bajan a Z-17,3 y el contorno a Z-15,5: las paralelas de la mordaza no deben estar debajo de los agujeros (X±20 Y±10) ni debajo del borde.","prog":"o12","lines":[59,79,100]},{"t":"Mesa libre para girar a B0 C0","pq":"La línea «B0. C0.» mueve la mesa con la pieza montada: mordaza y pieza no deben tocar las protecciones.","prog":"o12","lines":[15]},{"t" /* ---------- utilità ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const nf = (v, d) => v == null ? "—" : Number(v).toLocaleString("es-ES", { minimumFractionDigits: d, maximumFractionDigits: d });
const store = {
  get(k, def) { try { const v = localStorage.getItem(D.key + "-" + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(D.key + "-" + k, JSON.stringify(v)); } catch (e) {} }
};
function hl(line) {
  if (/^\s*(N\d+\s*)?\(.*\)\s*$/.test(line) || /^\s*;/.test(line)) return '<span class="t-c">' + esc(line) + "</span>";
  let s = esc(line);
  s = s.replace(/(\(.*?\)|;.*$)/g, '<span class="t-c">$1</span>');
  return s
    .replace(/^(N\d+)/, '<span class="t-n">$1</span>')
    .replace(/\b(G\d+(?:\.\d)?)(?![^<]*<\/span>)/g, '<span class="t-g">$1</span>')
    .replace(/\b(M\d*=?\d+)(?![^<]*<\/span>)/g, '<span class="t-m">$1</span>');
}

/* ---------- stato ---------- */
const P = {}; D.progs.forEach(p => { P[p.id] = p; });
const S = {
  mode: "ciclo", prog: D.progs[0], cur: 0, marks: new Set(),
  errSel: 0, codeSel: -1, toolSel: -1, checks: store.get("checks", [])
};
function firstLine(p) { const i = p.lines.findIndex(l => l[2] === "op"); return i < 0 ? 0 : i; }
S.cur = firstLine(S.prog);

function opOf(i, p) { p = p || S.prog; return p.lineOp[i]; }
function infoOf(i, p) { p = p || S.prog; const k = p.lineInfo[i]; return k ? D.info[k] : null; }
function levelOf(i, p) { const d = infoOf(i, p); return d && d.lvl; }
function idxOfFileLine(p, n) { return p.lines.findIndex(l => l[0] === n); }

/* ---------- editor ---------- */
function renderCode() {
  const box = $("code"), p = S.prog;
  box.innerHTML = p.lines.map((l, i) => {
    const kind = l[2], txt = l[1];
    const lv = levelOf(i) || "";
    const cls = ["ln", kind === "gap" ? "gap" : (txt.trim() ? "" : "blank"), lv, S.marks.has(i) ? "mark" : "", i === S.cur ? "cur" : ""].join(" ");
    const flag = lv === "err" ? "✖" : lv === "warn" ? "!" : "";
    const no = kind === "gap" ? "⋮" : l[0];
    return '<div class="' + cls + '" data-i="' + i + '"><span class="no">' + no + '</span><span class="flag">' + flag + "</span><span>" + (kind === "gap" ? esc(txt) : (txt ? hl(txt) : " ")) + "</span></div>";
  }).join("");
  const c = box.querySelector(".cur") || box.querySelector(".mark");
  if (c) {
    const top = c.offsetTop - box.offsetTop, h = box.clientHeight;
    if (top < box.scrollTop || top > box.scrollTop + h - 24) box.scrollTop = Math.max(0, top - h / 3);
  }
}
$("code").addEventListener("click", e => {
  const ln = e.target.closest(".ln"); if (!ln) return;
  const i = +ln.dataset.i; const l = S.prog.lines[i]; if (!l || (!l[1].trim() && l[2] !== "gap")) return;
  if (S.mode !== "ciclo") setMode("ciclo", true);
  go(i);
});
$("code").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); step(1); }
  if (e.key === "ArrowUp") { e.preventDefault(); step(-1); }
});
function go(i) { stopAnim(); S.cur = i; S.marks = new Set(); render(); }
function step(d) {
  let i = S.cur; const L = S.prog.lines;
  do { i += d; } while (i >= 0 && i < L.length && !L[i][1].trim() && L[i][2] !== "gap");
  if (i >= 0 && i < L.length) go(i);
}
function jumpOp(d) {
  const p = S.prog, cur = S.cur < 0 ? -1 : opOf(S.cur);
  const k = Math.max(0, Math.min(p.ops.length - 1, (cur == null || cur < 0 ? (d > 0 ? 0 : 0) : cur + d)));
  go(p.ops[k].start);
}

/* ---------- posizione ---------- */
function renderAxes() {
  $("axes").innerHTML = D.axes.map((a, k) => '<div class="axis"><b>' + a + '</b><span id="ax' + k + '">—</span></div>').join("");
  $("posSub").textContent = D.posSub;
}
function renderPos() {
  const s = S.prog.st[S.cur] || null;
  D.axes.forEach((a, k) => { $("ax" + k).textContent = s ? (s[k] || "—") : "—"; });
  $("pMod").innerHTML = "<i>Modales G:</i> " + (s && s[D.axes.length] ? esc(s[D.axes.length]) : "—");
}

/* ---------- messaggi ---------- */
function setMsg(lvl, text) {
  const m = $("msg"); m.className = "msg " + lvl;
  m.querySelector(".tag").textContent = lvl === "err" ? "Error" : lvl === "warn" ? "Aviso" : "Info";
  $("msgText").textContent = text;
}

/* ---------- pannello spiegazione ---------- */
function sec(cls, title, body) {
  if (!body || (Array.isArray(body) && !body.length)) return "";
  const inner = Array.isArray(body) ? (body.length === 1 ? "<p>" + body[0] + "</p>" : "<ul>" + body.map(b => "<li>" + b + "</li>").join("") + "</ul>") : "<p>" + body + "</p>";
  return '<div class="sec ' + cls + '"><h3>' + title + "</h3>" + inner + "</div>";

if (window.ResizeObserver) new ResizeObserver(() => { if (!anim) drawScene(); }).observe(cv);
else window.addEventListener("resize", drawScene);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (S.mode !== "ciclo") return;
  if (e.key === "PageDown") { e.preventDefault(); step(1); }
  if (e.key === "PageUp") { e.preventDefault(); step(-1); }
});

renderAxes();
loadProg(S.prog);
const start = store.get("mode", "ciclo");
if (hkeys().some(h => h[0] === start) && start !== "ciclo") setMode(start); else render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!anim) drawScene(); });
})();
</script>

</body>
</html>
