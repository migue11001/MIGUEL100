<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Análisis perno torno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: pannello di controllo CNC — barra di stato, riga messaggi, finestre (editor / spiegazione / posizione), softkey verticali a destra e orizzontali in basso. Un unico aspetto chiaro industriale, di proposito. */
:root {
  --frame: #b9c1c8;
  --win: #eef1f3;
  --paper: #ffffff;
  --ink: #1b232a;
  --muted: #5a6670;
  --rule: #98a3ad;
  --head: #34495a;
  --head-ink: #f4f7f9;
  --accent: #0a6a8c;
  --cursor: #f3a712;
  --cursor-ink: #1b1400;
  --key-top: #fbfcfc;
  --key-bot: #c8cfd5;
  --key-on: #ffd27a;
  --ok: #2c7a3a;
  --warn: #b76a00;
  --warn-bg: #fff1d6;
  --err: #c0262d;
  --err-bg: #fde3e3;
  --steel: #c4ccd3;
  --steel-dark: #7d8a95;
  --code-g: #0a5d9e;
  --code-m: #7a3a9a;
  --code-c: #2f7d4a;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--frame);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  padding-inline: 16px;
  padding-block: 16px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.hmi {
  max-width: 1480px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 128px;
  grid-template-areas: "bar bar" "msg msg" "work vkeys" "hkeys hkeys";
  gap: 4px;
  background: #8d979f;
  padding: 4px;
  border: 1px solid #6f7a83;
}

/* barra superiore */
.bar { grid-area: bar; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px; }
.bar > div { background: var(--head); color: var(--head-ink); padding: 6px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.area { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.path { font-family: var(--font-code); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chan { font-weight: 600; letter-spacing: .04em; }
.chan .led { width: 10px; height: 10px; border-radius: 50%; background: #58c26a; box-shadow: 0 0 0 2px #2a3a47; }

/* riga messaggi */
.msg { grid-area: msg; background: var(--paper); border: 1px solid var(--rule); padding: 5px 10px; display: flex; gap: 10px; align-items: baseline; min-height: 34px; font-weight: 500; }
.msg .tag { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 12px; padding: 1px 6px; border-radius: 2px; flex: none; }
.msg.ok .tag { background: #dcefdf; color: var(--ok); }
.msg.warn { background: var(--warn-bg); }
.msg.warn .tag { background: var(--warn); color: #fff; }
.msg.err { background: var(--err-bg); }
.msg.err .tag { background: var(--err); color: #fff; }

/* zona finestre */
.work { grid-area: work; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); grid-template-areas: "editor info" "pos info"; gap: 4px; min-width: 0; }
.win { background: var(--win); border: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; }
.win-h { background: linear-gradient(#4a6274, var(--head)); color: var(--head-ink); padding: 4px 10px; font-weight: 600; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.win-h small { font-weight: 400; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editor { grid-area: editor; }
.info { grid-area: info; }
.pos { grid-area: pos; }

/* editor */
.code { font-family: var(--font-code); font-size: 13.5px; background: var(--paper); margin: 6px; border: 1px solid var(--rule); overflow: auto; max-height: 340px; flex: 1; }
.ln { display: grid; grid-template-columns: 4.2em 1.2em minmax(0, 1fr); align-items: baseline; padding: 1px 6px 1px 0; cursor: pointer; white-space: pre; border-left: 4px solid transparent; }
.ln:hover { background: #eaf3f7; }
.ln .no { color: var(--muted); text-align: right; padding-right: 8px; font-size: 11.5px; user-select: none; }
.ln .flag { font-size: 11px; font-weight: 700; }
.ln.warn .flag { color: var(--warn); }
.ln.err .flag { color: var(--err); }
.ln.mark { background: #e3f0f6; border-left-color: var(--accent); }
.ln.cur { background: var(--cursor); color: var(--cursor-ink); border-left-color: #a46c00; }
.ln.cur .no, .ln.cur .t-n, .ln.cur .t-g, .ln.cur .t-m, .ln.cur .t-c { color: var(--cursor-ink); }
.ln.blank { cursor: default; }
.ln.gap { color: var(--muted); font-style: italic; background: repeating-linear-gradient(135deg, #f4f6f7 0 6px, #eceff1 6px 12px); }
.ln.gap.cur { background: var(--cursor); }
.t-n { color: var(--muted); }
.t-g { color: var(--code-g); font-weight: 600; }
.t-m { color: var(--code-m); font-weight: 600; }
.t-c { color: var(--code-c); font-style: italic; }

/* posizione */
.pos-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 6px 6px 0; }
.axis { background: var(--paper); border: 1px solid var(--rule); padding: 3px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; min-width: 0; }
.axis b { font-size: 12px; color: var(--muted); letter-spacing: .05em; }
.axis span { font-family: var(--font-code); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal { margin: 4px 6px 0; background: var(--paper); border: 1px solid var(--rule); padding: 4px 8px; font-family: var(--font-code); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.modal i { font-style: normal; color: var(--muted); font-family: var(--font-ui); font-size: 12px; }
.scene { margin: 6px; background: var(--paper); border: 1px solid var(--rule); position: relative; }
.scene canvas { display: block; width: 100%; }
.scene .cap { position: absolute; left: 8px; top: 4px; font-size: 12px; color: var(--muted); pointer-events: none; }

/* spiegazione */
.info-body { padding: 10px 14px 14px; overflow: auto; max-height: 720px; display: grid; gap: 12px; align-content: start; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--head-ink); background: var(--accent); padding: 2px 8px; border-radius: 2px; justify-self: start; }
.blk { font-family: var(--font-code); font-size: 15px; background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--cursor); padding: 6px 10px; overflow-x: auto; white-space: pre; }
.sec { display: grid; gap: 4px; }
.sec h3 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sec h3::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.sec p { margin: 0; max-width: 68ch; }
.sec ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 70ch; }
.sec.why h3 { color: var(--accent); }
.sec.why { background: var(--paper); border: 1px solid #bcd6e1; padding: 8px 12px 10px; }
.sec.risk { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 6px 10px; }
.sec.risk.err { border-left-color: var(--err); background: var(--err-bg); }
.sec.risk h3 { color: var(--warn); }
.sec.risk.err h3 { color: var(--err); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--paper); }
th, td { border: 1px solid #c3cbd2; padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: #dfe5ea; font-weight: 600; font-size: 13px; }
td.num, th.num { text-align: right; font-family: var(--font-code); font-variant-numeric: tabular-nums; white-space: nowrap; }
td code, p code, li code { font-family: var(--font-code); font-size: .92em; background: #e8edf1; padding: 0 3px; border-radius: 2px; }
tr.hit td { background: #fff3d1; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #eaf3f7; }
td.bad { color: var(--err); font-weight: 600; }
td.meh { color: var(--warn); font-weight: 600; }

.card { background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--warn); padding: 8px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; }
.card.err { border-left-color: var(--err); }
.card.on { box-shadow: 0 0 0 2px var(--cursor); }
.card h4 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.card h4 .n { font-family: var(--font-code); font-size: 12px; color: var(--muted); }
.card .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; max-width: 70ch; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; background: var(--paper); border: 1px solid var(--rule); padding: 8px 12px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.check label { font-weight: 600; cursor: pointer; }
.check p { grid-column: 2; margin: 0; color: var(--muted); }
.check.done label { text-decoration: line-through; color: var(--ok); }
.note { font-size: 13.5px; color: var(--muted); max-width: 72ch; margin: 0; }

/* softkey */
.vkeys { grid-area: vkeys; display: grid; grid-auto-rows: minmax(54px, auto); gap: 4px; align-content: start; }
.hkeys { grid-area: hkeys; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.sk { background: linear-gradient(var(--key-top), var(--key-bot)); border: 1px solid #77838d; border-radius: 3px; box-shadow: inset 0 1px 0 #fff, 0 1px 0 #6d7881; padding: 6px 8px; min-height: 48px; font-weight: 600; line-height: 1.15; text-align: center; cursor: pointer; }
.sk:hover:not(:disabled) { background: linear-gradient(#ffffff, #d7dde2); }
.sk:active:not(:disabled) { box-shadow: inset 0 2px 3px rgba(0,0,0,.25); }
.sk.on { background: linear-gradient(#fff3d6, var(--key-on)); border-color: #a46c00; }
.sk:disabled { cursor: default; color: transparent; background: linear-gradient(#e3e7ea, #cdd3d8); box-shadow: none; }
a.sk { text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: center; }
.sk small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }

@media (max-width: 1100px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-areas: "editor" "info" "pos"; }
  .code { max-height: 260px; }
  .info-body { max-height: none; }
}
@media (max-width: 760px) {
  body { padding-inline: 8px; }
  .hmi { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "msg" "vkeys" "work" "hkeys"; }
  .bar { grid-template-columns: minmax(0, 1fr) auto; }
  .bar .path-box { grid-column: 1 / -1; order: 3; }
  .vkeys { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: auto; }
  .hkeys { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sk:disabled { display: none; }
  .sk { min-height: 42px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="hmi" id="hmi">
  <header class="bar">
    <div class="area">Programa</div>
    <div class="path-box"><span class="path" id="path"></span></div>
    <div class="chan"><span class="led" aria-hidden="true"></span>CANAL 1 · RESET</div>
  </header>

  <div class="msg ok" id="msg" role="status"><span class="tag">Info</span><span id="msgText"></span></div>

  <main class="work">
    <section class="win editor" aria-label="Editor del programa">
      <div class="win-h"><span>Editor</span><small id="edName"></small></div>
      <div class="code" id="code" tabindex="0" aria-label="Líneas del programa. Usa las flechas para moverte."></div>
    </section>

    <section class="win info" aria-live="polite">
      <div class="win-h"><span id="infoTitle">Explicación</span><small id="infoSub"></small></div>
      <div class="info-body" id="info"></div>
    </section>

    <section class="win pos" aria-label="Posición y estado">
      <div class="win-h"><span>Posición pieza</span><small id="posSub"></small></div>
      <div class="pos-grid" id="axes"></div>
      <div class="modal" id="pMod"><i>Modales G:</i> —</div>
      <div class="scene"><span class="cap" id="cap"></span><canvas id="cv" height="220" aria-label="Dibujo de la trayectoria de la operación y posición de la herramienta"></canvas></div>
    </section>
  </main>

  <nav class="vkeys" id="vkeys" aria-label="Softkeys verticales"></nav>
  <nav class="hkeys" id="hkeys" aria-label="Softkeys horizontales"></nav>
</div>

<script>

const D = {"key":"perno-tornio","board":"tablero-perno-torno.html","axes":["X","Z","C","S HUSILLO","HERR. MOTORIZ.","F","T","HUSILLO","REFRIG."],"posSub":"X en diámetro · mm","zLabel":"Z","info":{"pct":{"que":"Marca de inicio o de fin del archivo.","pq":["El control solo lee lo que está entre los dos %."]},"l3":{"params":[["G0","Rápido."],["G18","Plano XZ, el del torno."],["G21","Milímetros."],["G40","Sin compensación del radio de punta."],["G54","Cero pieza."],["G80","Ningún ciclo fijo."],["G99","Avance en mm/vuelta."],["M110","Función de la máquina (ver abajo)."]],"que":"Línea de seguridad: pone la máquina en un estado conocido antes de mover cualquier eje.","pq":["G99 es el modo normal del torno: el avance es en milímetros por cada vuelta de la pieza, así la viruta tiene siempre el mismo espesor aunque cambien las revoluciones.","Código específico de la máquina: el significado aquí se deduce de cómo lo usa el programa. Confírmalo en el manual del torno. M110 aparece al inicio y al final de cada torneado: probablemente desactiva un modo (eje C o husillo en posicionamiento)."]},"m24":{"que":"Código M de la máquina al arrancar el programa (M24; al final está M25).","pq":["Código específico de la máquina: el significado aquí se deduce de cómo lo usa el programa. Confírmalo en el manual del torno."]},"sub":{"que":"Rápido en coordenadas de máquina (G53): el contrahusillo (eje B) vuelve a su posición de reposo.","pq":["En un torno con contrahusillo, B es el eje que lo mueve. Hay que alejarlo antes de mover la torreta, para no chocar.","El post lo hace al inicio de cada operación."]},"g28uv":{"que":"Vuelta a la referencia de máquina en X e Y (U y V = movimientos incrementales, cero = directamente).","pq":["En el torno U, V y W son las versiones incrementales de X, Y y Z. G28 U0. V0. quiere decir «ve a la referencia en X e Y sin puntos intermedios».","Primero X (la torreta se aleja del eje de la pieza), luego Z en la línea siguiente: siempre se sale primero en X."]},"g28w":{"que":"Vuelta a la referencia de máquina en Z.","pq":["La torreta retrocede en Z, lejos de la pieza, después de haber salido ya en X."]},"m90":{"que":"M90: desbloquea el freno del eje C (deducido: se usa antes de mover C o de hacer girar el husillo).","pq":["Código específico de la máquina: el significado aquí se deduce de cómo lo usa el programa. Confírmalo en el manual del torno."]},"m89":{"que":"M89: bloquea el freno del eje C (deducido).","pq":["Código específico de la máquina: el significado aquí se deduce de cómo lo usa el programa. Confírmalo en el manual del torno."]},"g54":{"que":"Activa el cero pieza G54: Z0 en la cara de la pieza, X0 en el eje.","pq":["En el torno X0 es siempre el eje de rotación: las cotas X son diámetros."]},"turnmode":{"que":"Avance mm/vuelta, plano XZ y M34: modo torneado (deducido: el husillo gira como husillo, no como eje C).","pq":["Código específico de la máquina: el significado aquí se deduce de cómo lo usa el programa. Confírmalo en el manual del torno.","En el fresado con herramienta motorizada el post escribe en cambio G98 G18 M35: mm/min y husillo como eje C."]},"millmode":{"que":"Avance mm/min (G98), plano XZ y M35: modo eje C (deducido) para el fresado con herramienta motorizada.","pq":["La pieza ya no gira: es el husillo el que la posiciona como un eje rotativo (C).","El avance pasa a mm/min porque la referencia ahora es la herramienta que gira, no la pieza.","Código específico de la máquina: el significado aquí se deduce de cómo lo usa el programa. Confírmalo en el manual del torno."]},"m8":{"que":"Abre el refrigerante.","pq":["Enfría la plaquita y aleja la viruta de la zona de corte."]},"g96":{"que":"Velocidad de corte constante: 107 m/min. Desde aquí las revoluciones cambian solas con el diámetro.","pq":["La plaquita trabaja siempre a la misma velocidad de corte: desgaste uniforme y el mismo acabado del borde al centro."]},"m1":{"que":"Parada opcional.","pq":["Con Optional Stop activado la máquina se para: momento para medir los diámetros antes del fresado."]},"m5p11":{"que":"Para el husillo principal (P11).","pq":["Para fresar con la herramienta motorizada la pieza debe estar quieta: el husillo se convierte en un eje C."]},"g28h":{"que":"Vuelta a cero del eje C (H = incremental de C).","pq":["El husillo se orienta en su referencia: desde aquí las cotas C son absolutas."]},"g121":{"que":"Activa la interpolación polar (G12.1).","pq":["El control transforma la rotación de la pieza (C) y el movimiento radial (X) en un plano cartesiano: se programa como en una fresadora, con X y C como si fueran X e Y.","En este modo X sigue en diámetro y C está en milímetros sobre la cara."]},"g131":{"que":"Desactiva la interpolación polar.","pq":["Se vuelve a las coordenadas normales del torno antes de alejar la torreta."]},"m5p12":{"que":"Para la herramienta motorizada.","pq":["Antes de volver a la referencia."]},"m25":{"que":"Código M de la máquina al final del programa (al inicio estaba M24).","pq":["Código específico de la máquina: el significado aquí se deduce de cómo lo usa el programa. Confírmalo en el manual del torno."]},"m111":{"que":"Código M de la máquina antes del final (en pareja con M110).","pq":["Código específico de la máquina: el significado aquí se deduce de cómo lo usa el programa. Confírmalo en el manual del torno."]},"m30":{"que":"Fin de programa y vuelta al inicio.","pq":["Para husillo, herramienta motorizada y refrigerante."]},"g97back":{"que":"Vuelve a revoluciones fijas antes de cambiar de operación.","pq":["Así, durante los rápidos o si el programa se para aquí, las revoluciones no cambian con cada movimiento en X."]},"oname":{"que":"Número de programa: O2222.","pq":["La versión Siemens de la misma pieza es un archivo con nombre (TORNO_SIEMENS_ADAPTATIVO.MPF) en lugar de un número."]},"g50":{"que":"Limita el husillo a 5.000 rpm.","pq":["Con G96 las revoluciones crecen hacia el centro: n = 1000·107 / (π·D). Por debajo de Ø6,8 actúa el límite.","En una barra Ø40 el límite de 5.000 es razonable, pero hay que compararlo con el del plato."]},"t0202":{"que":"Torreta en la herramienta 2, corrector 2: herramienta exterior.","pq":["Hace el refrentado y el desbaste del perfil."]},"s566":{"que":"Husillo principal a 566 rpm fijas (P11) para la aproximación.","pq":["566 rpm son las que da G96 S107 a unos Ø60, el diámetro de partida."]},"fastf":{"lvl":"warn","que":"Aproximación en G1 a 17,669 mm/vuelta hasta Ø50, Z-0,5.","pq":["Es el alto avance de Fusion convertido a mm/vuelta: a unas 680 rpm son 12 m/min.","En la versión Siemens la misma línea tiene F7.362: Fusion usó revoluciones de referencia distintas."],"riesgo":"Esta línea no obedece al override de rápidos."},"x40":{"que":"Avance de trabajo 0,127 mm/vuelta, bajada a Ø40 (borde del bruto).","pq":["Desde aquí el refrentado corta."]},"facecut":{"que":"Refrentado hasta X-1,587, pasado el centro.","pq":["El primer nivel quita 0,5 mm (Z-0,5), los otros dos 3 mm (Z-3,5 y Z-6,5): la cara acabada está en Z-6,5."]},"facestep":{"que":"Rápido al siguiente nivel de refrentado, 3 mm más adentro.","pq":["El cero Z está en la cara del bruto: la pieza acabada empieza en Z-6,5."]},"t0801":{"que":"Torreta en la herramienta 8: broca motorizada axial.","pq":["Taladra paralela al eje Z, fuera de centro, con el husillo parado."]},"s44":{"lvl":"err","que":"Arranca la broca motorizada (P12) a 44 rpm.","pq":["P12 = motor de las herramientas motorizadas."],"riesgo":"44 rpm son 1–3 m/min para una broca pequeña: la broca no corta, frota. Valores normales: miles de rpm."},"c150":{"que":"Rápido sobre el agujero: X25 (radio 12,5) y C-150°.","pq":["El agujero está fuera de centro: el eje C gira la pieza hasta el ángulo correcto, X da la distancia al eje.","En Siemens la misma posición es X12.5 (radio, DIAMOF) y SP1=210 (= -150°)."],"riesgo":"A radio 12,5 dentro de un diámetro acabado Ø30,2 (radio 15,1): la pared es de 2,6 mm menos el radio de la broca."},"f2":{"lvl":"err","que":"Primer tramo de taladrado hasta Z-8 a 2 mm/min.","pq":["G98 está activo: F2. son 2 milímetros por minuto."],"riesgo":"24,5 mm de agujero en pasos de 0,5 mm a 2 mm/min: más de una hora para un agujero (64 minutos estimados)."},"chipbreak":{"que":"Retroceso de 0,1 mm en rápido: rompevirutas.","pq":["Cada 0,5 mm la broca se para y retrocede un poco para romper la viruta."]},"rough":{"que":"Primera pasada de desbaste: Ø36,733 hasta Z-33,363.","pq":["Tres pasadas (Ø36,7, Ø33,5, Ø30,2) de unos 1,6 mm por lado."]},"r30":{"que":"Última pasada: Ø30,2 hasta Z-33,363, el diámetro del perno.","pq":["El desbaste llega directamente a medida: en este programa no hay acabado del perfil."]},"frontr":{"que":"Radio en la arista de entrada del perno.","pq":["Quita la arista viva en la cara: de Ø29,4 a Ø30,2 con un pequeño arco."]},"t0901":{"que":"Torreta en la herramienta 9: broca motorizada para el agujero central.","pq":["Agujero en el eje (X0) con el husillo parado."]},"s40":{"lvl":"warn","que":"Broca motorizada a 40 rpm.","pq":["El mismo problema que Broca1."],"riesgo":"40 rpm: la broca no corta. Un agujero en el eje se hace mejor con el husillo principal girando y la broca quieta."},"c0clamp":{"que":"Desbloquea C, lleva C a 0°, bloquea C.","pq":["Para taladrar en el eje el ángulo no importa, pero la pieza tiene que estar quieta: el freno la sujeta."]},"g83":{"lvl":"warn","params":[["G83","Taladrado profundo por pasos."],["Z-12.5","Fondo del agujero."],["R-9.5","En el torno Fanuc R es incremental desde el punto inicial (Z5): el punto R está en Z-4,5."],["Q2250","Paso de 2,25 mm (en micras)."],["F3.","3 mm/min (G98)."]],"que":"Ciclo de taladrado profundo en el centro hasta Z-12,5.","pq":["El agujero central sirve de pretaladro para el desbaste adaptativo de la cajera."],"riesgo":"3 mm/min y 40 rpm: taladrado lentísimo y sin corte."},"m138":{"que":"M138 antes de la herramienta motorizada de alta velocidad (M139 al final).","pq":["Código específico de la máquina: el significado aquí se deduce de cómo lo usa el programa. Confírmalo en el manual del torno."]},"s40000":{"lvl":"err","que":"Herramienta motorizada a 40.000 rpm.","pq":["En la versión Siemens la misma operación tiene S2=5000."],"riesgo":"Las herramientas motorizadas de un torno suelen llegar a 4.000–6.000 rpm. 40.000 está fuera de límite: alarma o revoluciones limitadas, con un avance (3.300 mm/min) calculado para 40.000 rpm."},"polar1":{"que":"Primer movimiento en interpolación polar a 3.300 mm/min.","pq":["Desde aquí la fresa mecaniza la cajera en el centro de la cara."]},"s_head":{"que":"Cabecera: nombre del programa para el control Siemens (_N_…_MPF = programa principal).","pq":["En Siemens los programas tienen nombre, no número. MPF = Main Program File."]},"s_wp":{"params":[["\"CYLINDER\"","Bruto cilíndrico."],["192","Código del tipo de definición (del post)."],["0 / -40","De Z0 a Z-40: 40 mm de largo."],["-39","Cota de tronzado / pieza (del post)."],["40","Diámetro: Ø40."]],"que":"Define el bruto para la simulación del control: un cilindro Ø40 de 40 mm de largo.","pq":["El control Siemens puede simular el programa antes de ejecutarlo: WORKPIECE le dice cómo es el bruto."]},"s_n11":{"que":"Avance mm/min (G94) y plano XZ (G18) como estado inicial.","pq":["Luego cada operación fija su modo (G95 para tornear)."]},"s_g71":{"que":"G71 en Siemens = unidades métricas (milímetros).","pq":["Atención: en el torno Fanuc G71 es el ciclo de desbaste, en Okuma el ciclo de roscado (ver la carpeta de la rosca M20). En Siemens es solo «milímetros», como G21 en Fanuc."]},"s_lims":{"que":"Límite general de revoluciones: 6.000 (LIMS).","pq":["Es el equivalente Siemens del G50 S de Fanuc."]},"s_lims1":{"que":"Límite de revoluciones del husillo 1: 5.000.","pq":["Como G50 S5000 en la versión Fanuc. [1] = husillo principal."]},"s_g53x":{"que":"Rápido en coordenadas de máquina a X250, con corrector desactivado (D0).","pq":["Como el G28 U0 de Fanuc: la torreta sale en X lejos de la pieza. D0 evita que el corrector desplace la posición."]},"s_g53yz":{"que":"Coordenadas de máquina: Y0 y luego Z300.","pq":["Primero X, luego Y al centro, luego Z atrás: siempre salir primero en X."]},"s_msg":{"que":"MSG: muestra el nombre de la operación en la pantalla del control.","pq":["Es el equivalente del comentario (NOMBRE) de Fanuc, pero el operario lo ve en la línea de mensajes durante la ejecución."]},"s_tool":{"que":"Llama a la herramienta y su filo D1.","pq":["En Siemens T es la herramienta y D es el corrector (filo). El cambio se hace con M6 en la línea siguiente."]},"s_m6":{"que":"Ejecuta el cambio de herramienta.","pq":["En este post el cambio está separado de la llamada T."]},"s_diamon":{"que":"DIAMON: X en diámetro.","pq":["Para tornear X es el diámetro, como en el plano."]},"s_diamof":{"que":"DIAMOF: X en radio.","pq":["Para las motorizadas el post pasa a radio: X12.5 aquí es el mismo punto que X25 en la versión Fanuc."]},"s_setms1":{"que":"SETMS(1): el husillo principal es el husillo «master».","pq":["S, M3, G96, G95 se refieren al husillo 1 hasta que se cambie."]},"s_setms2":{"que":"SETMS(2): el husillo 2 (herramientas motorizadas) pasa a ser el master.","pq":["Desde aquí S y M3/M5 sin número mandan sobre la motorizada. Es el equivalente de P12 en Fanuc."]},"s_s1":{"que":"Husillo 1 a 566 rpm fijas, horario (M1=3).","pq":["S1= y M1= indican el husillo 1. No confundas M1=3 (husillo 1 horario) con M1 solo (parada opcional)."]},"s_n23":{"que":"Plano XZ, cotas absolutas, avance mm/vuelta (G95).","pq":["G95 en Siemens = G99 en torno Fanuc: mm por vuelta."]},"s_d2":{"lvl":"warn","que":"Activa el filo D2 de la herramienta T2.","pq":["El post llamó T2 D1 en el cambio y aquí pasa a D2: en la versión Fanuc la herramienta es T0202 (corrector 2)."],"riesgo":"D2 tiene que existir en la tabla de herramientas de T2, si no da alarma."},"s_n29":{"que":"Rápido a Z5 y Ø60 en la misma línea.","pq":["Movimiento en diagonal: está bien porque delante de la pieza no hay nada."]},"s_g96":{"que":"Velocidad de corte constante 107 m/min en el husillo 1.","pq":["Igual que en la versión Fanuc."]},"s_fast":{"lvl":"warn","que":"Aproximación en G1 a 7,362 mm/vuelta hasta Ø50, Z-0,5.","pq":["Misma línea que en la versión Fanuc, pero con F7.362 en lugar de F17.669."]},"s_dafter":{"que":"Reactiva el corrector D tras el movimiento en coordenadas de máquina.","pq":["El post lo vuelve a poner tras cada G53 … D0."]},"s_m15":{"que":"Para el husillo 1 (M1=5).","pq":["Fin del torneado: la próxima herramienta es motorizada."]},"s_s44":{"lvl":"err","que":"Herramienta motorizada (husillo 2) a 44 rpm.","pq":["Como en la versión Fanuc."],"riesgo":"44 rpm: la broca no corta."},"s_sp1":{"que":"Posición del agujero: X12,5 (radio), Y0, y husillo 1 posicionado a 210° (SP1=210).","pq":["SP1 posiciona el husillo como un eje: 210° = -150°, el mismo ángulo que la versión Fanuc."]},"s_f2":{"lvl":"err","que":"Fija el avance a 2 mm/min (G94).","riesgo":"Una hora para un agujero, como en la versión Fanuc."},"s_m25stop":{"que":"Para la motorizada (M2=5).","pq":["M2=5 = husillo 2 stop. No confundir con M2 (fin de programa)."]},"s_s40":{"lvl":"warn","que":"Motorizada a 40 rpm para el taladrado central.","riesgo":"Demasiado lento para cortar."},"s_sp0":{"que":"Posiciona el husillo 1 a 0°.","pq":["Para el agujero central el ángulo no importa, pero el husillo tiene que estar parado en posición."]},"s_cycle83":{"params":[["5","RTP: plano de retorno Z5."],["-8.5","RFP: plano de referencia (inicio del agujero)."],["5","SDIS: distancia de seguridad sobre RFP."],["-12.5","DP: profundidad final."],["-10","FDEP: primera profundidad."],["1 (FRF)","Factor de avance."],["0 (VARI)","Rompevirutas (0) en lugar de evacuación completa (1)."],["1.5","Profundidad mínima de los pasos."]],"que":"Ciclo Siemens de taladrado profundo, llamado de forma modal (MCALL).","pq":["MCALL hace repetir el ciclo en cada posición escrita después (aquí solo X0 Y0).","Es el equivalente del G83 de la versión Fanuc."]},"s_mcallpos":{"que":"Posición del agujero: aquí se ejecuta el ciclo modal.","pq":["Con MCALL activo, cada posición es un agujero."]},"s_mcalloff":{"que":"MCALL sin ciclo: anula la llamada modal.","pq":["Como G80 en Fanuc: sin él, el próximo movimiento haría otro agujero."]},"s_s5000":{"que":"Motorizada a 5.000 rpm para el desbaste adaptativo.","pq":["Valor realista para una motorizada. La versión Fanuc pide 40.000 rpm: las dos versiones no se generaron con los mismos datos."]},"s_transmit":{"que":"TRANSMIT(1): activa la transformación para fresar sobre la cara.","pq":["Como G12.1 en Fanuc: X e Y son coordenadas cartesianas sobre la cara, el control las traduce en movimientos de X y C.","Aquí X e Y están en radio (DIAMOF)."]},"s_helixcr":{"que":"Hélice de bajada: arcos de radio 0,97 mm (CR=) bajando unos 0,05 mm cada vez.","pq":["En Siemens un arco se puede escribir con el radio (CR=) en lugar del centro (I, J).","Hélice muy cerrada: la fresa baja casi en vertical."]},"s_s300":{"lvl":"err","que":"Motorizada a 300 rpm para el acabado.","riesgo":"300 rpm y avance 2 mm/min: ver la línea del primer movimiento de acabado."},"s_finf2":{"lvl":"err","que":"Inicio del acabado a 2 mm/min.","pq":["Casi todo el acabado (26.000 líneas) está a F2 o F0.67."],"riesgo":"Tiempo estimado del acabado: unas 11 horas. En Fusion el avance se puso en una unidad equivocada (quizá mm/vuelta o mm/diente)."},"s_trafoof":{"que":"TRAFOOF: desactiva la transformación TRANSMIT.","pq":["Como G13.1 en Fanuc. Justo después se vuelve a DIAMON."]}},"errors":[{"lvl":"err","t":"Agujero fuera de centro a 44 rpm y 2 mm/min","prog":"f","pq":"La broca motorizada gira a 44 rpm y avanza a 2 mm/min (G98). La broca no corta, frota; y el agujero de 24,5 mm dura más de una hora. Las dos versiones (Fanuc y Siemens) tienen el mismo error.","sol":"En Fusion fija revoluciones y avance de la broca T8 (por ejemplo Vc 60–80 m/min y 0,05–0,1 mm/vuelta, según la broca) y revisa la unidad del avance.","lines":[51,56]},{"lvl":"err","t":"Motorizada a 40.000 rpm (solo Fanuc)","prog":"f","pq":"El desbaste adaptativo Fanuc pide S40000 a la herramienta motorizada. Una motorizada de torno suele llegar a 4.000–6.000 rpm. La versión Siemens de la misma operación tiene S2=5000.","sol":"Regenera la versión Fanuc con los mismos datos de herramienta que la versión Siemens (o con los límites de tu máquina).","lines":[470]},{"lvl":"err","t":"Acabado a 2 mm/min: 11 horas (solo Siemens)","prog":"s","pq":"El acabado de la cajera tiene S2=300 y casi todos los movimientos a F2 o F0.67 mm/min. Son más de 26.000 líneas: el tiempo estimado es de unas 11 horas. Valores tan bajos suelen venir de una unidad equivocada (mm/vuelta o mm/diente escritos como mm/min).","sol":"En Fusion corrige revoluciones y avance del acabado (por ejemplo 4.000–5.000 rpm y algunos cientos de mm/min).","lines":[1278,1288]},{"lvl":"warn","t":"Agujero central a 40 rpm y 3 mm/min","prog":"f","pq":"El mismo problema que Broca1, a menor escala: 8 mm de agujero a 3 mm/min. Además un agujero en el eje se hace mejor con el husillo principal girando y la broca quieta: más revoluciones y más rigidez.","sol":"Usa una broca estática en el eje con G97 y revoluciones del husillo principal, o corrige las revoluciones de la motorizada.","lines":[441,449]},{"lvl":"warn","t":"Pared delgada cerca del agujero fuera de centro","prog":"f","pq":"El agujero está a radio 12,5 y el perno acabado es Ø30,2 (radio 15,1): quedan 2,6 mm menos el radio de la broca. Con una broca de Ø5,2 o más el agujero rompe el diámetro exterior. El diámetro de la broca no está escrito en el programa.","sol":"Comprueba el diámetro de la broca T8 en el modelo de Fusion.","lines":[53,411]},{"lvl":"warn","t":"Las dos versiones no son el mismo programa","prog":"s","pq":"Refrentado, agujero fuera de centro y desbaste son iguales. Pero la cajera se hace con herramientas distintas (T10 frente a T14), revoluciones distintas (40.000 frente a 5.000), avances distintos; y la versión Siemens tiene además el acabado. La pieza que sale no es la mis   const cx = Math.max(10, Math.min(W - 30, x)), cy = Math.max(14, Math.min(H - 8, y));
  ctx.fillStyle = css("--cursor"); ctx.strokeStyle = "#5c4100"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 9, cy); ctx.lineTo(cx + 9, cy); ctx.moveTo(cx, cy - 9); ctx.lineTo(cx, cy + 9); ctx.stroke();
  if (!inside || label) {
    ctx.fillStyle = css("--ink"); ctx.font = "600 11px " + css("--font-ui");
    const t = label || "fuera de vista ↗";
    ctx.fillText(t, Math.min(cx + 10, W - ctx.measureText(t).width - 4), Math.max(cy - 8, 12));
  }
}
function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
function curOp() {
  let i = S.cur; if (i < 0) { const m = [...S.marks][0]; i = m == null ? -1 : m; }
  const oi = i >= 0 ? opOf(i) : null;
  return oi != null && oi >= 0 ? S.prog.ops[oi] : null;
}
function drawScene() {
  if (anim) return;
  const op = curOp();
  const v = viewOf(op) || D.views[D.progs[0].ops[0].view];
  const F = frame(v);
  drawBase(F, v, op);
  $("cap").textContent = (op ? op.name + " · " : "") + v.cap;
  const t = S.cur >= 0 ? S.prog.tp[S.cur] : null;
  if (t && t[0] != null) {
    if (t[3] != null) {
      ctx.strokeStyle = css("--cursor"); ctx.lineWidth = 2.5; ctx.setLineDash(t[5] ? [5, 4] : []);
      ctx.beginPath(); ctx.moveTo(F.sx(t[3]), F.sy(t[4])); ctx.lineTo(F.sx(t[0]), F.sy(t[1])); ctx.stroke(); ctx.setLineDash([]);
    }
    drawTool(F, t[0], t[1], null);
    zGauge(t[2], op);
  } else if (S.cur >= 0) {
    ctx.fillStyle = css("--muted"); ctx.font = "12px " + css("--font-ui");
    ctx.fillText("Posición de la herramienta aún no definida", 40, 40);
  }
}
function startAnim() {
  const op = curOp(); if (!op || op.pts.length < 6) return;
  const v = viewOf(op);
  const pts = op.pts, n = pts.length / 3;
  const dur = Math.min(14000, Math.max(4000, n * 6));
  if (reduce) { stopAnim(); return; }
  let t0 = null;
  const F = frame(v);
  const tick = ts => {
    if (t0 == null) t0 = ts;
    const f = ((ts - t0) % dur) / dur, j = Math.floor(f * (n - 1)) * 3;
    drawBase(F, v, op);
    ctx.strokeStyle = css("--cursor"); ctx.lineWidth = 2;
    ctx.beginPath(); for (let q = Math.max(0, j - 90); q <= j; q += 3) { if (q === Math.max(0, j - 90)) ctx.moveTo(F.sx(pts[q]), F.sy(pts[q + 1])); else ctx.lineTo(F.sx(pts[q]), F.sy(pts[q + 1])); } ctx.stroke();
    drawTool(F, pts[j], pts[j + 1], "simulación " + Math.round(f * 100) + " %");
    anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
  renderKeys();
}

/* ---------- render ---------- */
function render() { renderKeys(); renderCode(); renderPos(); renderInfo(); drawScene(); }
if (window.ResizeObserver) new ResizeObserver(() => { if (!anim) drawScene(); }).observe(cv);
else window.addEventListener("resize", drawScene);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (S.mode !== "ciclo") return;
  if (e.key === "PageDown") { e.preventDefault(); step(1); }
  if (e.key === "PageUp") { e.preventDefault(); step(-1); }
});

renderAxes();
loadProg(S.prog);
const start = store.get("mode", "ciclo");
if (hkeys().some(h => h[0] === start) && start !== "ciclo") setMode(start); else render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!anim) drawScene(); });
})();
</script>
