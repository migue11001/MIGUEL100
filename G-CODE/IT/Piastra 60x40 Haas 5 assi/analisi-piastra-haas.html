<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analisi piastra Haas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: pannello di controllo CNC — barra di stato, riga messaggi, finestre (editor / spiegazione / posizione), softkey verticali a destra e orizzontali in basso. Un unico aspetto chiaro industriale, di proposito. */
:root {
  --frame: #b9c1c8;
  --win: #eef1f3;
  --paper: #ffffff;
  --ink: #1b232a;
  --muted: #5a6670;
  --rule: #98a3ad;
  --head: #34495a;
  --head-ink: #f4f7f9;
  --accent: #0a6a8c;
  --cursor: #f3a712;
  --cursor-ink: #1b1400;
  --key-top: #fbfcfc;
  --key-bot: #c8cfd5;
  --key-on: #ffd27a;
  --ok: #2c7a3a;
  --warn: #b76a00;
  --warn-bg: #fff1d6;
  --err: #c0262d;
  --err-bg: #fde3e3;
  --steel: #c4ccd3;
  --steel-dark: #7d8a95;
  --code-g: #0a5d9e;
  --code-m: #7a3a9a;
  --code-c: #2f7d4a;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --font-code: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--frame);
  color: var(--ink);
  font: 15px/1.45 var(--font-ui);
  padding-inline: 16px;
  padding-block: 16px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.hmi {
  max-width: 1480px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 128px;
  grid-template-areas: "bar bar" "msg msg" "work vkeys" "hkeys hkeys";
  gap: 4px;
  background: #8d979f;
  padding: 4px;
  border: 1px solid #6f7a83;
}

/* barra superiore */
.bar { grid-area: bar; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px; }
.bar > div { background: var(--head); color: var(--head-ink); padding: 6px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.area { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.path { font-family: var(--font-code); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chan { font-weight: 600; letter-spacing: .04em; }
.chan .led { width: 10px; height: 10px; border-radius: 50%; background: #58c26a; box-shadow: 0 0 0 2px #2a3a47; }

/* riga messaggi */
.msg { grid-area: msg; background: var(--paper); border: 1px solid var(--rule); padding: 5px 10px; display: flex; gap: 10px; align-items: baseline; min-height: 34px; font-weight: 500; }
.msg .tag { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 12px; padding: 1px 6px; border-radius: 2px; flex: none; }
.msg.ok .tag { background: #dcefdf; color: var(--ok); }
.msg.warn { background: var(--warn-bg); }
.msg.warn .tag { background: var(--warn); color: #fff; }
.msg.err { background: var(--err-bg); }
.msg.err .tag { background: var(--err); color: #fff; }

/* zona finestre */
.work { grid-area: work; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); grid-template-areas: "editor info" "pos info"; gap: 4px; min-width: 0; }
.win { background: var(--win); border: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; }
.win-h { background: linear-gradient(#4a6274, var(--head)); color: var(--head-ink); padding: 4px 10px; font-weight: 600; letter-spacing: .03em; display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.win-h small { font-weight: 400; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editor { grid-area: editor; }
.info { grid-area: info; }
.pos { grid-area: pos; }

/* editor */
.code { font-family: var(--font-code); font-size: 13.5px; background: var(--paper); margin: 6px; border: 1px solid var(--rule); overflow: auto; max-height: 340px; flex: 1; }
.ln { display: grid; grid-template-columns: 4.2em 1.2em minmax(0, 1fr); align-items: baseline; padding: 1px 6px 1px 0; cursor: pointer; white-space: pre; border-left: 4px solid transparent; }
.ln:hover { background: #eaf3f7; }
.ln .no { color: var(--muted); text-align: right; padding-right: 8px; font-size: 11.5px; user-select: none; }
.ln .flag { font-size: 11px; font-weight: 700; }
.ln.warn .flag { color: var(--warn); }
.ln.err .flag { color: var(--err); }
.ln.mark { background: #e3f0f6; border-left-color: var(--accent); }
.ln.cur { background: var(--cursor); color: var(--cursor-ink); border-left-color: #a46c00; }
.ln.cur .no, .ln.cur .t-n, .ln.cur .t-g, .ln.cur .t-m, .ln.cur .t-c { color: var(--cursor-ink); }
.ln.blank { cursor: default; }
.ln.gap { color: var(--muted); font-style: italic; background: repeating-linear-gradient(135deg, #f4f6f7 0 6px, #eceff1 6px 12px); }
.ln.gap.cur { background: var(--cursor); }
.t-n { color: var(--muted); }
.t-g { color: var(--code-g); font-weight: 600; }
.t-m { color: var(--code-m); font-weight: 600; }
.t-c { color: var(--code-c); font-style: italic; }

/* posizione */
.pos-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin: 6px 6px 0; }
.axis { background: var(--paper); border: 1px solid var(--rule); padding: 3px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; min-width: 0; }
.axis b { font-size: 12px; color: var(--muted); letter-spacing: .05em; }
.axis span { font-family: var(--font-code); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal { margin: 4px 6px 0; background: var(--paper); border: 1px solid var(--rule); padding: 4px 8px; font-family: var(--font-code); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.modal i { font-style: normal; color: var(--muted); font-family: var(--font-ui); font-size: 12px; }
.scene { margin: 6px; background: var(--paper); border: 1px solid var(--rule); position: relative; }
.scene canvas { display: block; width: 100%; }
.scene .cap { position: absolute; left: 8px; top: 4px; font-size: 12px; color: var(--muted); pointer-events: none; }

/* spiegazione */
.info-body { padding: 10px 14px 14px; overflow: auto; max-height: 720px; display: grid; gap: 12px; align-content: start; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--head-ink); background: var(--accent); padding: 2px 8px; border-radius: 2px; justify-self: start; }
.blk { font-family: var(--font-code); font-size: 15px; background: var(--paper); border: 1px solid var(--rule); border-left: 4px solid var(--cursor); padding: 6px 10px; overflow-x: auto; white-space: pre; }
.sec { display: grid; gap: 4px; }
.sec h3 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; display: flex; align-items: center; gap: 8px; }
.sec h3::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.sec p { margin: 0; max-width: 68ch; }
.sec ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; max-width: 70ch; }
.sec.why h3 { color: var(--accent); }
.sec.why { background: var(--paper); border: 1px solid #bcd6e1; padding: 8px 12px 10px; }
.sec.risk { border-left: 4px solid var(--warn); background: var(--warn-bg); padding: 6px 10px; }
.sec.risk.err { border-left-color: var(--err); background: var(--err-bg); }
.sec.risk h3 { color: var(--warn); }
.sec.risk.err h3 { color: var(--err); }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--paper); }
th, td { border: 1px solid #c3cbd2; padding: 4px 8px; text-align: left; vertical-align: top; }
th { background: #dfe5ea; font-weight: 600; font-size: 13px; }
td.num, th.num { text-align: right; font-family: var(--font-code); font-variant-numeric: tabular-nums; white-space: nowrap; }
td code, p code, li code { font-family: var(--font-code); font-size: .92em; background: #e8edf1; padding: 0 3px; border-radius: 2px; }
tr.hit td { background: #fff3d1; }
tr.click { cursor: pointer; }
tr.click:hover td { background: #eaf3f7; }
td.bad { color: var(--err); font-weight: 600; }
td.meh { color: var(--warn); font-weight: 600; }

.card { background: var(--paper); border: 1px solid var(--rule); border-left: 5px solid var(--warn); padding: 8px 12px; display: grid; gap: 6px; cursor: pointer; text-align: left; }
.card.err { border-left-color: var(--err); }
.card.on { box-shadow: 0 0 0 2px var(--cursor); }
.card h4 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.card h4 .n { font-family: var(--font-code); font-size: 12px; color: var(--muted); }
.card .lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; max-width: 70ch; }
.check { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; background: var(--paper); border: 1px solid var(--rule); padding: 8px 12px; }
.check input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--ok); }
.check label { font-weight: 600; cursor: pointer; }
.check p { grid-column: 2; margin: 0; color: var(--muted); }
.check.done label { text-decoration: line-through; color: var(--ok); }
.note { font-size: 13.5px; color: var(--muted); max-width: 72ch; margin: 0; }

/* softkey */
.vkeys { grid-area: vkeys; display: grid; grid-auto-rows: minmax(54px, auto); gap: 4px; align-content: start; }
.hkeys { grid-area: hkeys; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.sk { background: linear-gradient(var(--key-top), var(--key-bot)); border: 1px solid #77838d; border-radius: 3px; box-shadow: inset 0 1px 0 #fff, 0 1px 0 #6d7881; padding: 6px 8px; min-height: 48px; font-weight: 600; line-height: 1.15; text-align: center; cursor: pointer; }
.sk:hover:not(:disabled) { background: linear-gradient(#ffffff, #d7dde2); }
.sk:active:not(:disabled) { box-shadow: inset 0 2px 3px rgba(0,0,0,.25); }
.sk.on { background: linear-gradient(#fff3d6, var(--key-on)); border-color: #a46c00; }
.sk:disabled { cursor: default; color: transparent; background: linear-gradient(#e3e7ea, #cdd3d8); box-shadow: none; }
a.sk { text-decoration: none; color: inherit; display: flex; flex-direction: column; justify-content: center; }
.sk small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }

@media (max-width: 1100px) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-areas: "editor" "info" "pos"; }
  .code { max-height: 260px; }
  .info-body { max-height: none; }
}
@media (max-width: 760px) {
  body { padding-inline: 8px; }
  .hmi { grid-template-columns: minmax(0, 1fr); grid-template-areas: "bar" "msg" "vkeys" "work" "hkeys"; }
  .bar { grid-template-columns: minmax(0, 1fr) auto; }
  .bar .path-box { grid-column: 1 / -1; order: 3; }
  .vkeys { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: auto; }
  .hkeys { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .sk:disabled { display: none; }
  .sk { min-height: 42px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="hmi" id="hmi">
  <header class="bar">
    <div class="area">Programma</div>
    <div class="path-box"><span class="path" id="path"></span></div>
    <div class="chan"><span class="led" aria-hidden="true"></span>CANALE 1 · RESET</div>
  </header>

  <div class="msg ok" id="msg" role="status"><span class="tag">Info</span><span id="msgText"></span></div>

  <main class="work">
    <section class="win editor" aria-label="Editor del programma">
      <div class="win-h"><span>Editor</span><small id="edName"></small></div>
      <div class="code" id="code" tabindex="0" aria-label="Righe del programma. Usa le frecce per muoverti."></div>
    </section>

    <section class="win info" aria-live="polite">
      <div class="win-h"><span id="infoTitle">Spiegazione</span><small id="infoSub"></small></div>
      <div class="info-body" id="info"></div>
    </section>

    <section class="win pos" aria-label="Posizione e stato">
      <div class="win-h"><span>Posizione pezzo</span><small id="posSub"></small></div>
      <div class="pos-grid" id="axes"></div>
      <div class="modal" id="pMod"><i>Modali G:</i> —</div>
      <div class="scene"><span class="cap" id="cap"></span><canvas id="cv" height="220" aria-label="Disegno del percorso utensile dell'operazione e posizione dell'utensile"></canvas></div>
    </section>
  </main>

  <nav class="vkeys" id="vkeys" aria-label="Softkey verticali"></nav>
  <nav class="hkeys" id="hkeys" aria-label="Softkey orizzontali"></nav>
</div>

<script>
(function () {
"use strict";
const D = {"key":"piastra-haas","board":"bacheca-piastra-haas.html","axes":["X","Y","Z","ASSI ROT.","S","F","T","MANDRINO","REFRIG.","CORR. LUNGH."],"posSub":"zero pezzo G54 · mm","zLabel":"Z","info":{"pct":{"que":"Segno di inizio o di fine del file.","pq":["Quando il programma arriva via rete o da USB, il controllo comincia a leggere al primo % e si ferma al successivo. Quello che sta fuori viene ignorato."],"sino":"Alcuni controlli non riconoscono l'inizio del programma e il caricamento fallisce."},"oname":{"que":"Numero del programma nella memoria della macchina.","pq":["Il controllo Haas identifica i programmi con la lettera O e 5 cifre. Fusion lo scrive con il numero che hai messo al momento del postprocessore.","I due file di questa cartella hanno numeri diversi (O00012 e O00004): si possono caricare insieme senza sovrascriversi."]},"hifeed":{"lvl":"warn","que":"Commento del post: i rapidi sono scritti come G1 F228600 invece di G0.","pq":["Su una 5 assi un G0 con assi rotanti può non essere una linea retta: ogni asse va alla sua velocità massima e la punta dell'utensile fa un percorso «a gomito».","Scrivendo G1 con un avanzamento altissimo (228,6 m/min) la macchina interpola tutti gli assi insieme e la punta va dritta. Il controllo poi limita l'avanzamento al massimo reale degli assi."],"riesgo":"Con G1 l'override dei rapidi non agisce: per rallentare la prima prova devi usare l'override dell'avanzamento."},"caution335":{"lvl":"warn","que":"Avviso del post: questo programma usa G0 normali e chiede di controllare il Setting 335.","pq":["Il Setting 335 di Haas decide come si muovono i rapidi. Con «Linear + Rotary» tutti gli assi, anche B e C, arrivano insieme e la punta fa una linea retta.","È l'alternativa al G1 F228600 dell'altra versione: stesso obiettivo (rapido rettilineo), ma lo garantisce la macchina e non il programma."],"riesgo":"Se il Setting 335 non è impostato, un rapido con B o C può fare una curva e passare vicino al pezzo o alla morsa."},"toollist":{"que":"Commento: elenco degli utensili usati con diametro, raggio di punta, angolo e quota Z più bassa raggiunta.","pq":["Serve all'operatore per preparare il magazzino prima di avviare: controlla che ogni T sia montato e misurato.","ZMIN è la Z più bassa che quell'utensile raggiunge. Confrontala con lo spessore del pezzo e con la morsa: se ZMIN scende sotto il pezzo, sotto deve esserci spazio libero."]},"n10":{"que":"Modi di sicurezza: quote assolute (G90), avanzamento in mm/min (G94), piano XY (G17).","pq":["All'avvio il controllo può avere ancora i modi del programma precedente. Scriverli all'inizio evita sorprese.","G17 è il piano dove avvengono gli archi G2/G3 e i cicli di foratura (asse Z perpendicolare)."],"sino":"Se fosse rimasto attivo G91 (incrementale), il primo movimento partirebbe dalla posizione attuale e non dallo zero pezzo."},"n15":{"que":"Annulla la compensazione lunghezza (G49) e le coordinate di lavoro inclinate (G269).","pq":["G268/G269 su Haas attivano/disattivano il «Feature Coordinate System», il piano di lavoro inclinato per la lavorazione 3+2.","Prima di muovere qualcosa si parte da uno stato pulito: nessun correttore utensile, nessun piano ruotato."]},"n20":{"que":"Unità metriche: tutte le quote sono in millimetri.","pq":["Una UMC può lavorare in pollici o millimetri. G21 lo fissa nel programma, così non dipende dall'impostazione della macchina."],"sino":"In pollici, X38.8 diventerebbe 985 mm: allarme di fine corsa o, peggio, un movimento enorme."},"g53z":{"que":"Rapido in coordinate macchina (G53) fino a Z0 macchina: il mandrino sale al punto più alto.","pq":["G53 ignora lo zero pezzo e usa lo zero della macchina. Z0 macchina è la corsa massima in alto, il posto più sicuro.","Si fa prima di ruotare la tavola, prima di cambiare utensile e alla fine di ogni operazione: con il mandrino in alto niente può toccare il pezzo."]},"n30":{"que":"Porta gli assi rotanti B e C a zero (testa/tavola allineate).","pq":["Su una UMC la tavola si inclina (B) e ruota (C). Questo programma lavora tutto in 3 assi, con la tavola piatta: B0 C0 la mette in posizione di riferimento.","Si fa con il mandrino già in alto (riga precedente): la tavola ruotando porta in giro anche il pezzo e la morsa."],"riesgo":"Controlla che la morsa e il pezzo non tocchino le protezioni durante la rotazione."},"t1m6":{"que":"Cambio utensile: monta T1, fresa Ø12 con raggio di punta 0,5 (usata per spianare).","pq":["M6 fa il cambio vero e proprio. Haas porta automaticamente il mandrino in posizione di cambio."]},"s40000":{"lvl":"err","que":"Avvia il mandrino a 40.000 giri/min, senso orario.","pq":["Il valore viene dalla libreria utensili di Fusion: Vc = π·12·40.000/1000 ≈ 1.508 m/min, tipico di un mandrino ad alta velocità per alluminio.","M3: rotazione oraria vista dal mandrino, quella delle frese destre normali."],"riesgo":"Nessun mandrino Haas UMC di serie arriva a 40.000 giri (secondo versione: 8.100, 12.000 o 15.000). La macchina limita i giri o si ferma con allarme: in ogni caso avanzamento e giri non corrispondono più a quelli calcolati. Vedi Errori."},"safeblk":{"que":"Ripete i modi di sicurezza all'inizio dell'operazione.","pq":["Il post li riscrive a ogni operazione: se l'operatore riparte da metà programma (dopo un M1 o un utensile rotto), i modi sono di nuovo quelli giusti."]},"g54":{"que":"Attiva lo zero pezzo G54.","pq":["Tutte le quote X Y Z che seguono si misurano dal punto azzerato dall'operatore sul pezzo (qui il centro della piastra e la faccia superiore).","Il post lo ripete a ogni operazione per lo stesso motivo dei modi di sicurezza."]},"approach":{"que":"Rapido in XY sopra il punto d'ingresso, con il mandrino ancora in alto.","pq":["Prima si va in XY e solo dopo si scende in Z: così il rapido orizzontale avviene alla quota più alta."]},"g43ok":{"que":"Attiva il correttore di lunghezza dell'utensile (G43 H) e scende a Z15.","pq":["Ogni utensile ha una lunghezza diversa. G43 con il numero H giusto dice alla macchina di quanto sporge la punta, così Z15 è davvero 15 mm sopra il pezzo.","Il numero H deve essere quello dell'utensile montato: qui T1 → H1."],"sino":"Senza correttore, la Z si riferirebbe al naso del mandrino e la punta finirebbe molto più in basso."},"g43h1err":{"lvl":"err","que":"Attiva il correttore di lunghezza H1 — ma l'utensile montato non è T1.","pq":["Il numero H viene dal campo «Length offset» dell'utensile in Fusion. Per T2 e T3 è rimasto 1."],"riesgo":"La macchina usa la lunghezza di T1 (la fresa) per una punta. Se la punta è più lunga della fresa, scende più in basso del previsto: il rapido a Z5 può finire dentro il pezzo e la foratura va più profonda. Se è più corta, il foro resta corto."},"m8":{"que":"Apre il refrigerante.","pq":["Raffredda il tagliente e porta via il truciolo. In foratura e maschiatura è indispensabile: il truciolo dentro il foro blocca la punta."]},"presel":{"que":"Preseleziona l'utensile successivo nel magazzino (senza cambiarlo).","pq":["Mentre l'utensile attuale lavora, il magazzino porta in posizione il prossimo. Al prossimo M6 il cambio è più rapido."]},"z5":{"que":"Rapido fino a Z5, 5 mm sopra il pezzo.","pq":["È l'ultima quota in rapido: da qui in giù si scende in lavoro (G1), più lentamente."]},"n80":{"que":"Scende in lavoro fino a Z0,2, appena sopra la superficie.","pq":["Da Z5 a Z0,2 la fresa è ancora in aria ma si muove già in G1: se il grezzo fosse più alto del previsto, toccherebbe a velocità di lavoro e non in rapido."]},"ramparc":{"que":"Entrata ad arco nel piano XZ (G18): la fresa scende da Z0,2 a Z-1 mentre si sposta in X.","pq":["Entrare con un arco evita di scendere in verticale sul bordo del pezzo: il carico sul tagliente cresce gradualmente.","G18 cambia il piano degli archi in XZ; I e K sono le distanze del centro dell'arco in X e in Z."]},"facepass":{"que":"Passata di spianatura da una parte all'altra del pezzo.","pq":["La spianatura toglie 1 mm dalla faccia superiore per avere una superficie piana e una Z0 certa.","Le passate vanno avanti e indietro (zig-zag): niente tempo perso a tornare indietro in aria."]},"stepover":{"que":"Arco di collegamento tra una passata e l'altra (G17, piano XY).","pq":["Il passo laterale è di circa 7,1 mm: con una fresa Ø12 ogni passata si sovrappone alla precedente di circa 5 mm.","Un arco invece di uno spigolo vivo: la fresa non si ferma e non lascia segni."]},"exitarc":{"que":"Uscita ad arco nel piano XZ: la fresa risale a Z0,2 allontanandosi dal pezzo.","pq":["Come l'entrata: il tagliente si scarica gradualmente invece di staccarsi di colpo."]},"z15":{"que":"Rapido a Z15, sopra il pezzo.","pq":["Fine dei movimenti di lavoro: prima di fermare il mandrino l'utensile esce dal materiale."]},"m5":{"que":"Ferma il mandrino.","pq":["Il mandrino si ferma prima del cambio utensile o della fine programma."]},"m9":{"que":"Chiude il refrigerante.","pq":["Si chiude prima di salire, per non spruzzare tutta la cabina durante il movimento lungo."]},"g49":{"que":"Annulla il correttore di lunghezza.","pq":["Il prossimo movimento è in coordinate macchina (G53): il correttore non serve più e così non resta attivo per sbaglio con il prossimo utensile."]},"m1":{"que":"Arresto opzionale: la macchina si ferma solo se il tasto «Optional Stop» è acceso.","pq":["Prima di ogni cambio utensile: alla prima prova l'operatore può fermarsi, controllare il lavoro dell'utensile precedente e poi ripartire.","In produzione si spegne Optional Stop e il programma va avanti senza fermarsi."]},"t2m6":{"que":"Cambio utensile: T2, punta Ø7 con angolo 140° (foro per maschio M8×1).","pq":["Ø7 è il preforo standard per una filettatura M8×1 (diametro − passo = 8 − 1)."]},"s1820":{"que":"Mandrino a 1.820 giri/min.","pq":["Per la punta Ø7: Vc = π·7·1.820/1000 ≈ 40 m/min, un valore da acciaio."]},"g73":{"lvl":"err","params":[["G98","Alla fine di ogni foro torna alla quota iniziale (Z5), non a R."],["G73","Foratura con rompitruciolo: entra a passi di Q e si ritira di poco."],["X20. Y10.","Primo foro."],["Z-17.274","Fondo del foro (punta compresa)."],["R2.5","Quota di inizio lavoro: da Z5 a Z2,5 in rapido."],["Q1.75","Profondità di ogni passo: 1,75 mm."],["F0.08","Avanzamento… in mm/min (G94 attivo)."]],"que":"Ciclo di foratura con rompitruciolo: fora il primo foro in passi da 1,75 mm fino a Z-17,274.","pq":["G73 fa piccoli ritiri per spezzare il truciolo senza uscire dal foro: è più rapido di G83.","La profondità -17,274 comprende la punta conica a 140°: il diametro pieno arriva a circa Z-16."],"riesgo":"F0.08 con G94 attivo significa 0,08 mm al minuto: circa 3 ore e mezzo per 16 mm. La punta gira senza tagliare, scalda e si rovina. Il valore giusto era 0,08 mm/giro = 145,6 mm/min."},"hole2":{"que":"Secondo foro dello stesso ciclo: la macchina va in X-20 Y-10 e ripete la foratura.","pq":["I cicli fissi sono modali: basta scrivere la nuova posizione e il ciclo si ripete con gli stessi parametri."]},"g80":{"que":"Annulla il ciclo fisso.","pq":["Senza G80, il prossimo movimento in X/Y farebbe un altro foro."]},"g81":{"lvl":"err","params":[["G81","Foratura semplice: entra fino a Z ed esce in rapido."],["Z-17.128","Fondo del foro."],["R3.5","Inizio del lavoro a Z3,5."],["F0.07","Avanzamento in mm/min (G94)."]],"que":"Ciclo di foratura semplice per i fori Ø6,2 che verranno alesati a Ø6,5.","pq":["Ø6,2 lascia 0,15 mm per lato all'alesatore: è il sovrametallo tipico per alesare un foro H7."],"riesgo":"Stesso errore della Punta1: F0.07 mm/min. Il valore giusto era circa 0,07 mm/giro = 127 mm/min."},"s2499":{"que":"Mandrino a 2.499 giri per la fresa cilindrica Ø12.","pq":["Vc = π·12·2.499/1000 ≈ 94 m/min: un valore da acciaio, molto diverso dai 40.000 giri della spianatura."]},"g43h4":{"que":"Correttore lunghezza H4 per T4: qui il numero è giusto.","pq":["Confronta con le punte: T4 → H4, T6 → H6, T5 → H5, T7 → H7. Solo T2 e T3 hanno H1."]},"g43gen":{"que":"Attiva il correttore di lunghezza dell'utensile appena montato e scende a Z15.","pq":["Qui il numero H coincide con il numero dell'utensile: è corretto.","Z15 è la quota di sicurezza sopra il pezzo da cui parte ogni operazione."]},"plunge":{"lvl":"warn","que":"Discesa in lavoro (F75) fino a Z-14,3, fuori dal pezzo.","pq":["Il punto X-31,2 Y29,6 è fuori dalla piastra (Y20 è il bordo): la fresa scende in aria accanto al pezzo.","Il contorno si fa in una sola passata a tutta profondità: Z-15,5."],"riesgo":"Se il grezzo è più grande in Y di quanto pensi, questa discesa verticale avviene nel pieno: con una fresa cilindrica serve un taglio al centro, altrimenti si rompe."},"leadin":{"que":"Entrata ad arco nel piano YZ (G19): la fresa scende da Z-14,3 a Z-15,5 avvicinandosi al pezzo.","pq":["Come nella spianatura: il tagliente entra in carico gradualmente."]},"cfeed":{"que":"Contorno: passata lungo il lato Y=26 (centro fresa) a 124,94 mm/min.","pq":["Il centro della fresa Ø12 sta a 6 mm dal pezzo: Y26 − 6 = Y20, il bordo della piastra 60×40.","Non c'è G41/G42: la compensazione del raggio l'ha già calcolata Fusion. Se la fresa reale è diversa da Ø12, il pezzo cambia misura."]},"corner":{"que":"Arco attorno allo spigolo: il centro fresa gira con raggio 6 attorno allo spigolo del pezzo.","pq":["Raggio della traiettoria 6 = raggio della fresa: lo spigolo del pezzo resta vivo (a 90°)."]},"leadout":{"que":"Uscita ad arco nel piano YZ e risalita.","pq":["Il tagliente esce dal materiale senza lasciare segno."]},"chdown":{"que":"Scende fino a Z-2 per lo smusso (prima a Z2 in rapido controllato a F1400).","pq":["T6 è uno svasatore a 120°: più scende, più largo è lo smusso. Z-2 dà uno smusso di circa 0,5–1,5 mm sulla faccia (che è a Z-1 dopo la spianatura)."]},"chcircle":{"que":"Cerchio attorno al foro (G3, interpolazione circolare): smussa il bordo del foro.","pq":["Il centro dell'arco è il centro del foro; il raggio della traiettoria decide la larghezza dello smusso: 3,285 per i fori filettati, 2,018 per quelli alesati."]},"hifmove":{"lvl":"warn","que":"Spostamento tra uno smusso e l'altro in G1 a 228.600 mm/min: è un rapido «travestito».","pq":["Vedi il commento in testa al programma: su 5 assi così il percorso resta rettilineo.","La macchina limita l'avanzamento al suo massimo reale."],"riesgo":"Avviene a Z5: se la quota di sicurezza è sbagliata, il pezzo viene toccato a piena velocità."},"g0move335":{"lvl":"warn","que":"Spostamento rapido modale (G0 attivo dalla riga precedente) verso lo smusso successivo.","pq":["In questa versione il post usa G0 normali: la traiettoria è rettilinea solo con il Setting 335 = Linear + Rotary."]},"chcontour":{"que":"Smusso lungo il contorno del pezzo.","pq":["La traiettoria sta a 31,232 dal centro sui lati X: lo svasatore tocca lo spigolo a X30 con la parte conica."]},"s2000":{"lvl":"warn","que":"Mandrino a 2.000 giri per il maschio M8.","pq":["In maschiatura rigida i giri e l'avanzamento sono legati: F = S × passo."]},"g84":{"lvl":"warn","params":[["G84","Maschiatura rigida: entra, inverte il mandrino in fondo, esce."],["Z-16.","Fondo del filetto."],["R2.5","Quota di inizio."],["F2000.","2.000 mm/min ÷ 2.000 giri = passo 1,0 mm."]],"que":"Ciclo di maschiatura destra nei fori Ø7.","pq":["Il passo che ne risulta è 1,0 mm: è una M8×1 (passo fine). Il preforo Ø7 è giusto per questo passo.","La macchina sincronizza il mandrino con l'asse Z: ogni giro, Z avanza esattamente un passo."],"riesgo":"Se in magazzino c'è un maschio M8 normale (passo 1,25), il filetto si strappa e il maschio si rompe. Controlla il passo inciso sul maschio."},"s800":{"que":"Mandrino a 800 giri per l'alesatore Ø6,5.","pq":["Gli alesatori lavorano lenti: Vc = π·6,5·800/1000 ≈ 16 m/min. Velocità bassa = foro preciso e liscio."]},"g95":{"lvl":"err","que":"Passa all'avanzamento in mm/giro.","pq":["Per l'alesatore il post scrive l'avanzamento per giro. Il G94 dopo il ciclo rimette i mm/min."],"riesgo":"Il ciclo successivo ha F0.: con G95, zero millimetri per giro."},"g89":{"lvl":"err","params":[["G89","Alesatura con sosta in fondo, uscita in lavoro."],["Z-16.","Fondo."],["R3.5","Quota di inizio."],["P0","Sosta in fondo: 0 secondi."],["F0.","Avanzamento zero."]],"que":"Ciclo di alesatura dei fori Ø6,2 a Ø6,5.","pq":["G89 esce in lavoro (non in rapido) per non rigare le pareti del foro alesato."],"riesgo":"F0. → la macchina dà allarme o non si muove. In Fusion l'avanzamento dell'alesatura è rimasto a zero."},"g94back":{"que":"Torna all'avanzamento in mm/min.","pq":["Si ripristina il modo standard per i movimenti successivi."]},"g53y":{"que":"Porta la tavola in avanti (Y0 macchina) per scaricare il pezzo.","pq":["A fine programma l'operatore trova il pezzo vicino alla porta."]},"m30":{"que":"Fine programma: ferma tutto e torna all'inizio.","pq":["M30 riavvolge il programma: premendo di nuovo Cycle Start si lavora il pezzo successivo."]},"seconda":{"lvl":"err","que":"Commento: inizia la seconda parte del programma (l'altro lato del pezzo).","pq":["Fusion ha unito due setup in un solo file. Il secondo setup lavora la faccia opposta: il pezzo va capovolto."],"riesgo":"Tra le due parti non c'è un M0 (arresto obbligatorio) né un altro zero pezzo (G55). Vedi Errori."},"m1flip":{"lvl":"err","que":"Arresto opzionale prima della seconda parte.","pq":["Qui l'operatore dovrebbe capovolgere il pezzo e rifare lo zero."],"riesgo":"M1 si ferma solo se Optional Stop è acceso. Se è spento, la macchina spiana 10 mm del lato già finito, sopra i fori filettati."},"facestep":{"que":"Nuova passata di spianatura 3 mm più in basso (Z-2,8 → Z-4).","pq":["La seconda faccia toglie 10 mm in 4 livelli: Z-1, -4, -7, -10. Ogni livello ha 7 passate a zig-zag."]},"chz11":{"que":"Scende a Z-11 per smussare lo spigolo del contorno sul secondo lato.","pq":["Dopo la spianatura la faccia è a Z-10: Z-11 dà lo stesso smusso del primo lato (1 mm sotto la faccia)."]},"n1025":{"que":"Rapido sopra l'inizio della spianatura del secondo lato, più larga della prima (X±41,1).","pq":["Il secondo lato è il grezzo non lavorato: Fusion usa le dimensioni del grezzo, non della piastra finita."]}},"errors":[{"lvl":"err","t":"Mandrino a 40.000 giri","pq":"La spianatura (T1) e lo smusso (T6) chiedono 40.000 giri/min. I mandrini delle Haas UMC arrivano a 8.100, 12.000 o 15.000 giri secondo la versione. Il controllo limita i giri o si ferma con allarme. Se li limita, l'avanzamento F6100 resta lo stesso con 5 volte meno giri: ogni dente toglie 5 volte più truciolo.","sol":"In Fusion imposta i giri dell'utensile entro il limite della macchina (e ricalcola l'avanzamento per dente), oppure usa una macchina per cui la libreria è stata fatta.","prog":"o12","lines":[19,124]},{"lvl":"err","t":"Correttore di lunghezza H1 per le punte T2 e T3","pq":"G43 H1 applica la lunghezza di T1 (la fresa). Con una punta montata, la Z vera della punta è sbagliata della differenza di lunghezza tra i due utensili: il rapido a Z5 può finire dentro il pezzo, e la profondità del foro è sbagliata.","sol":"Nella libreria di Fusion metti «Length offset» = numero utensile (T2 → 2, T3 → 3) e ripostprocessa. Le altre operazioni (H4, H5, H6, H7) sono già giuste.","prog":"o12","lines":[55,75]},{"lvl":"err","t":"Forature a 0,08 e 0,07 mm/min","pq":"Con G94 attivo, F0.08 significa 0,08 millimetri al minuto: per 17 mm servono più di 3 ore a foro. La punta gira senza riuscire a tagliare, sfrega, scalda e si consuma. L'avanzamento è stato scritto in mm/giro in un campo in mm/min.","sol":"Avanzamento per giro 0,08 → F = 0,08 × 1.820 = 145,6 mm/min (Punta1) e 0,07 × 1.820 ≈ 127 mm/min (Punta2).","prog":"o12","lines":[59,79]},{"lvl":"err","t":"Alesatura con avanzamento zero","pq":"Il ciclo G89 è in G95 (mm/giro) con F0.: zero millimetri per giro. La macchina dà allarme o resta ferma con l'alesatore che gira nel foro.","sol":"Avanzamento tipico per un alesatore Ø6,5: 0,1–0,2 mm/giro (F0.15 con G95, oppure 120 mm/min con G94).","prog":"o12","lines":[213,214]},{"lvl":"err","t":"Secondo lato senza M0 e con lo stesso zero pezzo","prog":"o04","pq":"In O00004 la seconda parte (spianatura di 10 mm e smusso a Z-11) parte dopo un M1, cioè un arresto opzionale, e usa ancora G54. Se Optional Stop è spento, la macchina non si ferma e spiana 10 mm del lato appena finito. Anche fermandosi, lo zero G54 è quello del primo lato.","sol":"M0 prima della seconda parte, con un commento per l'operatore («CAPOVOLGERE IL PEZZO»), e un secondo zero pezzo (G55) per il secondo setup in Fusion. Meglio ancora: due programmi separati.","lines":[225,228,232]},{"lvl":"warn","t":"Maschiatura con passo 1,0 mm","pq":"F2000 / S2000 = 1,0 mm per giro, cioè M8×1 (passo fine). L'M8 normale ha passo 1,25. Il preforo Ø7 è giusto per M8×1 (per M8×1,25 sarebbe Ø6,8).","sol":"Controlla il maschio in macchina. Se è M8×1,25, in Fusion correggi il passo dell'utensile (F diventa 2.500) e il preforo (Ø6,8).","prog":"o12","lines":[185,193]},{"lvl":"warn","t":"Rapidi a 5 assi: due soluzioni diverse","pq":"O00012 sostituisce i rapidi con G1 F228600 (l'override rapidi non funziona su queste righe); O00004 usa G0 e chiede il Setting 335 = Linear + Rotary. Sono due modi di ottenere un rapido rettilineo: non vanno mescolati.","sol":"Scegli un'impostazione nel post e usala sempre. Con G0, controlla il Setting 335 sulla macchina prima di eseguire.","prog":"o12","lines":[3,139,153,161]}],"checks":[{"t":"Lunghezze T1–T7 misurate e numeri H uguali al numero utensile","pq":"Soprattutto T2 e T3, che nel programma usano H1.","prog":"o12","lines":[23,55,75]},{"t":"Spazio libero sotto i fori e sotto il contorno","pq":"Le punte scendono a Z-17,3 e il contorno a Z-15,5: le parallele della morsa non devono stare sotto i fori (X±20 Y±10) né sotto il bordo.","prog":"o12","lines":[59,79,100]},{"t":"Tavola libera di ruotare a B0 C0","pq":"La riga «B0. C0.» muove la tavola con il pezzo montato: morsa e pezzo non devono toccare le protezioni.","prog":"o12","lines":[15]},{"t":"Setting 335 = Linear + Rotary (per O00004)","pq":"Senza, i rapidi con assi rotanti non sono rettilinei.","prog":"o04","lines":[3,139]},{"t":"   const cx = Math.max(10, Math.min(W - 30, x)), cy = Math.max(14, Math.min(H - 8, y));
  ctx.fillStyle = css("--cursor"); ctx.strokeStyle = "#5c4100"; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - 9, cy); ctx.lineTo(cx + 9, cy); ctx.moveTo(cx, cy - 9); ctx.lineTo(cx, cy + 9); ctx.stroke();
  if (!inside || label) {
    ctx.fillStyle = css("--ink"); ctx.font = "600 11px " + css("--font-ui");
    const t = label || "fuori vista ↗";
    ctx.fillText(t, Math.min(cx + 10, W - ctx.measureText(t).width - 4), Math.max(cy - 8, 12));
  }
}
function stopAnim() { if (anim) { cancelAnimationFrame(anim); anim = null; } }
function curOp() {
  let i = S.cur; if (i < 0) { const m = [...S.marks][0]; i = m == null ? -1 : m; }
  const oi = i >= 0 ? opOf(i) : null;
  return oi != null && oi >= 0 ? S.prog.ops[oi] : null;
}
function drawScene() {
  if (anim) return;
  const op = curOp();
  const v = viewOf(op) || D.views[D.progs[0].ops[0].view];
  const F = frame(v);
  drawBase(F, v, op);
  $("cap").textContent = (op ? op.name + " · " : "") + v.cap;
  const t = S.cur >= 0 ? S.prog.tp[S.cur] : null;
  if (t && t[0] != null) {
    if (t[3] != null) {
      ctx.strokeStyle = css("--cursor"); ctx.lineWidth = 2.5; ctx.setLineDash(t[5] ? [5, 4] : []);
      ctx.beginPath(); ctx.moveTo(F.sx(t[3]), F.sy(t[4])); ctx.lineTo(F.sx(t[0]), F.sy(t[1])); ctx.stroke(); ctx.setLineDash([]);
    }
    drawTool(F, t[0], t[1], null);
    zGauge(t[2], op);
  } else if (S.cur >= 0) {
    ctx.fillStyle = css("--muted"); ctx.font = "12px " + css("--font-ui");
    ctx.fillText("Posizione dell'utensile non ancora definita", 40, 40);
  }
}
function startAnim() {
  const op = curOp(); if (!op || op.pts.length < 6) return;
  const v = viewOf(op);
  const pts = op.pts, n = pts.length / 3;
  const dur = Math.min(14000, Math.max(4000, n * 6));
  if (reduce) { stopAnim(); return; }
  let t0 = null;
  const F = frame(v);
  const tick = ts => {
    if (t0 == null) t0 = ts;
    const f = ((ts - t0) % dur) / dur, j = Math.floor(f * (n - 1)) * 3;
    drawBase(F, v, op);
    ctx.strokeStyle = css("--cursor"); ctx.lineWidth = 2;
    ctx.beginPath(); for (let q = Math.max(0, j - 90); q <= j; q += 3) { if (q === Math.max(0, j - 90)) ctx.moveTo(F.sx(pts[q]), F.sy(pts[q + 1])); else ctx.lineTo(F.sx(pts[q]), F.sy(pts[q + 1])); } ctx.stroke();
    drawTool(F, pts[j], pts[j + 1], "simulazione " + Math.round(f * 100) + " %");
    anim = requestAnimationFrame(tick);
  };
  anim = requestAnimationFrame(tick);
  renderKeys();
}

/* ---------- render ---------- */
function render() { renderKeys(); renderCode(); renderPos(); renderInfo(); drawScene(); }
if (window.ResizeObserver) new ResizeObserver(() => { if (!anim) drawScene(); }).observe(cv);
else window.addEventListener("resize", drawScene);
document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  if (S.mode !== "ciclo") return;
  if (e.key === "PageDown") { e.preventDefault(); step(1); }
  if (e.key === "PageUp") { e.preventDefault(); step(-1); }
});

renderAxes();
loadProg(S.prog);
const start = store.get("mode", "ciclo");
if (hkeys().some(h => h[0] === start) && start !== "ciclo") setMode(start); else render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!anim) drawScene(); });
})();
</script>
