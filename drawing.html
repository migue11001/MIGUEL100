<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project — migue100.com</title>
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/favicon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="author" content="Miguel Otero">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="auth.css">
    <style>
        :root {
            --neon-blue:   #00d4ff; --smoke-gray: #bebec8;
            --neon-dim:    #0099cc;
            --steel-dark:  #08090d;
            --steel-panel: #1a1e28;
            --chrome:      #8ab4cc;
            --text-main:   #cce8f4;
            --text-dim:    #5a7a90;
            --sw-bg:       #020408;
            --sw-text:     #a8c8e0;
            --sw-g:        #4fc3f7;
            --sw-m:        #ffb74d;
            --sw-n:        #455a64;
            --sw-comment:  #2e4a58;
            --sw-cycle:    #ce93d8;
            --sw-val:      #80cbc4;
            --sw-tf:       #81c784;
            --amber:       #ffb300;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            /* Solid background so the avatar's bottom fade blends in without a visible seam */
            background-color: var(--steel-dark);
            min-height: 100vh;
            color: var(--text-main);
            padding: 80px 20px 80px;
            overflow-x: hidden;
        }

        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.08) 3px, rgba(0,0,0,0.08) 4px);
            pointer-events: none; z-index: 999;
        }

        /* ── Nav ── */
        .site-nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 900;
            padding: 0 2rem; height: 56px;
            background: rgba(8,9,13,0.9); backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(190, 190, 200, 0.18);
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.15rem; font-weight: 400; letter-spacing: 0.15em;
            color: #fff; text-decoration: none; background: none; border: none;
            cursor: pointer;
            text-shadow: 0 0 4px #fff, 0 0 12px var(--neon-blue), 0 0 28px rgba(0,180,255,0.35);
            transition: text-shadow 0.3s ease;
        }
        .nav-logo:hover {
            text-shadow: 0 0 6px #fff, 0 0 18px var(--neon-blue), 0 0 40px rgba(0,180,255,0.5);
        }

        .lang-switch { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
        .nav-brand { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
        .nav-linkedin {
            display: flex; color: var(--text-dim); transition: color 0.2s, filter 0.2s;
        }
        .nav-linkedin svg { width: 18px; height: 18px; }
        .nav-linkedin:hover { color: #fff; filter: drop-shadow(0 0 6px var(--neon-blue)); }
        @media (max-width: 768px) { .site-nav .nav-logo { letter-spacing: 0.06em; } }
        /* Phones: the longer name needs the room — language switch joins the normal flow instead of the centre */
        @media (max-width: 560px) {
            .nav-brand { gap: 0.45rem; }
            .site-nav .nav-logo { font-size: 0.74rem; letter-spacing: 0.02em; white-space: nowrap; }
            .nav-linkedin svg { width: 15px; height: 15px; }
            .site-nav .lang-switch { position: relative; left: auto; top: auto; transform: none; margin-left: auto; margin-right: 0.4rem; }
        }
        .lang-trigger {
            display: flex; align-items: center; gap: 0.32rem;
            background: rgba(0,212,255,0.04); border: 1px solid rgba(190, 190, 200, 0.22); border-radius: 3px;
            padding: 0.22rem 0.5rem; font-family: 'Share Tech Mono', monospace; font-size: 0.68rem;
            letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); line-height: 1;
            cursor: pointer; transition: all 0.25s ease;
        }
        .lang-trigger-flag { font-size: 0.95rem; line-height: 1; }
        .lang-trigger-caret { font-size: 0.6rem; transition: transform 0.25s ease; }
        .lang-trigger:hover, .lang-switch.open .lang-trigger {
            border-color: var(--smoke-gray); background: rgba(0,212,255,0.1);
            box-shadow: 0 0 10px rgba(0,212,255,0.2); color: #fff;
        }
        .lang-switch.open .lang-trigger-caret { transform: rotate(180deg); }
        .lang-menu {
            position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%) translateY(-6px);
            display: flex; flex-direction: column; gap: 0.28rem;
            background: rgba(8,9,13,0.97); border: 1px solid rgba(190, 190, 200, 0.22); border-radius: 4px;
            padding: 0.35rem; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 950;
        }
        .lang-switch.open .lang-menu { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .lang-menu .lang-btn {
            display: flex; align-items: center; gap: 0.45rem; width: 100%; white-space: nowrap;
            background: rgba(0,212,255,0.04); border: 1px solid rgba(190, 190, 200, 0.18); border-radius: 3px;
            padding: 0.3rem 0.6rem; font-family: 'Share Tech Mono', monospace; font-size: 0.72rem;
            letter-spacing: 0.05em; color: var(--text-dim); cursor: pointer; transition: all 0.2s ease;
        }
        .lang-menu .lang-btn:hover { border-color: var(--smoke-gray); background: rgba(0,212,255,0.1); color: #fff; }
        /* Current language stays in its place (fixed order EN / ES / IT), just marked */
        .lang-menu .lang-btn.current { color: #fff; border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.08); cursor: default; }
        #google_translate_element, .goog-te-banner-frame, .skiptranslate { display: none !important; }
        body { top: 0px !important; }
        html.translated-ltr body, html.translated-rtl body { top: 0 !important; }
        @media (max-width: 560px) { .lang-trigger-label { display: none; } }
        @media (max-width: 768px) {
            .site-nav { padding: 0 1rem; height: 50px; }
            .nav-logo { font-size: 0.9rem; }
        }
        @media (max-width: 480px) {
            .site-nav { padding: 0 0.6rem; }
            .nav-logo { font-size: 0.78rem; letter-spacing: 0.1em; }
        }

        /* ═══ Project page — 3 columns: section nav · drawing · specs ═══ */
        body { padding: 56px 0 0; font-family: 'Rajdhani', 'Segoe UI', sans-serif; background: #07090c; }
        body::after { display: none; }
        :root {
            --pj-line:  rgba(190, 200, 215, 0.12);
            --pj-label: #6f9ec4;
            --pj-text:  #c9d3dd;
            --pj-dim:   #7d8894;
            --pj-panel: #0b0e13;
        }
        .mono { font-family: 'Share Tech Mono', monospace; }

        .pj { max-width: 1600px; margin: 0 auto; min-height: calc(100vh - 56px); }

        /* ── Header: title on the left, menu button on the right ── */
        .pj-main { padding: 30px 40px 60px; min-width: 0; }
        .pj-head { display: flex; align-items: center; justify-content: space-between; gap: 24px; scroll-margin-top: 80px; }
        .pj-title {
            font-family: 'Rajdhani', sans-serif; font-weight: 400; font-size: clamp(1.7rem, 4.5vw, 3.9rem); overflow-wrap: anywhere;
            letter-spacing: 0.24em; line-height: 1.15; color: #f2f5f8; text-transform: uppercase;
        }
        .pj-nav { flex: 0 0 auto; }
        /* Menu button: plain text, no frame */
        .pj-menu-btn {
            display: flex; align-items: center; gap: 13px; padding: 0;
            background: none; border: none;
            font-family: 'Share Tech Mono', monospace; font-size: 0.96rem; letter-spacing: 0.16em;
            color: var(--pj-text); text-transform: uppercase; cursor: pointer; transition: color 0.2s;
        }
        /* Constant soft neon that slowly breathes, so the button reads as clickable */
        .pj-menu-btn { color: #e6f7ff; animation: pj-neon 2.8s ease-in-out infinite; }
        .pj-menu-btn i::before, .pj-menu-btn i::after, .pj-menu-btn i span { box-shadow: 0 0 7px rgba(0,212,255,0.7); }
        @keyframes pj-neon {
            0%, 100% { text-shadow: 0 0 4px rgba(180,241,255,0.55), 0 0 12px rgba(0,212,255,0.35); }
            50%      { text-shadow: 0 0 6px rgba(180,241,255,0.85), 0 0 20px rgba(0,212,255,0.6), 0 0 34px rgba(0,180,255,0.25); }
        }
        .pj-menu-btn:hover, .pj-menu-btn[aria-expanded="true"] {
            color: #fff; animation: none;
            text-shadow: 0 0 6px rgba(180,241,255,0.9), 0 0 20px rgba(0,212,255,0.65), 0 0 34px rgba(0,180,255,0.3);
        }
        @media (prefers-reduced-motion: reduce) {
            .pj-menu-btn { animation: none; text-shadow: 0 0 5px rgba(180,241,255,0.7), 0 0 16px rgba(0,212,255,0.5); }
        }
        .pj-menu-btn i { display: flex; flex-direction: column; gap: 4px; }
        .pj-menu-btn i::before, .pj-menu-btn i::after, .pj-menu-btn i span { content: ''; display: block; width: 18px; height: 2px; background: currentColor; }
        .pj-menu-btn b { font-weight: 400; }
        .pj-menu-btn em {
            font-style: normal; color: #6fc3ff;
            padding-left: 13px; border-left: 1px solid rgba(190,200,215,0.25);
        }

        /* Menu: a long neon line drops from the button and the stages hang from it as plain text.
           While it is open the description and breakdown blur; the title and picture stay sharp */
        .pj-panel { position: relative; margin-top: -44px; padding-top: 26px; }
        .pj-panel[hidden] { display: none; }
        /* Short stem from the button down to the first stage */
        .pj-panel::before {
            content: ''; position: absolute; left: 8px; top: 0; height: 26px; width: 1px;
            background: rgba(111,195,255,0.9); box-shadow: 0 0 8px rgba(0,212,255,0.6);
            transform-origin: top; animation: pj-line-grow 0.2s ease-out both;
        }
        @keyframes pj-line-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
        /* Title and picture stay sharp; from the description down everything blurs behind the menu */
        .pj-about, .pj-section-title, .pj-steps { transition: filter 0.4s ease, opacity 0.4s ease; }
        .pj-page.menu-open .pj-about,
        .pj-page.menu-open .pj-section-title,
        .pj-page.menu-open .pj-steps { filter: blur(7px); opacity: 0.4; pointer-events: none; user-select: none; }
        /* Stages hanging from neon lines: two columns (01–03 | 04–06), one column on phones.
           Each stage draws its own piece of line (li::before), the joint dot (li::after) and the tick (button::before) */
        .pj-pick {
            list-style: none; display: grid; grid-auto-flow: column;
            grid-template-rows: repeat(var(--rows, 3), auto); grid-auto-columns: max-content; column-gap: 72px;
        }
        .pj-pick li { position: relative; padding-left: 40px; display: flex; align-items: center; gap: 18px; }
        .pj-pick li::before {
            content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 1px;
            background: rgba(111,195,255,0.75); box-shadow: 0 0 8px rgba(0,212,255,0.55);
            transform-origin: top; animation: pj-line-grow 0.25s ease-out both; animation-delay: calc(0.15s + var(--i) * 0.08s);
        }
        .pj-pick li.col-start::before { top: 50%; }
        .pj-pick li.col-end::before { bottom: 50%; }
        .pj-pick li::after {
            content: ''; position: absolute; left: 5.5px; top: calc(50% - 2.5px); width: 6px; height: 6px;
            border-radius: 50%; background: #6fc3ff; box-shadow: 0 0 8px rgba(0,212,255,0.8);
            opacity: 0; animation: pj-item-in 0.3s ease-out forwards; animation-delay: calc(0.25s + var(--i) * 0.08s);
        }
        .pj-pick button::before {
            content: ''; position: absolute; left: -32px; top: 50%; width: 24px; height: 1px;
            background: rgba(111,195,255,0.7); box-shadow: 0 0 6px rgba(0,212,255,0.5);
        }
        .pj-pick button {
            position: relative; opacity: 0; animation: pj-item-in 0.35s ease-out forwards; animation-delay: calc(0.25s + var(--i) * 0.08s);
        }
        /* Phones: one column — the line only ends at the last stage */
        @media (max-width: 760px) {
            .pj-pick { grid-auto-flow: row; grid-template-rows: none; grid-auto-columns: auto; }
            .pj-pick li.col-start::before { top: 0; }
            .pj-pick li.col-end::before { bottom: 0; }
            .pj-pick li:last-child::before { bottom: 50%; }
        }
        @keyframes pj-item-in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
        .pj-pick button {
            display: flex; align-items: baseline; gap: 18px; padding: 13px 0;
            font-family: 'Share Tech Mono', monospace; font-size: 1.19rem; letter-spacing: 0.1em; line-height: 1.3;
            text-transform: uppercase; text-align: left; color: #dfe8ef; cursor: pointer;
            background: none; border: none; transition: color 0.2s, text-shadow 0.2s;
        }
        .pj-pick button span { color: #4fa3e0; font-size: 1.05rem; flex: 0 0 auto; }
        /* Download button next to each stage — visual only for now (no file behind it yet) */
        .pj-pick .pj-dl {
            flex: 0 0 auto; width: 32px; height: 32px; padding: 0; margin-left: auto;
            display: inline-flex; align-items: center; justify-content: center;
            color: #6fc3ff; background: rgba(0,212,255,0.05);
            border: 1px solid rgba(111,195,255,0.4); border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,212,255,0.25); cursor: pointer;
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .pj-pick .pj-dl::before { display: none; }
        .pj-pick .pj-dl svg { width: 15px; height: 15px; }
        .pj-pick .pj-dl:hover {
            color: #fff; border-color: #00d4ff; background: rgba(0,212,255,0.14);
            box-shadow: 0 0 14px rgba(0,212,255,0.55);
        }
        .pj-pick button:hover { color: #fff; text-shadow: 0 0 6px rgba(180,241,255,0.6), 0 0 16px rgba(0,212,255,0.35); }
        @media (prefers-reduced-motion: reduce) {
            .pj-panel::before, .pj-pick li::before, .pj-pick li::after, .pj-pick button { animation: none; opacity: 1; }
        }
        /* The slot picked in the panel flashes once */
        .pj-step.picked .pj-step-pic { border-color: #00d4ff; box-shadow: 0 0 16px rgba(0,212,255,0.35); }
        .pj-step-pic { transition: border-color 0.2s, box-shadow 0.2s; }

        .zoomable { cursor: zoom-in; }
        /* Read-only pictures: no drag, selection, long-press menu or "Save image as" */
        .pj-page img, .pj-lightbox img {
            -webkit-user-select: none; user-select: none;
            -webkit-user-drag: none; -webkit-touch-callout: none;
        }
        .pj-page img { pointer-events: none; }   /* clicks still reach the .zoomable frame */

        /* Description of the part: menu button on top (left), then the three parts in rows.
           Wide screens: each row = title on the left, text on the right; small screens: title above text */
        .pj-info {
            display: flex; flex-direction: column; align-items: flex-start; gap: 66px;   /* menu ↔ description */
            margin-top: 34px; padding-top: 26px; border-top: 1px solid var(--pj-line);
        }
        .pj-about { width: 100%; display: flex; flex-direction: column; }
        .pj-about section {
            display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 880px); gap: clamp(24px, 3vw, 56px);
            padding: 20px 0; border-top: 1px solid rgba(190,200,215,0.07);
        }
        .pj-about section:first-child { border-top: none; padding-top: 0; }
        .pj-about h3 {
            display: flex; align-items: center; gap: 10px; margin-top: 0.45em;
            align-self: start; font-family: 'Share Tech Mono', monospace; font-weight: 400; font-size: 0.8rem;
            letter-spacing: 0.16em; line-height: 1.5; color: #e8eef4; text-transform: uppercase;
        }
        .pj-about h3::before {
            content: ''; flex: 0 0 7px; height: 7px; border-radius: 50%;
            background: #4fa3e0; box-shadow: 0 0 8px rgba(79,163,224,0.8);
        }
        .pj-about p { font-size: clamp(1rem, 0.85rem + 0.3vw, 1.15rem); line-height: 1.75; color: #a9b4bf; }
        @media (max-width: 1100px) {
            .pj-about section { grid-template-columns: minmax(0, 1fr); gap: 12px; }
            .pj-about h3 { margin-top: 0; }
        }

        /* Central picture, full width */
        .pj-stage { margin-top: 26px; padding: 10px 0 30px; scroll-margin-top: 80px; }
        .pj-hero { position: relative; isolation: isolate; }
        .pj-hero::before {
            content: ''; position: absolute; inset: -6% -10%; z-index: -1;
            background: radial-gradient(ellipse at 45% 45%, rgba(120,150,180,0.16), transparent 62%);
        }
        /* No frame: the picture's edges fade softly into the page */
        .pj-hero-img {
            display: block; width: 100%; height: auto;
            -webkit-mask-image:
                linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
                linear-gradient(to bottom, transparent 0, #000 9%, #000 88%, transparent 100%);
            -webkit-mask-composite: source-in;
            mask-image:
                linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%),
                linear-gradient(to bottom, transparent 0, #000 9%, #000 88%, transparent 100%);
            mask-composite: intersect;
        }

        .pj-section-title {
            display: flex; align-items: center; gap: 18px; margin: 34px 0 20px;
            font-family: 'Share Tech Mono', monospace; font-size: 0.78rem; letter-spacing: 0.24em;
            color: var(--pj-label); text-transform: uppercase; scroll-margin-top: 80px;
        }
        .pj-section-title::after { content: ''; flex: 1; height: 1px; background: var(--pj-line); }

        /* Breakdown strip — like a process row: number, text, picture */
        .pj-steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; }
        .pj-step { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .pj-step-head { display: flex; gap: 12px; align-items: center; min-height: 34px; }
        .pj-step-num {
            flex: 0 0 34px; height: 34px; border-radius: 50%; border: 1px solid #4fa3e0;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Share Tech Mono', monospace; font-size: 0.82rem; color: #e8eef4;
        }
        .pj-step-name { font-family: 'Share Tech Mono', monospace; font-size: 0.74rem; letter-spacing: 0.1em; color: #e8eef4; text-transform: uppercase; }
        .pj-step-text { font-size: 0.82rem; line-height: 1.35; color: var(--pj-dim); margin-top: 3px; }
        .pj-step-pic {
            position: relative; aspect-ratio: 3 / 2; overflow: hidden; border-radius: 4px;
            border: 1px solid rgba(190,190,200,0.18); background: var(--pj-panel);
            display: flex; align-items: center; justify-content: center; padding: 8px;
        }
        .pj-step-pic.zoomable:not(.photo):hover { border-color: rgba(0,212,255,0.5); box-shadow: 0 0 14px rgba(0,212,255,0.2); }
        .pj-step-pic img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
        /* Photos / illustrations: no frame, toned down so they sit on the dark page; brighter on hover */
        .pj-step-pic.photo { padding: 0; border: none; background: none; }
        .pj-step-pic.photo img {
            width: 100%; height: 100%; max-width: none; max-height: none; object-fit: cover;
            filter: brightness(0.7) saturate(0.85); transition: filter 0.25s;
        }
        .pj-step-pic.photo:hover img { filter: brightness(0.88) saturate(0.95); }
        /* Line drawings get a blueprint look (white lines on dark); photos (photo: true) keep their colours */
        .pj-step-pic img.drawing {
            filter: invert(1) brightness(0.92) sepia(0.25) hue-rotate(170deg) saturate(1.4);
            mix-blend-mode: screen;
        }
        /* Empty slot: a dashed frame waiting for its drawing */
        .pj-step.empty .pj-step-pic { border-style: dashed; border-color: rgba(190,200,215,0.18); background: transparent; }

        /* Lightbox: any picture opens full screen */
        .pj-lightbox {
            position: fixed; inset: 0; z-index: 1000; background: rgba(4,6,9,0.96);
            overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 60px 20px 20px;
        }
        .pj-lightbox[hidden] { display: none; }
        .pj-lightbox img { width: 100%; max-width: 1500px; height: auto; cursor: zoom-in; }
        .pj-lightbox.drawing img {
            filter: invert(1) brightness(0.92) sepia(0.25) hue-rotate(170deg) saturate(1.4);
            mix-blend-mode: screen;
        }
        .pj-lightbox.zoomed img { width: 260%; max-width: none; cursor: zoom-out; }
        .pj-lightbox-close {
            position: fixed; top: 14px; right: 18px; z-index: 1;
            background: none; border: 1px solid rgba(255,255,255,0.35); border-radius: 50%;
            width: 34px; height: 34px; color: #fff; font-size: 1rem; cursor: pointer;
        }
        .not-found { padding: 80px 20px; text-align: center; font-family: 'Share Tech Mono', monospace; letter-spacing: 0.16em; color: var(--pj-dim); }
        .not-found a { color: var(--pj-label); }

        /* ── Responsive ── */
        @media (max-width: 1200px) {
            .pj-steps { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }
        @media (max-width: 900px) {
            body { padding-top: 50px; }
            .pj-main { padding: 24px 16px 40px; }
            .pj-head { scroll-margin-top: 70px; }
            .pj-stage { scroll-margin-top: 110px; }
            .pj-steps { grid-template-columns: 1fr 1fr; }
            .pj-section-title { scroll-margin-top: 110px; }
        }
        @media (max-width: 520px) {
            .pj-title { letter-spacing: 0.1em; font-size: clamp(1.7rem, 8vw, 2.4rem); }
            .pj-menu-btn b { display: none; }
            .pj-menu-btn em { padding-left: 0; border-left: none; }
            .pj-step { scroll-margin-top: 70px; }
            .pj-steps { grid-template-columns: 1fr; }
            .pj-step-head { min-height: 0; }
        }
    </style>
</head>
<body>

    <nav class="site-nav">
        <div class="nav-brand">
            <a href="index.html" class="nav-logo notranslate">Miguel Otero</a>
            <a href="https://www.linkedin.com/in/0123456789miguel/" class="nav-linkedin" target="_blank" rel="noopener" aria-label="LinkedIn profile" title="LinkedIn">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            </a>
        </div>
        <div class="lang-switch" id="lang-switch">
            <button class="lang-trigger notranslate" id="lang-trigger" onclick="toggleLangMenu(event)" title="Language">
                <span class="lang-trigger-flag" id="lang-trigger-flag">🇬🇧</span>
                <span class="lang-trigger-label">Language</span>
                <span class="lang-trigger-caret">▾</span>
            </button>
            <div class="lang-menu notranslate" id="lang-menu">
                <button class="lang-btn" data-lang="en" onclick="setSiteLanguage('en')" title="English">🇬🇧 English</button>
                <button class="lang-btn" data-lang="es" onclick="setSiteLanguage('es')" title="Español">🇪🇸 Español</button>
                <button class="lang-btn" data-lang="it" onclick="setSiteLanguage('it')" title="Italiano">🇮🇹 Italiano</button>
            </div>
        </div>
    </nav>

    <div id="project-page" class="pj">
        <main class="pj-main pj-page" id="pj-page">
            <header class="pj-head" id="overview">
                <div>
                    <h1 class="pj-title" id="pj-title"></h1>
                </div>
            </header>

            <div class="pj-stage" id="views">
                <div class="pj-hero" id="pj-hero"></div>
                <!-- Menu button on top (left), the three description parts under it -->
                <div class="pj-info">
                    <nav class="pj-nav">
                        <button type="button" class="pj-menu-btn" id="pj-menu-btn" aria-expanded="false" aria-controls="pj-panel">
                            <i aria-hidden="true"><span></span></i><b>Menu</b><em id="pj-code"></em>
                        </button>
                    </nav>
                    <!-- Menu panel: opens here, hiding the description and the breakdown below -->
                    <div class="pj-panel" id="pj-panel" role="region" aria-label="Project stages" hidden>
                        <ul class="pj-pick" id="pj-pick"></ul>
                    </div>
                    <div class="pj-about" id="pj-about"></div>
                </div>
            </div>

            <h2 class="pj-section-title" id="breakdown">Drawing breakdown</h2>
            <div class="pj-steps" id="pj-steps"></div>
        </main>

    </div>

    <!-- Picture viewer: click to zoom, Esc or ✕ to close -->
    <div class="pj-lightbox" id="pj-lightbox" hidden>
        <button class="pj-lightbox-close" type="button" aria-label="Close picture">✕</button>
        <img id="pj-lightbox-img" alt="">
    </div>

    <script src="drawings.js?v=18"></script>
    <script>
    /* ── Project page: everything is filled from the #name in the URL (drawing.html#D10) ── */
    (function() {
        const d = findDrawing(decodeURIComponent(location.hash.slice(1)));
        const page = document.getElementById('project-page');
        if (!d) {
            page.innerHTML = '<div class="not-found">Project not found — <a href="index.html#gallery">all projects</a></div>';
            return;
        }
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        const pad = n => String(n).padStart(2, '0');
        document.title = d.title + ' — migue100.com';
        $('pj-title').textContent  = d.title;
        $('pj-code').textContent   = d.code;

        /* Pictures live in Supabase images/PROJECTS/ (a full URL also works) */
        const imgUrl = f => /^https?:/.test(f) ? f : PROJECTS_URL + f;

        /* Central picture */
        if (d.hero) {
            const hero = document.createElement('div');
            hero.className = 'zoomable';
            hero.dataset.full = imgUrl(d.hero.img);
            hero.dataset.photo = '1';
            hero.innerHTML = '<img class="pj-hero-img" fetchpriority="high" width="1536" height="1024" alt="'
                + esc(d.hero.label) + '" src="' + esc(imgUrl(d.hero.img)) + '">';
            $('pj-hero').appendChild(hero);
        }

        /* Description: three parts; English text, with the ES / IT versions picked up by the language switch (applyGlossary) */
        if (d.about) {
            $('pj-about').innerHTML = d.about.map(part =>
                '<section><h3 class="notranslate">' + esc(part.title) + '</h3>'
                + '<p class="notranslate"'
                + (part.es ? ' data-i18n-es="' + esc(part.es) + '"' : '')
                + (part.it ? ' data-i18n-it="' + esc(part.it) + '"' : '')
                + '>' + esc(part.en) + '</p></section>').join('');
        }

        /* Breakdown slots: an empty numbered frame until it gets an img in drawings.js */
        (d.breakdown || []).forEach((b, i) => {
            const step = document.createElement('div');
            step.className = 'pj-step' + (b.img ? '' : ' empty');
            step.id = 'step-' + pad(i + 1);
            step.innerHTML = '<div class="pj-step-head"><span class="pj-step-num">' + pad(i + 1) + '</span>'
                + (b.title || b.text
                    ? '<div><div class="pj-step-name">' + esc(b.title || '') + '</div>'
                      + (b.text ? '<div class="pj-step-text">' + esc(b.text) + '</div>' : '') + '</div>'
                    : '') + '</div>';
            const pic = document.createElement('div');
            pic.className = 'pj-step-pic';
            if (b.img) {
                pic.classList.add('zoomable');
                pic.dataset.full = imgUrl(b.img);
                if (b.photo) { pic.dataset.photo = '1'; pic.classList.add('photo'); }
                pic.innerHTML = '<img loading="lazy"' + (b.photo ? '' : ' class="drawing"') + ' alt="' + esc(b.title || 'Step ' + pad(i + 1)) + '" src="' + esc(imgUrl(b.img)) + '">';
            }
            step.appendChild(pic);
            $('pj-steps').appendChild(step);
        });

        /* Clicking a picture opens it full screen */
        const box = $('pj-lightbox'), boxImg = $('pj-lightbox-img');
        boxImg.alt = d.title;
        const closeBox = () => { box.hidden = true; box.classList.remove('zoomed'); document.body.style.overflow = ''; };
        page.addEventListener('click', e => {
            const hit = e.target.closest('.zoomable');
            if (!hit) return;
            const full = hit.dataset.full;
            box.classList.toggle('drawing', !hit.dataset.photo);
            if (boxImg.getAttribute('src') !== full) boxImg.src = full;
            box.hidden = false; document.body.style.overflow = 'hidden';
        });
        boxImg.addEventListener('click', () => box.classList.toggle('zoomed'));
        box.querySelector('.pj-lightbox-close').addEventListener('click', closeBox);
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && !box.hidden) closeBox(); });
        /* Read-only: no right-click menu or dragging on the pictures (the viewer's zoom click still works) */
        ['contextmenu', 'dragstart'].forEach(type => document.addEventListener(type, e => {
            if (e.target.closest('.pj-page img, .pj-lightbox, .zoomable')) e.preventDefault();
        }));

        /* Menu button opens the panel in place (one choice per breakdown slot: 01, 02, 03…)
           and hides everything below it; the title and the picture stay visible */
        const menuBtn = $('pj-menu-btn'), panel = $('pj-panel'), pjPage = $('pj-page');
        const setPanel = open => {
            panel.hidden = !open; pjPage.classList.toggle('menu-open', open);
            menuBtn.setAttribute('aria-expanded', String(open));
        };
        /* Two columns: col-start / col-end mark where each column's line begins and ends */
        const stages = d.breakdown || [], rows = Math.ceil(stages.length / 2);
        $('pj-pick').style.setProperty('--rows', rows);
        $('pj-pick').innerHTML = stages.map((b, i) =>
            '<li style="--i:' + i + '"'
            + (i === rows || i === rows - 1 || i === stages.length - 1
                ? ' class="' + [i === rows ? 'col-start' : '', i === rows - 1 || i === stages.length - 1 ? 'col-end' : ''].join(' ').trim() + '"' : '')
            + '><button type="button" data-step="step-' + pad(i + 1) + '"><span>' + pad(i + 1) + '</span>'
            + esc(b.title || 'Drawing ' + pad(i + 1)) + '</button>'
            + '<button type="button" class="pj-dl" aria-label="Download ' + esc(b.title || 'stage ' + pad(i + 1)) + '" title="Download">'
            + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
            + '<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></button></li>').join('');
        $('pj-pick').addEventListener('click', e => {
            const btn = e.target.closest('button[data-step]');
            if (!btn) return;
            const step = $(btn.dataset.step);
            setPanel(false);
            step.scrollIntoView({ behavior: 'smooth', block: 'center' });
            step.classList.add('picked');
            setTimeout(() => step.classList.remove('picked'), 1600);
        });
        menuBtn.addEventListener('click', () => setPanel(panel.hidden));
        /* A click anywhere outside the menu closes it */
        document.addEventListener('click', e => {
            if (!panel.hidden && !panel.contains(e.target) && !menuBtn.contains(e.target)) setPanel(false);
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) setPanel(false); });
    })();

    /* Opening another project from the address bar (only the #hash changes) */
    window.addEventListener('hashchange', () => location.reload());
    </script>

    <!-- ── User accounts: Login / Register panel (auth.js + auth.css) ── -->
    <script src="auth.js"></script>

    <!-- ── Language switch (ES / IT via Google Website Translator) ── -->
    <div id="google_translate_element"></div>
    <script>
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'en', includedLanguages: 'es,it', autoDisplay: false }, 'google_translate_element');
        }
        const LANG_FLAGS = { en: '🇬🇧', es: '🇪🇸', it: '🇮🇹' };
        function toggleLangMenu(e) {
            e.stopPropagation();
            document.getElementById('lang-switch').classList.toggle('open');
        }
        document.addEventListener('click', (e) => {
            const ls = document.getElementById('lang-switch');
            if (ls && !ls.contains(e.target)) ls.classList.remove('open');
        });
        function setSiteLanguage(lang) {
            const expr = '/en/' + lang;
            document.cookie = 'googtrans=' + expr + '; path=/';
            document.cookie = 'googtrans=' + expr + '; path=/; domain=' + location.hostname;
            localStorage.setItem('migue100_lang', lang);
            location.reload();
        }
        function applyGlossary() {
            const lang = localStorage.getItem('migue100_lang') || 'en';
            if (lang === 'en') return;
            document.querySelectorAll('[data-i18n-' + lang + ']').forEach(el => {
                el.textContent = el.getAttribute('data-i18n-' + lang);
            });
        }
        (function() {
            const saved = localStorage.getItem('migue100_lang') || 'en';
            const flagEl = document.getElementById('lang-trigger-flag');
            if (flagEl) flagEl.textContent = LANG_FLAGS[saved] || LANG_FLAGS.en;
            document.querySelectorAll('.lang-menu .lang-btn').forEach(btn => {
                if (btn.dataset.lang === saved) { btn.classList.add('current'); btn.disabled = true; btn.setAttribute('aria-current', 'true'); }
            });
            applyGlossary();
        })();
    </script>
    <script>
        /* Google Translate (~150 KB) is only loaded when Spanish or Italian is selected —
           English is the page's own language, so most visits skip it */
        (function() {
            let lang = 'en';
            try { lang = localStorage.getItem('migue100_lang') || 'en'; } catch (e) {}
            if (lang === 'en' && !/googtrans=\/en\/(es|it)/.test(document.cookie)) return;
            const s = document.createElement('script');
            s.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
            document.body.appendChild(s);
        })();
    </script>
</body>
